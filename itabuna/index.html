<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Larco CRM · Itabuna</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* VOICE: ferramenta de trabalho diária, direta, sem enfeite
   IDEA: a prancheta do consultor — fila de ligações à esquerda, ficha do cliente à direita
   PICTURE: a própria fila com semáforo e o mapa da carteira
   COLOUR and TYPE: azul Larco #16226e/#2a5ae0, laranja #f7861a de destaque, amarelo #ffcc00 só em detalhe, vermelho #e2413b para alerta; Poppins nos títulos e números + Inter no texto
   LAYOUT: barra de indicadores no topo, abas, lista + ficha em duas colunas */
:root{--g:#16226e;--g2:#2a5ae0;--or:#f7861a;--ye:#ffcc00;--lime:#e7eeff;--coral:#e2413b;--amb:#f2a516;--ok:#1fa65a;--bg:#f2f4fa;--card:#fff;--ink:#141c46;--mut:#5b6386;--line:#e1e5f0}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Inter,system-ui,sans-serif}
h1,h2,h3{font-family:Poppins,Inter,sans-serif;margin:0;line-height:1.1}
button,input,select,textarea{font:inherit}
.btn{border:0;border-radius:8px;padding:9px 14px;background:var(--g);color:#fff;cursor:pointer;font-weight:600;min-height:40px}
.btn.sec{background:#fff;color:var(--g);border:1px solid var(--line)}
.btn:disabled{opacity:.5;cursor:default}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.row:focus-visible,button:focus-visible{outline:3px solid var(--ye);outline-offset:1px}
header{background:var(--g);color:#fff;padding:10px max(3vw,14px);display:flex;gap:14px;align-items:center;flex-wrap:wrap;border-bottom:3px solid var(--or)}
.brand{display:flex;align-items:center;gap:8px}.brand .lg{font:800 22px/1 Poppins,sans-serif;letter-spacing:.06em}.brand .crm{font:700 12px/1 Poppins,sans-serif;background:var(--or);color:#fff;border-radius:6px;padding:5px 7px;letter-spacing:.08em}
header .brand.home{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:8px;border-radius:10px;padding:4px 6px;margin-left:-6px;transition:background .15s}
header .brand.home:hover,header .brand.home:focus-visible{background:rgba(255,255,255,.12)}
.lgimg{height:30px;width:auto;display:block}.login .lgimg{height:38px}
header h1{font-size:20px}header .sp{flex:1}
header select{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.35);border-radius:8px;padding:7px 10px}header select option{color:var(--ink)}
header .btn.sec{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.45)}
header .who{font-size:13px;opacity:.85}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--line);border-bottom:1px solid var(--line)}
.kpi{background:var(--card);padding:12px 16px}.kpi b{display:block;font:700 24px Poppins,Inter,system-ui,sans-serif;white-space:nowrap}.kpi span{font-size:12.5px;color:var(--mut)}
.kpi.alert b{color:var(--coral)}
.spk{display:inline-flex;gap:2px;align-items:flex-end;height:18px;width:50px;vertical-align:middle}.spk i{flex:1;background:#b9c4ee;border-radius:2px 2px 0 0}.spk i.cur{background:var(--g2)}
.ev{font:700 11.5px Inter,sans-serif;border-radius:6px;padding:1px 5px;margin-left:4px}.ev.up{background:#e3f6ea;color:#127a3e}.ev.dn{background:#fdecea;color:#b32a22}.ev.eq{background:#eef1f9;color:var(--mut)}
.evl{display:inline-flex;align-items:center;margin-top:3px;white-space:nowrap}

.agrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px}
.ab{all:unset;box-sizing:border-box;cursor:pointer;border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;background:#fff;transition:transform .12s,border-color .12s}.ab:hover,.ab:focus-visible{border-color:var(--or);transform:translateY(-2px)}.ab:focus-visible{outline:3px solid var(--ye)}
.ab b{font:700 15px Poppins,sans-serif;color:var(--g)}.ab span{font-size:12.5px;color:var(--mut)}.ab em{font-style:normal;font-weight:700;color:#c25e00}.ab small{font-size:11.5px;color:var(--mut)}
.lnk{border:0;background:none;color:var(--g2);font:600 12.5px Inter,sans-serif;cursor:pointer;text-decoration:underline;margin-left:6px}

.alvo{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;background:#fff4e8;border:1px solid #fbd3a8;border-radius:12px;padding:10px 12px;margin-bottom:10px;font-size:13.5px}.alvo select{border:1px solid #f3b77a;border-radius:8px;padding:5px 8px;font-weight:700;color:var(--g)}.alvo-n b{color:var(--or)}
.alvo-v{color:#c25e00}.tag.c.pb{background:#ffe9d2;color:#a24c00}

.avi{display:block;object-fit:cover}.avi.av{width:36px;height:36px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 2px var(--g2)}.who2 .avi.av{width:30px;height:30px}
.hc{background:linear-gradient(120deg,var(--g),#1d36a8 60%,var(--g2));color:#fff;padding:18px max(3vw,14px);position:relative;overflow:hidden}
.hc::after{content:'';position:absolute;right:-60px;top:-90px;width:300px;height:300px;border-radius:50%;background:radial-gradient(circle,rgba(247,134,26,.35),transparent 65%)}
.hc-in{position:relative;z-index:1;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.hc-ph{width:92px;height:92px;border-radius:22px;overflow:hidden;border:3px solid var(--ye);box-shadow:0 6px 18px rgba(0,0,0,.25);flex:none;background:var(--g2)}.hc-ph img{width:100%;height:100%;object-fit:cover}
.hc-ph.ini{display:grid;place-items:center;font:800 30px Poppins,sans-serif}
.hc-t{flex:1;min-width:220px}.hc-t h2{font:800 clamp(22px,2.6vw,30px)/1.1 Poppins,sans-serif;margin:0}.hc-t .hsub{margin:6px 0 0;opacity:.92;font-size:14px}.hc-t .hsub b{color:var(--ye)}
.hc-meta{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);border-radius:14px;padding:10px 14px;min-width:220px}.hc-meta span{font-size:12px;opacity:.85}.hc-meta b{display:block;font:800 26px Poppins,sans-serif}.hc-meta em{font-style:normal;font-size:12px;color:var(--ye)}.hc-meta .track{background:rgba(255,255,255,.2);margin:4px 0}

.btn.sm{min-height:34px;padding:6px 12px;font-size:13px;background:var(--or)}
.modal{position:fixed;inset:0;background:rgba(20,28,70,.45);display:grid;place-items:center;z-index:5000;padding:16px}
.mbox{background:#fff;border-radius:18px;padding:20px;width:min(720px,100%);box-shadow:0 20px 60px rgba(0,0,0,.25)}.mbox h3{margin:0;font:700 19px Poppins,sans-serif;color:var(--g)}.mbox .sub{margin:4px 0 12px}
.mi{width:110px;border:1px solid var(--line);border-radius:8px;padding:6px 8px;text-align:right;font:600 14px Inter,sans-serif}.mact{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}

.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}.seg button{border:0;background:none;padding:7px 13px;font:600 13px Inter,sans-serif;color:var(--mut);cursor:pointer}.seg button.on{background:var(--g);color:#fff}
.hero{background:linear-gradient(120deg,var(--g) 0%,#1d36a8 55%,var(--g2) 100%);color:#fff;padding:26px max(3vw,14px) 64px;position:relative;overflow:hidden}
.hero::after{content:'';position:absolute;right:-80px;top:-120px;width:360px;height:360px;border-radius:50%;background:radial-gradient(circle,rgba(247,134,26,.35),transparent 65%)}
.hin{position:relative;z-index:1;max-width:1320px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.6fr);gap:22px;align-items:end}
@media(max-width:1000px){.hin{grid-template-columns:1fr}}
.eyebrow{margin:0 0 6px;color:var(--ye);font-weight:600;font-size:13px;letter-spacing:.02em}
.hero h2{font:800 clamp(26px,3.2vw,38px)/1.05 Poppins,sans-serif;margin:0}.hsub{margin:8px 0 0;opacity:.85;font-size:14px}
.hk{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}@media(max-width:700px){.hk{grid-template-columns:repeat(2,minmax(0,1fr))}}
.hk>div{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);border-radius:14px;padding:12px 14px;backdrop-filter:blur(4px)}
.hk span{display:block;font-size:12px;opacity:.85}.hk b{display:block;font:800 26px/1.15 Poppins,sans-serif;white-space:nowrap;margin-top:2px}.hk b small{font-size:13px;font-weight:600;opacity:.8}
.hk em{display:block;font-style:normal;font-size:12px;color:var(--ye);margin-top:2px}.hk .warn{background:rgba(226,65,59,.28);border-color:rgba(255,160,150,.5)}
main.eq{max-width:1320px;margin:-44px auto 0;padding:0 max(3vw,14px) 40px;position:relative;z-index:2}
.blk{background:var(--card);border-radius:18px;padding:18px 20px;margin-bottom:16px;box-shadow:0 2px 0 rgba(22,34,110,.04),0 10px 30px rgba(22,34,110,.06)}
.bh{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:12px}.bh h3{margin:0;font:700 19px Poppins,sans-serif;color:var(--g)}.bh .sub{margin:2px 0 0;font-size:13px;color:var(--mut)}
.bh-r{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.bh-r select{border:1px solid var(--line);border-radius:10px;padding:7px 10px;background:#fff;font:500 13px Inter,sans-serif}
.strip{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin-bottom:14px}@media(max-width:900px){.strip{grid-template-columns:repeat(2,minmax(0,1fr))}}
.st{background:#f5f7fd;border-radius:12px;padding:10px 12px}.st b{display:block;font:800 22px/1.15 Poppins,sans-serif;color:var(--g)}.st span{font-size:12px;color:var(--mut)}.st.ok b{color:var(--ok)}.st.alert{background:#fdecea}.st.alert b{color:var(--coral)}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.pc{border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;transition:transform .15s,box-shadow .15s}.pc:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(22,34,110,.08)}
.pc.zero{background:#fff8f7;border-color:#f6cdc8}
.pc-h{display:flex;gap:10px;align-items:center}.pc-h b{display:block;font-size:14px;line-height:1.2}.pc-h small{color:var(--mut);font-size:12px}
.av{flex:none;width:36px;height:36px;border-radius:50%;background:var(--g);color:#fff;display:grid;place-items:center;font:700 13px Poppins,sans-serif}.av.ext{background:var(--or)}
.pc-n{display:grid;grid-template-columns:auto 1fr;align-items:baseline;gap:0 8px}.pc-n b{font:800 28px/1 Poppins,sans-serif;color:var(--g)}.pc-n span{font-size:12px;color:var(--mut)}
.spark{grid-column:1/-1;height:5px;background:#eef1f9;border-radius:3px;overflow:hidden;margin-top:6px}.spark i{display:block;height:100%;background:linear-gradient(90deg,var(--g2),var(--or))}
.res{display:flex;height:8px;border-radius:4px;overflow:hidden;background:#eef1f9}.res i{display:block}
.v{background:var(--ok)}.q{background:#7b8cf0}.l{background:var(--coral)}.o{background:#c8cee0}.e{background:#eef1f9}.f{background:var(--or)}
.pc-m{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--mut)}.pc-m b{color:var(--ink)}
.pc-f{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--mut);border-top:1px dashed var(--line);padding-top:7px}.pc-f .pend{color:var(--coral);font-weight:600}.pc-f .late{color:var(--coral);font-weight:600}
.legend .sq{display:inline-block;width:10px;height:10px;border-radius:3px}
.chips{display:flex;gap:6px;flex-wrap:wrap}.chips button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 12px;font:600 12.5px Inter,sans-serif;color:var(--mut);cursor:pointer}.chips button.on{background:var(--or);border-color:var(--or);color:#fff}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.cc{all:unset;box-sizing:border-box;cursor:pointer;border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:9px;background:#fff;transition:transform .15s,box-shadow .15s,border-color .15s}
.cc:hover,.cc:focus-visible{transform:translateY(-3px);box-shadow:0 12px 26px rgba(22,34,110,.1);border-color:var(--g2)}.cc:focus-visible{outline:3px solid var(--ye)}
.cc-top{display:flex;align-items:center;gap:8px}.code{font:800 18px Poppins,sans-serif;color:var(--g)}.pill{font-size:11px;background:var(--lime);color:var(--g);border-radius:999px;padding:2px 8px;font-weight:600}
.badge{margin-left:auto;background:var(--coral);color:#fff;font:700 12px Poppins,sans-serif;border-radius:999px;padding:3px 9px}
.who2{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:600}.who2 .av{width:28px;height:28px;font-size:11px}.who2 small{font-weight:500;color:var(--mut)}
.cc-num{display:grid;grid-template-columns:1fr 1fr;gap:8px}.cc-num b{display:block;font:800 22px/1.1 Poppins,sans-serif}.cc-num span{font-size:11.5px;color:var(--mut)}
.track{height:7px;background:#eef1f9;border-radius:4px;overflow:hidden}.track i{display:block;height:100%;background:linear-gradient(90deg,var(--g2),var(--or));border-radius:4px}
.cc-row{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--mut)}.cc-row b{color:var(--ink);margin-left:auto}
.ring{width:22px;height:22px;border-radius:50%;background:conic-gradient(var(--g2) calc(var(--p)*1%),#e6eaf5 0);-webkit-mask:radial-gradient(circle 7px,transparent 98%,#000 100%);mask:radial-gradient(circle 7px,transparent 98%,#000 100%)}
.semf{display:flex;height:6px;border-radius:3px;overflow:hidden;background:#eef1f9}.semf i{display:block;height:100%}
.cc-foot{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:2px 10px;font-size:11.5px;color:var(--mut)}.cc-foot b{color:var(--g)}
.dias{display:grid;grid-template-columns:repeat(14,minmax(0,1fr));gap:8px;align-items:end;height:220px}
.dcol{display:flex;flex-direction:column;align-items:center;height:100%;justify-content:flex-end;font-size:11px}
.dcol .n{font:700 12px Poppins,sans-serif;color:var(--g);min-height:15px}
.dcol .pil{width:72%;height:120px;display:flex;flex-direction:column-reverse;background:#f2f4fa;border-radius:8px 8px 3px 3px;overflow:hidden}.dcol .pil i{display:block;width:100%}
.dcol .vol{width:72%;height:30px;display:flex;align-items:flex-start;margin-top:3px}.dcol .vol i{display:block;width:100%;background:var(--or);border-radius:0 0 6px 6px;opacity:.85}
.dcol .vn{font-size:10.5px;color:var(--or);font-weight:600;min-height:13px}.dcol .dl{color:var(--mut);margin-top:2px;white-space:nowrap}.dcol.fds{opacity:.4}.dcol.hj .dl{color:var(--or);font-weight:700}.dcol.hj .pil{box-shadow:0 0 0 2px var(--or)}
@media(max-width:700px){.dias{gap:3px}.dcol .vn{display:none}}
table.atvt td,table.atvt th{white-space:nowrap}table.atvt tr.zero td{background:#fff8f7}
.mot{display:grid;grid-template-columns:180px 1fr 40px;gap:10px;align-items:center;margin:6px 0;font-size:13.5px;color:var(--ink)}
.login-wrap{min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,var(--g),#1d36a8 60%,var(--g2));padding:20px}
.login .brand{justify-content:center;margin-bottom:6px}.login .brand .lg{color:var(--g);font-size:30px}.login .brand .crm{font-size:14px}


.kpi.wide b{font-size:17px;white-space:normal;line-height:1.35}.bar.sm{display:inline-block;width:70px;margin:0 6px 0 0;vertical-align:middle}
.bar{height:6px;border-radius:3px;background:#e7ecea;margin-top:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--g)}
nav.tabs{display:flex;gap:4px;padding:10px max(3vw,14px) 0;flex-wrap:wrap}
nav.tabs button{border:0;background:none;padding:10px 14px;border-radius:8px 8px 0 0;cursor:pointer;color:var(--mut);font-weight:600}
.ctt{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;align-items:center;background:#f3f6ff;border-radius:8px;padding:8px 10px;margin:6px 0 10px;font-size:13px}.ctt .cbt{display:flex;gap:6px}.btn.wa{background:#1fa855;border-color:#1fa855;color:#fff}.btn.wa:hover{background:#178a45}.wa-mini{border:0;background:#e7f7ee;border-radius:50%;width:34px;height:34px;font-size:16px;cursor:pointer;flex:none;margin-left:6px}.wa-mini:hover{background:#c9efd9}.row:has(.wa-mini){grid-template-columns:14px minmax(0,1fr) auto auto}
.gnota{background:#fff6e6;border-left:3px solid var(--or);padding:6px 10px;border-radius:6px;font-size:13px;margin:4px 0 8px}.sug{font-size:13px;color:var(--g);background:#eef2ff;border-radius:6px;padding:6px 10px}.row.grp .nm{color:var(--g)}details.feitos{margin-top:10px;border-top:1px dashed #cfd5e6;padding-top:6px}details.feitos summary{cursor:pointer;font-weight:600;color:#2e7d32;padding:6px 4px}details.feitos .row{opacity:.75}tr.lk{cursor:pointer}tr.lk:hover td{background:#f5f7ff}
.leva{color:var(--g);font-size:12px}.leva b{color:var(--or)}table.sem tr.hj td{background:#fff6e6}table.sem td:nth-child(2){min-width:120px}

main{padding:0 max(3vw,14px) 30px}
.wrap{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:14px;background:var(--card);border-radius:0 10px 10px 10px;padding:14px;min-height:70vh}

.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}

.list{max-height:72vh;overflow:auto;border:1px solid var(--line);border-radius:8px}

.empty{color:var(--mut);padding:30px;text-align:center}

.login input{width:100%;border:1px solid var(--line);border-radius:8px;padding:11px;margin-bottom:10px;font-size:16px}
.err{color:#b2402c;font-size:13px;min-height:18px}
.sup table td{white-space:nowrap}.sup tr.click{cursor:pointer}.sup tr.click:hover{background:#f6faf9}

.scroll{overflow-x:auto}

/* ---------- API ---------- */
async function auth(body, grant) {
  const r = await fetch(`${SB_URL}/auth/v1/token?grant_type=${grant}`, {method:'POST', headers:{apikey:SB_KEY,'Content-Type':'application/json'}, body:JSON.stringify(body)});
  const j = await r.json(); if (!r.ok) throw new Error(j.error_description || j.msg || 'Falha no login');
  S.token = j.access_token; S.refresh = j.refresh_token; S.user = j.user; S.exp = Date.now() + (j.expires_in - 60) * 1000;
  try { localStorage.setItem('larcocrm_itb_rt', j.refresh_token); } catch(e) {}
}
async function api(path, opt = {}) {
  if (S.exp && Date.now() > S.exp && S.refresh) await auth({refresh_token:S.refresh}, 'refresh_token');
  const go = () => fetch(`${SB_URL}/rest/v1/${path}`, {...opt, headers:{apikey:SB_KEY, Authorization:`Bearer ${S.token}`, 'Content-Type':'application/json', ...(opt.headers||{})}});
  let r = await go();
  if (r.status >= 500 && (!opt.method || opt.method === 'GET')) { await new Promise(res => setTimeout(res, 1200)); r = await go(); }
  if (!r.ok) { const t = await r.text(); throw new Error(t.slice(0,300)); }
  const t = await r.text(); return t ? JSON.parse(t) : null;
}

/* ---------- LOGIN ---------- */
function telaLogin(err='') {
  $('#app').innerHTML = `<div class="login-wrap"><form class="login" id="fl"><div class="brand"><img class="lgimg" src="${LOGO_B}" alt="Larco"><span class="crm">CRM · Itabuna</span></div><p>Entre com seu e-mail e senha.</p>
    <input id="em" type="email" placeholder="E-mail" autocomplete="username" required>
    <input id="pw" type="password" placeholder="Senha" autocomplete="current-password" required>
    <div class="err">${esc(err)}</div><button class="btn" style="width:100%">Entrar</button></form></div>`;
  $('#fl').onsubmit = async e => { e.preventDefault(); const b = e.target.querySelector('button'); if (b) { b.disabled = true; b.textContent = 'Entrando…'; }
    try { await auth({email:$('#em').value.trim(), password:$('#pw').value}, 'password'); } catch(x) { return telaLogin('E-mail ou senha incorretos.'); }
    try { await iniciar(); } catch(x) { telaLogin('Login ok, mas o CRM demorou para carregar. Tente entrar de novo em alguns segundos.'); } };
}

const PROD_NOME = {DIESEL:'Diesel', GASOLINA:'Gasolina', ETANOL:'Etanol'};
function totProd() {
  const t = {}; Object.values(S.prod || {}).forEach(ps => (ps||[]).forEach(p => { if (p.mercado == null) return; const k = p.p; t[k] = t[k] || {mercado:0, larco:0, potencial:0}; t[k].mercado += +p.mercado||0; t[k].larco += +p.larco||0; t[k].potencial += +p.potencial||0; }));
  return Object.entries(t).filter(([k,v]) => v.mercado >= 1).sort((a,b) => b[1].potencial - a[1].potencial);
}
function kpiProd() {
  const t = totProd(); if (!t.length) return '';
  return `<div class="kpi wide"><b>${t.map(([k,v]) => `${esc(PROD_NOME[k]||k)} ${nf(v.potencial)}`).join(' · ')}</b><span>Potencial a conquistar por produto (m³/mês, clientes + prospects)</span></div>`;
}
function secaoProd(id) {
  const ps = (S.prod?.[id] || []).filter(p => p.mercado != null && +p.mercado > 0); if (!ps.length) return '';
  return `<h3>Potencial por produto (Espião × Larco, m³/mês)</h3><div class="scroll"><table><tr><th>Produto</th><th class="r">Mercado</th><th class="r">Larco</th><th class="r">Espaço</th><th>Share Larco</th></tr>${ps.map(p => { const sh = Math.min(100, 100*(+p.larco||0)/(+p.mercado||1)); return `<tr><td>${esc(PROD_NOME[p.p]||p.p)}</td><td class="r">${nf(p.mercado)}</td><td class="r">${nf(p.larco,1)}</td><td class="r"><b>${nf(p.potencial)}</b></td><td><div class="bar sm"><i style="width:${Math.max(2,sh)}%"></i></div><span class="sub">${nf(sh,0)}%</span></td></tr>`; }).join('')}</table></div>`;
}
function secaoSemana(id) {
  const s = S.sem?.[id]; if (!s || !s.dias_total) return '';
  const hab = s.dias_habituais || [], hj = diaHoje();
  const linhas = [1,2,3,4,5,6,7].map(d => { const r = (s.dias||[]).find(z => z.d === d); if (!r) return '';
    const pct = Math.round(100 * (+r.pct||0)), h = hab.includes(d);
    return `<tr class="${d===hj?'hj':''}"><td>${DOW[d][2]}${h?' <span class="tag d">habitual</span>':''}</td><td><div class="bar sm"><i style="width:${Math.max(3,pct)}%"></i></div><span class="sub">${pct}% · ${r.n}x</span></td><td>${(r.prods||[]).map(p => `${esc(PNOME(p.p))} <b>${nf(p.m3, (+p.m3<10 && +p.m3%1)?1:0)}</b>`).join(' · ')}</td></tr>`; }).join('');
  return `<h3>Dia da semana em que compra (últimos 120 dias · ${s.dias_total} compras)</h3>${hab.length?`<div class="sub" style="font-size:13px;margin-bottom:6px">Costuma comprar às <b>${esc(txtHab(id))}</b>. Volumes = média por compra naquele dia.</div>`:'<div class="sub" style="font-size:13px;margin-bottom:6px">Sem dia fixo. Volumes = média por compra naquele dia.</div>'}<div class="scroll"><table class="sem"><tr><th>Dia</th><th>Frequência</th><th>Produtos (m³ por compra)</th></tr>${linhas}</table></div>`;
}
function secaoDist(id) {
  const ds = S.dist[id]?.distribuidoras || []; if (!ds.length) return '';
  const tot = ds.reduce((s,x) => s + (+x.m3||0), 0) || 1;
  return `<h3>Compra hoje de (Espião, média mensal)</h3>` + ds.map(x => `<div class="dbar ${x.d==='LARCO'?'larco':''}"><span>${esc(x.d)}</span><div class="bar"><i style="width:${Math.max(3,100*(+x.m3||0)/tot)}%"></i></div><span class="r">${nf(x.m3)} m³</span></div>`).join('');

function legenda() { return `<div class="legend"><span><i class="dot verde"></i>Comprando</span><span><i class="dot amarelo"></i>Esfriando</span><span><i class="dot vermelho"></i>Parado</span><span><i class="dot sem_compra"></i>Prospect (bandeira branca)</span></div>`; }
function desenharMapa() {
  if (typeof L === 'undefined') { $('#map').innerHTML = '<div class="empty">Mapa indisponível (sem conexão com o servidor de mapas).</div>'; return; }
  const m = L.map('map').setView([-7.5, -39], 6); const tiles = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', {maxZoom:18, attribution:'Tiles © Esri'}).addTo(m);
  let falhas = 0; tiles.on('tileerror', () => { if (++falhas === 4) { m.removeLayer(tiles); $('#map').style.background = '#eef3f1'; } });
  L.geoJSON(UFS_GEO, {style:{color:'#00463c', weight:1.2, fillColor:'#dfe9e5', fillOpacity:.25}, interactive:false}).addTo(m);
  UFS_GEO.features.forEach(f => { const b = L.geoJSON(f).getBounds(); L.marker(b.getCenter(), {icon:L.divIcon({className:'uflbl', html:f.properties.uf}), interactive:false}).addTo(m); });
  const cor = {verde:'#2f9e5b', amarelo:'#f2b233', vermelho:'#ff6f59', sem_compra:'#8e7cc3'};
  const pts = S.rows.filter(x => x.lat && x.lon && (ehProsp(x) || x.ultima_compra));
  pts.forEach(x => {
    const r = !x.ultima_compra ? 5 + Math.min(12, Math.sqrt(x.vmm_mercado||0)/3) : 5 + Math.min(12, Math.sqrt((x.volume_12m||0)/12)/3);
    L.circleMarker([x.lat, x.lon], {radius:r, color:'#fff', weight:1, fillColor:cor[x.semaforo], fillOpacity:.85}).addTo(m)
      .bindPopup(`<b>${esc(x.razao_social)}</b><br>${esc(x.municipio||'')}<br>${!x.ultima_compra ? (x.vmm_mercado?nf(x.vmm_mercado)+' m³/mês no mercado':'Prospect') : nf((x.volume_12m||0)/12)+' m³/mês com a Larco'}`);
  });
  if (pts.length) m.fitBounds(pts.map(x => [x.lat, x.lon]), {padding:[20,20]}); else m.setView([-8, -37], 6);
  const sem = S.rows.filter(x => !x.lat && (ehProsp(x) || x.ultima_compra)).length;
  if (sem) $('.legend').insertAdjacentHTML('beforeend', `<span>${sem} sem coordenada no cadastro ANP</span>`);
}

const regiao = c => { const m = c.match(/^(ITABUNA|PE|AL|PB|RN|CE|JUA|MA|PI|SNP)/); return m ? m[1] : c.split(' ')[0]; };
const iniciais = n => (n||'?').split(' ').filter(Boolean).slice(0,2).map(x=>x[0]).join('').toUpperCase();
function desenharCarteiras() {
  const ext = {}; (S.pessoas||[]).filter(p => p.perfil === 'externo').forEach(p => (p.carteiras||'').split(', ').forEach(c => ext[c] = p.nome.split(' ')[0]));
  const hoje = {}; (S.pessoas||[]).filter(p => p.perfil !== 'externo').forEach(p => (p.carteiras||'').split(', ').forEach(c => hoje[c] = +p.contatos||0));
  let R = S.resumo.filter(r => !S.fReg || regiao(r.carteira_codigo) === S.fReg);
  const o = {proj:(a,b)=>(+b.projecao_m3||0)-(+a.projecao_m3||0), pend:(a,b)=>(+b.pendencias||0)-(+a.pendencias||0), posit:(a,b)=>(+a.positivacao_pct||0)-(+b.positivacao_pct||0), nome:(a,b)=>a.carteira_codigo.localeCompare(b.carteira_codigo)};
  R = [...R].sort(o[S.ordC]);
  const mxP = Math.max(1, ...S.resumo.map(r => +r.projecao_m3||0));
  $('#carts').innerHTML = R.map(r => { const v=+r.verdes||0, a=+r.amarelos||0, m=+r.vermelhos||0, t=Math.max(1,v+a+m); const pos=+r.positivacao_pct||0;
    const pctMeta = r.meta_m3 ? Math.min(100, 100*r.projecao_m3/r.meta_m3) : 100*(+r.projecao_m3||0)/mxP;
    return `<button class="cc" data-c="${esc(r.carteira_codigo)}">
      <div class="cc-top"><span class="code">${esc(r.carteira_codigo)}</span>${r.aceita_prospect===false?'<span class="pill">fixa</span>':''}${+r.pendencias?`<span class="badge" title="clientes aguardando contato">${r.pendencias}</span>`:''}</div>
      <div class="who2">${AV[CART_AV[r.carteira_codigo]] ? avImg(CART_AV[r.carteira_codigo], "av") : `<span class="av">${iniciais(r.consultor_nome)}</span>`}<span>${esc(r.consultor_nome||'')}${ext[r.carteira_codigo]?`<small> + ${esc(ext[r.carteira_codigo])} (externo)</small>`:''}</span></div>
      <div class="cc-num"><div><b>${nf(r.volume_mes)}</b><span>m³ no mês</span></div><div><b>${nf(r.projecao_m3)}</b><span>projeção${r.meta_m3?` · meta ${nf(r.meta_m3)}`:''}</span></div></div>

/* ---------- MINHAS VENDAS + RANKING POR REGIÃO (topo dos Pedidos do dia) ---------- */
const REGIOES = ['Suape e Cabedelo','Maranhão','Juazeiro e Teresina','Sinop'];
function rankVendas() {
  const V = P.vend; if (!V || !V.carteiras) return [];
  const dm = +V.dias_mes || 1, dd = Math.max(1, (+V.dias_ate_hoje || 1) - pesoDia(P.data));
  const g = {};
  V.carteiras.forEach(c => { const k = (c.regiao || '') + '|' + (c.consultor || c.carteira);
    const x = g[k] = g[k] || {consultor:c.consultor || c.carteira, regiao:c.regiao || 'Outras', carts:[], conf:0, vir:0, res:0, fat:0, meta:0, temMeta:false, cp:{}, rp:{}};
    x.carts.push(c.carteira); x.conf += +c.conf_m3||0; x.vir += +c.vir_m3||0; x.res += +c.res_m3||0; x.fat += +c.fat_mes_m3||0;
    if (c.meta_mes_m3 != null) { x.meta += +c.meta_mes_m3; x.temMeta = true; }
    GORD.forEach(p => { x.cp[p] = (x.cp[p]||0) + (+(c.conf_prod||{})[p]||0); x.rp[p] = (x.rp[p]||0) + (+(c.res_prod||{})[p]||0); }); });
  const L = Object.values(g).map(x => { const real = x.fat + x.conf; return {...x, real, pct: x.temMeta && x.meta ? 100*real/x.meta : null, proj: x.fat/dd*dm}; });
  L.sort((a,b) => (b.pct != null) - (a.pct != null) || (b.pct||0) - (a.pct||0) || b.real - a.real);
  const pos = {}; L.forEach(x => { if (x.pct != null) { pos[x.regiao] = (pos[x.regiao]||0) + 1; x.pos = pos[x.regiao]; } else x.pos = null; });
  L.nReg = pos;
  return L;
}
function pesoDia(d0) { const d = new Date(d0 + 'T12:00:00').getDay(); return d === 0 ? 0 : d === 6 ? 0.5 : 1; }
function painelVendas() {
  const V = P.vend; if (!V || !V.carteiras) return '';

  const equipe = S.gestao || !minhas.size;
  const meus = equipe ? L : L.filter(x => x.carts.some(c => minhas.has(c)));
  if (!meus.length) return '';
  const sum = k => meus.reduce((t, x) => t + (+x[k]||0), 0);
  const conf = sum('conf'), vir = sum('vir'), res = sum('res'), fat = sum('fat'), meta = meus.filter(x => x.temMeta).reduce((t,x) => t + x.meta, 0);
  const real = fat + conf, dm = +V.dias_mes || 1, dd = Math.max(1, (+V.dias_ate_hoje || 1) - pesoDia(P.data)), proj = fat/dd*dm;
  const metaDia = meta ? meta/dm*pesoDia(P.data) : null;
  const pctDia = metaDia ? 100*conf/metaDia : null, pctMes = meta ? 100*real/meta : null;

  const quem = equipe ? 'Equipe' : (meus.length === 1 ? meus[0].consultor : (S.me.nome || '').split(' ')[0]);
  const regs = REGIOES.filter(r => L.some(x => x.regiao === r)).concat([...new Set(L.map(x => x.regiao))].filter(r => !REGIOES.includes(r)));
  const minhaReg = !equipe ? meus[0].regiao : null;
  if (!S.mvReg || !regs.includes(S.mvReg)) S.mvReg = minhaReg || regs[0];
  const posTxt = !equipe && meus.length === 1 && meus[0].pos ? `<div class="mv-pos"><b>${meus[0].pos}º</b><span>de ${L.nReg[meus[0].regiao]} em ${esc(meus[0].regiao)}</span></div>` : '';

  const medal = i => i === 1 ? '🥇' : i === 2 ? '🥈' : i === 3 ? '🥉' : `${i}º`;
  const eu = x => !equipe && x.carts.some(c => minhas.has(c));

  const chips = `<div class="chips mv-reg">${regs.map(r => `<button data-r="${esc(r)}" class="${r===S.mvReg?'on':''}">${esc(r)}</button>`).join('')}</div>`;
  const rank = `${chips}<div class="scroll"><table class="ptab mv-rank"><thead><tr><th>#</th><th>Consultor</th><th class="r">Vendido hoje</th><th class="r">Reservas hoje</th><th class="r">Mês (m³)</th><th class="r">Meta do mês</th><th>Realizado ÷ meta</th><th class="r">Projeção</th></tr></thead><tbody>
    ${LR.map(x => `<tr class="${eu(x) ? 'eu' : ''}"><td class="mv-m">${x.pos ? medal(x.pos) : '—'}</td><td><b>${esc(x.consultor)}</b><small>${esc(x.carts.join(' + '))}</small></td>
      <td class="r">${nf(x.conf,1)}${x.vir ? `<small>${nf(x.vir,1)} virados</small>` : ''}</td><td class="r">${x.res ? nf(x.res,1) : '<span class="mut">—</span>'}</td><td class="r"><b>${nf(x.real)}</b></td><td class="r">${x.temMeta ? nf(x.meta) : '<span class="mut">sem meta</span>'}</td>
      <td>${x.pct != null ? `<div class="mv-pc">${bar(x.pct)}<b>${nf(x.pct,0)}%</b></div>` : '<span class="mut">—</span>'}</td><td class="r">${nf(x.proj)}</td></tr>`).join('')}
    <tr class="mv-tot"><td></td><td><b>Total ${esc(S.mvReg)}</b></td><td class="r"><b>${nf(tot('conf'),1)}</b></td><td class="r">${nf(tot('res'),1)}</td><td class="r"><b>${nf(tot('real'))}</b></td><td class="r">${tMeta ? nf(tMeta) : '–'}</td><td>${tMeta ? `<div class="mv-pc">${bar(100*tot('real')/tMeta)}<b>${nf(100*tot('real')/tMeta,0)}%</b></div>` : ''}</td><td class="r">${nf(tot('proj'))}</td></tr></tbody></table></div>`;
  return `<section class="blk mv"><div class="bh"><div><h3>${equipe ? 'Vendas da equipe' : 'Minhas vendas'} · ${esc(quem)}</h3>
      <p class="sub">Vendido hoje = pedidos confirmados + virados (saem faturados hoje). Reservas contadas separadas. Mês = faturado no Qlik${fatAte ? ` até ${fatAte}` : ''} + vendido hoje.</p></div>${posTxt}</div>
    <div class="mv-k">
      <div><span>Vendido hoje</span><b>${nf(conf,1)} m³</b>${metaDia ? `${bar(pctDia)}<em>${nf(pctDia,0)}% da meta do dia (${nf(metaDia)} m³)${vir ? ` · inclui ${nf(vir,1)} m³ virados` : ''}</em>` : `<em>sem meta cadastrada${vir ? ` · inclui ${nf(vir,1)} m³ virados` : ''}</em>`}</div>
      <div><span>Reservas hoje</span><b>${nf(res,1)} m³</b><em>${res10}</em></div>
      <div><span>Realizado no mês</span><b>${nf(real)} m³</b>${meta ? `${bar(pctMes)}<em>${nf(pctMes,0)}% da meta de ${nf(meta)} m³</em>` : '<em>sem meta cadastrada</em>'}</div>
      <div><span>Projeção de fechamento</span><b>${nf(proj)} m³</b><em>${meta ? (proj >= meta ? '✅ no ritmo da meta' : `faltam ${nf(meta - proj)} m³ no ritmo até ontem`) : 'no ritmo até ontem'}</em></div>
    </div>
    <div class="scroll"><table class="ptab mv-prod"><thead><tr><th>Hoje por produto (m³)</th>${GORD.map(g => `<th class="r">${GR[g]}</th>`).join('')}</tr></thead><tbody>
      <tr><td>Vendido</td>${GORD.map(g => `<td class="r">${cp[g] ? nf(cp[g],1) : '<span class="mut">—</span>'}</td>`).join('')}</tr>

    <details class="mv-d" ${S.mvAberto === false ? '' : 'open'}><summary>🏁 Ranking do mês por região · realizado ÷ meta do mês (vendido hoje já conta)</summary>${rank}</details>
  </section>`;
}

async function lancarPed(R) {
  const msg = $('#pMsg'); const body = {data:P.data, filial:P.fil, terminal_id:+$('#pTerm').value, status: R.resAberta ? P.st : 'C', observacao: ($('#pObs').value || '').trim() || null};
  let tot = 0; document.querySelectorAll('.pvol input').forEach(i => { const v = +(i.value || '').replace(/\D/g, ''); body[i.dataset.k] = v; tot += v; });
  if (P.novo) { const n = ($('#pNome').value || '').trim(); if (!n) { msg.textContent = 'Informe o nome do cliente.'; return; } body.cliente_nome = n; body.carteira = $('#pCart').value; }
  else if (!P.cli) { msg.textContent = 'Escolha o cliente ou o grupo.'; return; }
  else if (P.cli.tipo === 'grp') { body.grupo_economico = P.cli.grupo; body.carteira = P.cli.carteira; body.cliente_nome = P.cli.grupo; }
  else { body.cliente_id = P.cli.id; body.carteira = P.cli.carteira; body.cliente_nome = P.cli.nome; }
  if (P.cli && outraCart(P.cli.carteira)) { body.carteira_cliente = P.cli.carteira; body.carteira = $('#pMinha') ? $('#pMinha').value : S.carteiras[0]; }
  if (!tot) { msg.textContent = 'Informe o volume em litros.'; return; }

  try {

    const s = r && r[0] ? r[0].status : body.status;

    if (s === 'A') toast('Sem saldo: pedido enviado para autorização de Hugo/Gabriel. ' + (r[0].motivo_autorizacao || ''));

}
async function acaoPed(a, id) {
  const p = P.peds.find(x => x.id === id); if (!p) return;
  try {
    if (a === 'aut') await api(`pedidos?id=eq.${id}`, {method:'PATCH', body:JSON.stringify({status:p.status_pedido || 'C'})});
    if (a === 'neg') await api(`pedidos?id=eq.${id}`, {method:'PATCH', body:JSON.stringify({status:'N'})});
    if (a === 'canc') await api(`pedidos?id=eq.${id}`, {method:'PATCH', body:JSON.stringify({status:'X'})});
    if (a === 'conf') { const r = await api(`pedidos?id=eq.${id}&select=status,motivo_autorizacao`, {method:'PATCH', headers:{Prefer:'return=representation'}, body:JSON.stringify({status:'C'})});
      if (r && r[0] && r[0].status === 'A') toast('Sem saldo para confirmar: foi para autorização. ' + (r[0].motivo_autorizacao || '')); }
    if (a === 'edit') return abrirEdicao(p);
    if (a === 'virar') { await rpc('virar_pedido', {p_id:id, p_para:relogio().hoje}); toast('Pedido virado para hoje'); }
    if (['aut','neg','canc'].includes(a)) toast({aut:'Pedido autorizado', neg:'Pedido negado', canc:'Pedido cancelado'}[a]);
    await carregarPed();
  } catch(x) { toast(errTxt(x)); }
}

  const nome = id => (pessoas.find(p => p.id === id) || {}).nome || '?';
  const carts = S.resumo.map(r => r.carteira_codigo);
  const cons = c => (S.resumo.find(r => r.carteira_codigo === c) || {}).consultor_nome || '';
  const sab = (() => { const d = hojeSP(); d.setDate(d.getDate() + ((6 - d.getDay() + 7) % 7)); return iso(d); })();
  const d = document.createElement('div'); d.className = 'modal';
  const grupos = {}; lista.forEach(c => { const k = [c.usuario_id, c.inicio, c.fim, c.motivo].join('|'); (grupos[k] = grupos[k] || {...c, carts:[], ids:[]}); grupos[k].carts.push(c.carteira); grupos[k].ids.push(c.id); });
  d.innerHTML = `<div class="mbox" style="width:min(760px,100%)"><h3>Plantões e substituições</h3>
    <p class="sub">Quem cobre uma carteira vê os clientes dela no CRM e lança pedidos nela (desconta da cota da carteira coberta) durante o período. Depois o acesso sai sozinho.</p>
    <div class="cobl">${Object.values(grupos).map(g => `<div class="cobi"><div><b>${esc(nome(g.usuario_id))}</b> cobre <b>${g.carts.map(esc).join(', ')}</b><small>${MOTIVO_COB[g.motivo]} · ${g.inicio === g.fim ? dt(g.inicio) : `${dt(g.inicio)} a ${dt(g.fim)}`}${g.observacao ? ' · ' + esc(g.observacao) : ''}</small></div><button class="btn sm sec" data-del="${g.ids.join(',')}">Remover</button></div>`).join('') || '<div class="empty">Nenhum plantão ou substituição ativa ou futura.</div>'}</div>
    <h3 style="margin-top:16px">Nova</h3>
    <div class="pform">
      <label>Quem vai cobrir<select id="cQuem">${pessoas.filter(p => p.perfil !== 'supervisor').map(p => `<option value="${p.id}">${esc(p.nome)}</option>`).join('')}</select></label>
      <label>Motivo<select id="cMot"><option value="plantao">Plantão</option><option value="ferias">Férias</option><option value="atestado">Atestado / doença</option><option value="outro">Outro</option></select></label>
      <label>De<input type="date" id="cIni" value="${sab}"></label>
      <label>Até<input type="date" id="cFim" value="${sab}"></label>
      <div class="full"><span class="sub">Carteiras que vai cobrir</span><div class="cobc">${carts.map(c => `<label class="chk"><input type="checkbox" value="${esc(c)}"> ${esc(c)} <small>${esc(cons(c))}</small></label>`).join('')}</div></div>
      <label class="full">Observação<input id="cObs" maxlength="150" placeholder="opcional"></label>
    </div>
    <div class="mact"><span id="cMsg" class="sub" style="color:var(--coral)"></span><button class="btn sec" id="cX">Fechar</button><button class="btn" id="cOk">Salvar</button></div></div>`;
  document.body.appendChild(d);
  d.querySelector('#cX').onclick = () => d.remove();
  d.querySelectorAll('[data-del]').forEach(b => b.onclick = async () => { try { await api(`coberturas?id=in.(${b.dataset.del})`, {method:'DELETE'}); d.remove(); toast('Removido'); abrirCoberturas(); } catch(x) { toast(errTxt(x)); } });
  d.querySelector('#cOk').onclick = async () => {
    const cs = [...d.querySelectorAll('.cobc input:checked')].map(i => i.value);
    const ini = d.querySelector('#cIni').value, fim = d.querySelector('#cFim').value, msg = d.querySelector('#cMsg');
    if (!cs.length) { msg.textContent = 'Marque pelo menos uma carteira.'; return; }
    if (!ini || !fim || fim < ini) { msg.textContent = 'Confira as datas.'; return; }
    const body = cs.map(c => ({usuario_id:d.querySelector('#cQuem').value, carteira:c, inicio:ini, fim, motivo:d.querySelector('#cMot').value, observacao:(d.querySelector('#cObs').value || '').trim() || null}));
    try { await api('coberturas', {method:'POST', headers:{Prefer:'return=minimal'}, body:JSON.stringify(body)}); d.remove(); toast('Salvo. A pessoa vê as carteiras ao entrar no CRM no período.'); abrirCoberturas(); } catch(x) { msg.textContent = errTxt(x); }
  };
}


/* ---------- METAS DO MÊS → PRODUTO, PESOS E META DIA ---------- */
const diasVenda = (ini, fim) => { let n = 0; for (let d = new Date(ini + 'T12:00:00'); iso(d) <= fim; d.setDate(d.getDate() + 1)) { const w = d.getDay(); n += w === 0 ? 0 : w === 6 ? 0.5 : 1; } return n; };
async function abrirMetasMes(mesIni) {
  const h = hojeSP(); const prox = new Date(h.getFullYear(), h.getMonth() + (h.getDate() >= 20 ? 1 : 0), 1);
  const mes = mesIni || iso(prox).slice(0, 7) + '-01';
  const ant = (() => { const d = new Date(mes + 'T12:00:00'); d.setMonth(d.getMonth() - 1); return iso(d).slice(0, 7) + '-01'; })();
  const [mm, ma, mp] = await Promise.all([api(`metas?mes=eq.${mes}&select=*`), api(`metas?mes=eq.${ant}&select=*`), api(`meta_produto?mes=eq.${mes}&select=*`)]);
  const carts = S.resumo.map(r => r.carteira_codigo);
  const cons = c => (S.resumo.find(r => r.carteira_codigo === c) || {}).consultor_nome || '';
  const fixa = c => (S.resumo.find(r => r.carteira_codigo === c) || {}).aceita_prospect === false && /EMB/.test(c);
  const val = (L, c) => { const x = L.find(m => m.carteira_codigo === c); return x ? +x.meta_m3 : null; };
  const nomeF = f => f === 'FORA' ? 'Fora (ex.: Bahia)' : (NOME_PAINEL[f] || (P.filiais.find(x => x.codigo === f) || {}).nome || f);
  const fimMes = (() => { const d = new Date(mes + 'T12:00:00'); d.setMonth(d.getMonth() + 1); d.setDate(0); return iso(d); })();
  const dias = diasVenda(mes, fimMes);
  const COLM = [['GAS','Gasolina'],['ETA','Etanol'],['USINA','Usina'],['S10','S10'],['S500','S500']];
  const previa = () => {
    if (!mp.length) return '<div class="empty">Salve as metas e clique em <b>Calcular divisão</b> para ver como fica por produto.</div>';
    const cs = [...new Set(mp.map(x => x.carteira))].sort();
    const sum = (f) => mp.filter(f).reduce((s, x) => s + +x.m3, 0);
    const linhas = cs.map(c => { const tot = sum(x => x.carteira === c); const base = (mp.find(x => x.carteira === c) || {}).base;
      return `<tr><td><b>${esc(c)}</b><small>${esc(cons(c))}${base === 'media_filial' ? ' · sem histórico: usou a média da filial' : ''}${fixa(c) ? ' · bandeira: fora dos pesos' : ''}</small></td><td class="r"><b>${nf(tot)}</b></td>
        ${COLM.map(([k]) => { const v = sum(x => x.carteira === c && x.coluna === k); const fs = mp.filter(x => x.carteira === c && x.coluna === k).sort((a,b) => b.m3 - a.m3);
          return `<td class="r">${v ? `${nf(v)}<small>${nf(100 * v / tot, 0)}%${fs.length > 1 ? ' · ' + fs.map(x => `${esc(nomeF(x.filial))} ${nf(x.m3)}`).join(', ') : fs[0] && fs[0].filial !== '16' ? ' · ' + esc(nomeF(fs[0].filial)) : ''}</small>` : '<span class="mut">—</span>'}</td>`; }).join('')}</tr>`; }).join('');
    const fils = [...new Set(mp.map(x => x.filial))].filter(f => f !== 'FORA');
    const md = fils.map(f => `<tr><td><b>${esc(nomeF(f))}</b></td>${COLM.map(([k]) => { const v = sum(x => x.filial === f && x.coluna === k); return `<td class="r">${v ? nf(Math.round(v * 1000 / dias / 1000) * 1000) : '<span class="mut">—</span>'}</td>`; }).join('')}</tr>`).join('');
    return `<h3 style="margin-top:14px">Divisão por produto (m³ no mês)</h3><div class="scroll"><table class="ptab"><thead><tr><th>Carteira</th><th class="r">Total</th>${COLM.map(([,l]) => `<th class="r">${l}</th>`).join('')}</tr></thead><tbody>${linhas}</tbody></table></div>
      <h3 style="margin-top:14px">Meta Dia Plan que vai ficar (litros por dia útil · sábado = metade)</h3><div class="scroll"><table class="ptab"><thead><tr><th>Filial</th>${COLM.map(([,l]) => `<th class="r">${l}</th>`).join('')}</tr></thead><tbody>${md}</tbody></table></div>
      <p class="sub">Filiais com carteiras sem meta cadastrada ficam com a Meta Dia Plan menor. Preencha todas as carteiras que vendem pela filial.</p>`;
  };
  const d = document.createElement('div'); d.className = 'modal';
  d.innerHTML = `<div class="mbox" style="width:min(1000px,100%)"><h3>Metas do mês</h3>
    <p class="sub">Digite a meta de cada carteira em m³. O sistema divide por produto e filial conforme o que a carteira vendeu nos últimos 3 meses e, ao aplicar, atualiza os pesos das carteiras e a Meta Dia Plan das filiais.</p>
    <div class="bh-r"><label class="sub">Mês <input type="month" id="mMes" value="${mes.slice(0,7)}"></label><span class="sub">${nf(dias, 1)} dias de venda no mês</span></div>
    <div class="cobc metg">${carts.map(c => `<label>${esc(c)} <small>${esc(cons(c))}</small><input class="mi" inputmode="decimal" data-c="${esc(c)}" value="${val(mm, c) != null ? nf(val(mm, c)) : ''}" placeholder="${val(ma, c) != null ? 'mês ant. ' + nf(val(ma, c)) : 'm³'}"></label>`).join('')}</div>
    <div id="mPrev">${previa()}</div>
    <div class="mact"><span id="mMsg" class="sub"></span><button class="btn sec" id="mX">Fechar</button><button class="btn sec" id="mCalc">Salvar metas e calcular divisão</button><button class="btn" id="mAp" ${mp.length ? '' : 'disabled'}>Aplicar pesos e Meta Dia Plan</button></div></div>`;
  document.body.appendChild(d);
  d.querySelector('#mX').onclick = () => d.remove();
  d.querySelector('#mMes').onchange = e => { d.remove(); abrirMetasMes(e.target.value + '-01'); };
  d.querySelector('#mCalc').onclick = async () => {
    const msg = d.querySelector('#mMsg'); msg.textContent = 'Calculando…';
    const body = [...d.querySelectorAll('.metg input')].filter(i => i.value.trim()).map(i => ({carteira_codigo:i.dataset.c, mes, meta_m3:+i.value.replace(/\./g,'').replace(',', '.')}));
    try {
      if (body.length) await api('metas?on_conflict=carteira_codigo,mes', {method:'POST', headers:{Prefer:'resolution=merge-duplicates,return=minimal'}, body:JSON.stringify(body)});
      const r = await rpc('calcular_metas', {p_mes:mes});
      d.remove(); await abrirMetasMes(mes);
      toast(`Divisão calculada com o histórico de ${dt(r.historico_de)} a ${dt(r.historico_ate)}.` + (r.sem_base && r.sem_base.length ? ` Sem histórico nem filial base: ${r.sem_base.join(', ')}.` : ''));
    } catch(x) { msg.textContent = errTxt(x); }
  };
  d.querySelector('#mAp').onclick = async () => {
    const msg = d.querySelector('#mMsg'); msg.textContent = 'Aplicando…';
    try { const r = await rpc('aplicar_metas', {p_mes:mes}); d.remove(); toast(`Aplicado: pesos das carteiras e Meta Dia Plan valem a partir de ${dt(mes)}.`); await atualizarPed(); }
    catch(x) { msg.textContent = errTxt(x); }
  };
}

/* ---------- VISÃO GERAL (monitoramento das filiais) ---------- */
const COLS = [['GAS','GAS C'],['ETA','EHC'],['S10','S10'],['S500','S500'],['USINA','USINA']];
const NOME_PAINEL = {'16':'Ipojuca', '17':'São Luís'};
const veGeral = () => verTodas() || S.me.perfil === 'gerente';
function segModo() {
  return veGeral() ? `<div class="seg" id="segModo"><button data-m="geral" class="${P.modo==='geral'?'on':''}">Visão geral</button><button data-m="filial" class="${P.modo!=='geral'?'on':''}">Por filial</button></div>` : '';
}
function ligarSegModo() {
  document.querySelectorAll('#segModo button').forEach(b => b.onclick = async () => { P.modo = b.dataset.m; await atualizarPed(); });
}
async function atualizarPed() { if (P.modo === 'geral') await carregarGeral(); else await carregarPed(); }
async function carregarGeral() {
  P.geral = await rpc('monitor_vendas', {p_data:P.data});
  desenharGeral();
}
function desenharGeral() {
  const L = P.geral?.linhas || []; const a = String(P.geral?.agora || '');
  const fils = []; L.forEach(l => { if (!fils.find(f => f.filial === l.filial)) fils.push({filial:l.filial, nome:l.nome, ordem:l.ordem}); });
  fils.sort((x,y) => x.ordem - y.ordem);
  const n = v => +v || 0;
  const tot = {meta:0, cota:0, lanc:0, vir:0}; L.forEach(l => { tot.meta += n(l.meta); tot.cota += n(l.cota); tot.lanc += n(l.lancado); tot.vir += n(l.virados); });
  const pct = (x, y) => y ? nf(100 * x / y, 0) + '%' : '–';
  const card = f => {
    const cs = COLS.filter(([k]) => L.some(l => l.filial === f.filial && l.coluna === k));
    const g = k => L.find(l => l.filial === f.filial && l.coluna === k) || {};
    const T = k => cs.reduce((s,[c]) => s + n(g(c)[k]), 0);
    const sal = (c, l) => { const v = c - l; return `<td class="r ${v < 0 ? 'sneg' : 'spos'}">${nf(v)}</td>`; };
    const semCota = !cs.some(([c]) => g(c).cota != null);
    return `<button class="mcard" data-f="${f.filial}" title="Abrir ${esc(f.nome)}">
      <div class="mtit">${esc(NOME_PAINEL[f.filial] || f.nome)}${semCota ? ' <span class="mwarn">cota não lançada</span>' : ''}</div>
      <table class="mtab"><thead><tr><th></th>${cs.map(([,l]) => `<th class="r">${l}</th>`).join('')}<th class="r">Total</th></tr></thead><tbody>
      <tr class="mmeta"><td>Meta Dia Plan</td>${cs.map(([c]) => `<td class="r">${nf(g(c).meta)}</td>`).join('')}<td class="r">${nf(T('meta'))}</td></tr>
      <tr><td>Cota/dia dispon.</td>${cs.map(([c]) => `<td class="r">${g(c).cota == null ? '–' : nf(g(c).cota)}</td>`).join('')}<td class="r">${nf(T('cota'))}</td></tr>
      <tr><td>Lançado</td>${cs.map(([c]) => `<td class="r" title="${n(g(c).virados) ? `inclui ${nf(g(c).virados)} L virados` : ''}">${nf(n(g(c).lancado))}${n(g(c).virados) ? '<i class="vtag">V</i>' : ''}</td>`).join('')}<td class="r">${nf(T('lancado'))}</td></tr>
      <tr class="msal"><td>Saldo cota dia</td>${cs.map(([c]) => sal(n(g(c).cota), n(g(c).lancado))).join('')}${sal(T('cota'), T('lancado'))}</tr>
      <tr class="mpct"><td>% da meta</td>${cs.map(([c]) => `<td class="r">${pct(n(g(c).lancado), n(g(c).meta))}</td>`).join('')}<td class="r"><b>${pct(T('lancado'), T('meta'))}</b></td></tr>
      </tbody></table></button>`;
  };
  $('#app').innerHTML = hdrPed() + `<main class="eq ped">
    <section class="blk"><div class="bh"><div><h3>Monitoramento de Vendas · ${dt(P.data)}</h3>
      <p class="sub">Lançado = pedidos confirmados + reservas válidas (até 10:30) + virados (<i class="vtag">V</i>). Saldo = disponível − lançado. Atualizado às ${esc(a.slice(11,16))}, atualiza sozinho a cada 30 s.</p></div>
      <div class="bh-r">${segModo()}<input type="date" id="pData" value="${P.data}" aria-label="Data">${ehOp() ? '<button class="btn sm" id="bMetasMes">Metas do mês</button><button class="btn sm sec" id="bMeta">Meta Dia Plan</button>' : ''}</div></div>
      <div class="strip mstrip">
        <div class="st"><b>${nf(tot.meta)}</b><span>Meta dia (L)</span></div>
        <div class="st"><b>${nf(tot.cota)}</b><span>Cota disponível</span></div>
        <div class="st"><b>${nf(tot.lanc)}</b><span>Lançado${tot.vir ? ` · ${nf(tot.vir)} virados` : ''}</span></div>
        <div class="st ${tot.cota - tot.lanc < 0 ? 'ok' : ''}"><b>${nf(tot.cota - tot.lanc)}</b><span>Saldo cota dia</span></div>
        <div class="st"><b>${pct(tot.lanc, tot.meta)}</b><span>da meta do dia</span></div>
      </div>
      <div class="mgrid">${fils.map(card).join('') || '<div class="empty">Nenhuma filial com meta ou cota para este dia.</div>'}</div>
    </section></main>`;
  ligarHdrPed(); ligarSegModo();
  $('#pData').onchange = async e => { if (!e.target.value) return; P.data = e.target.value; await atualizarPed(); };
  if ($('#bMeta')) $('#bMeta').onclick = abrirMeta;
  if ($('#bMetasMes')) $('#bMetasMes').onclick = () => abrirMetasMes();
  document.querySelectorAll('.mcard').forEach(b => b.onclick = async () => { if (!P.filiais.some(f => f.codigo === b.dataset.f)) return; P.fil = b.dataset.f; P.modo = 'filial'; await carregarPed(); });
}
async function abrirMeta() {
  const fil = P.filiais;
  const met = await api(`meta_dia?valido_desde=lte.${P.data}&order=valido_desde.desc&select=*`);
  const ef = {}; met.forEach(m => { const k = m.filial + '|' + m.coluna; if (!(k in ef)) ef[k] = m; });
  const colsF = f => COLS.filter(([k]) => k === 'USINA' ? P.terms.some(t => t.filial === f && t.coluna_painel === 'USINA') : P.terms.some(t => t.filial === f && !t.coluna_painel && t.grupos.includes(k)));
  const d = document.createElement('div'); d.className = 'modal';
  d.innerHTML = `<div class="mbox" style="width:min(860px,100%)"><h3>Meta Dia Plan</h3><p class="sub">Litros planejados para vender por dia em cada filial.</p>
    <div class="scroll"><table class="ptab"><thead><tr><th>Filial</th>${COLS.map(([,l]) => `<th class="r">${l}</th>`).join('')}</tr></thead><tbody>
    ${fil.map(f => { const cs = colsF(f.codigo).map(c => c[0]); return `<tr><td><b>${esc(NOME_PAINEL[f.codigo] || f.nome)}</b></td>${COLS.map(([k]) => cs.includes(k) ? `<td class="r"><input class="mi" inputmode="numeric" data-f="${f.codigo}" data-c="${k}" value="${ef[f.codigo+'|'+k] ? nf(ef[f.codigo+'|'+k].litros) : ''}"></td>` : '<td class="r mut">—</td>').join('')}</tr>`; }).join('')}
    </tbody></table></div>
    <label class="sub">Vale a partir de <input type="date" id="mDesde" value="${P.data}"></label>
    <div class="mact"><button class="btn sec" id="mX">Cancelar</button><button class="btn" id="mOk">Salvar meta</button></div></div>`;
  document.body.appendChild(d);
  d.querySelectorAll('input.mi').forEach(i => i.oninput = () => { i.value = i.value.replace(/\D/g,'').replace(/\B(?=(\d{3})+(?!\d))/g, '.'); });
  d.querySelector('#mX').onclick = () => d.remove();
  d.querySelector('#mOk').onclick = async () => {
    const desde = d.querySelector('#mDesde').value || P.data;
    const body = [...d.querySelectorAll('input.mi')].map(i => ({filial:i.dataset.f, coluna:i.dataset.c, valido_desde:desde, litros:+(i.value || '').replace(/\D/g, '')}));
    try { await api('meta_dia?on_conflict=filial,coluna,valido_desde', {method:'POST', headers:{Prefer:'resolution=merge-duplicates,return=minimal'}, body:JSON.stringify(body)});
      d.remove(); toast('Meta salva'); await carregarGeral(); } catch(x) { toast('Erro ao salvar: ' + errTxt(x)); }
  };
}

/* ---------- START ---------- */
(async () => {
  let rt = null; try { rt = localStorage.getItem('larcocrm_itb_rt'); } catch(e) {}
  if (rt) { try { await auth({refresh_token:rt}, 'refresh_token'); await iniciar(); return; } catch(e) {} }
  telaLogin();
})();
}
</script>
</body>
</html>
