<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Larco CRM</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* VOICE: ferramenta de trabalho diária, direta, sem enfeite
   IDEA: a prancheta do consultor — fila de ligações à esquerda, ficha do cliente à direita
   PICTURE: a própria fila com semáforo e o mapa da carteira
   COLOUR and TYPE: azul Larco #16226e/#2a5ae0, laranja #f7861a de destaque, amarelo #ffcc00 só em detalhe, vermelho #e2413b para alerta; Poppins nos títulos e números + Inter no texto
   LAYOUT: barra de indicadores no topo, abas, lista + ficha em duas colunas */
:root{--g:#16226e;--g2:#2a5ae0;--or:#f7861a;--ye:#ffcc00;--lime:#e7eeff;--coral:#e2413b;--amb:#f2a516;--ok:#1fa65a;--bg:#f2f4fa;--card:#fff;--ink:#141c46;--mut:#5b6386;--line:#e1e5f0}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Inter,system-ui,sans-serif}
h1,h2,h3{font-family:Poppins,Inter,sans-serif;margin:0;line-height:1.1}
button,input,select,textarea{font:inherit}
.btn{border:0;border-radius:8px;padding:9px 14px;background:var(--g);color:#fff;cursor:pointer;font-weight:600;min-height:40px}
.btn.sec{background:#fff;color:var(--g);border:1px solid var(--line)}
.btn:disabled{opacity:.5;cursor:default}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.row:focus-visible,button:focus-visible{outline:3px solid var(--ye);outline-offset:1px}
header{background:var(--g);color:#fff;padding:10px max(3vw,14px);display:flex;gap:14px;align-items:center;flex-wrap:wrap;border-bottom:3px solid var(--or)}
.brand{display:flex;align-items:center;gap:8px}.brand .lg{font:800 22px/1 Poppins,sans-serif;letter-spacing:.06em}.brand .crm{font:700 12px/1 Poppins,sans-serif;background:var(--or);color:#fff;border-radius:6px;padding:5px 7px;letter-spacing:.08em}
header .brand.home{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:8px;border-radius:10px;padding:4px 6px;margin-left:-6px;transition:background .15s}
header .brand.home:hover,header .brand.home:focus-visible{background:rgba(255,255,255,.12)}
.lgimg{height:30px;width:auto;display:block}.login .lgimg{height:38px}
header h1{font-size:20px}header .sp{flex:1}
header select{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.35);border-radius:8px;padding:7px 10px}header select option{color:var(--ink)}
header .btn.sec{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.45)}
header .who{font-size:13px;opacity:.85}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--line);border-bottom:1px solid var(--line)}
.kpi{background:var(--card);padding:12px 16px}.kpi b{display:block;font:700 24px Poppins,Inter,system-ui,sans-serif;white-space:nowrap}.kpi span{font-size:12.5px;color:var(--mut)}
.kpi.alert b{color:var(--coral)}
.spk{display:inline-flex;gap:2px;align-items:flex-end;height:18px;width:50px;vertical-align:middle}.spk i{flex:1;background:#b9c4ee;border-radius:2px 2px 0 0}.spk i.cur{background:var(--g2)}
.ev{font:700 11.5px Inter,sans-serif;border-radius:6px;padding:1px 5px;margin-left:4px}.ev.up{background:#e3f6ea;color:#127a3e}.ev.dn{background:#fdecea;color:#b32a22}.ev.eq{background:#eef1f9;color:var(--mut)}
.evl{display:inline-flex;align-items:center;margin-top:3px;white-space:nowrap}

.agrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px}
.ab{all:unset;box-sizing:border-box;cursor:pointer;border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;background:#fff;transition:transform .12s,border-color .12s}.ab:hover,.ab:focus-visible{border-color:var(--or);transform:translateY(-2px)}.ab:focus-visible{outline:3px solid var(--ye)}
.ab b{font:700 15px Poppins,sans-serif;color:var(--g)}.ab span{font-size:12.5px;color:var(--mut)}.ab em{font-style:normal;font-weight:700;color:#c25e00}.ab small{font-size:11.5px;color:var(--mut)}
.lnk{border:0;background:none;color:var(--g2);font:600 12.5px Inter,sans-serif;cursor:pointer;text-decoration:underline;margin-left:6px}

.alvo{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;background:#fff4e8;border:1px solid #fbd3a8;border-radius:12px;padding:10px 12px;margin-bottom:10px;font-size:13.5px}.alvo select{border:1px solid #f3b77a;border-radius:8px;padding:5px 8px;font-weight:700;color:var(--g)}.alvo-n b{color:var(--or)}
.alvo-v{color:#c25e00}.tag.c.pb{background:#ffe9d2;color:#a24c00}

.avi{display:block;object-fit:cover}.avi.av{width:36px;height:36px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 2px var(--g2)}.who2 .avi.av{width:30px;height:30px}
.hc{background:linear-gradient(120deg,var(--g),#1d36a8 60%,var(--g2));color:#fff;padding:18px max(3vw,14px);position:relative;overflow:hidden}
.hc::after{content:'';position:absolute;right:-60px;top:-90px;width:300px;height:300px;border-radius:50%;background:radial-gradient(circle,rgba(247,134,26,.35),transparent 65%)}
.hc-in{position:relative;z-index:1;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.hc-ph{width:92px;height:92px;border-radius:22px;overflow:hidden;border:3px solid var(--ye);box-shadow:0 6px 18px rgba(0,0,0,.25);flex:none;background:var(--g2)}.hc-ph img{width:100%;height:100%;object-fit:cover}
.hc-ph.ini{display:grid;place-items:center;font:800 30px Poppins,sans-serif}
.hc-t{flex:1;min-width:220px}.hc-t h2{font:800 clamp(22px,2.6vw,30px)/1.1 Poppins,sans-serif;margin:0}.hc-t .hsub{margin:6px 0 0;opacity:.92;font-size:14px}.hc-t .hsub b{color:var(--ye)}
.hc-meta{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);border-radius:14px;padding:10px 14px;min-width:220px}.hc-meta span{font-size:12px;opacity:.85}.hc-meta b{display:block;font:800 26px Poppins,sans-serif}.hc-meta em{font-style:normal;font-size:12px;color:var(--ye)}.hc-meta .track{background:rgba(255,255,255,.2);margin:4px 0}

.btn.sm{min-height:34px;padding:6px 12px;font-size:13px;background:var(--or)}
.modal{position:fixed;inset:0;background:rgba(20,28,70,.45);display:grid;place-items:center;z-index:5000;padding:16px}
.mbox{background:#fff;border-radius:18px;padding:20px;width:min(720px,100%);box-shadow:0 20px 60px rgba(0,0,0,.25)}.mbox h3{margin:0;font:700 19px Poppins,sans-serif;color:var(--g)}.mbox .sub{margin:4px 0 12px}
.mi{width:110px;border:1px solid var(--line);border-radius:8px;padding:6px 8px;text-align:right;font:600 14px Inter,sans-serif}.mact{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}

.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}.seg button{border:0;background:none;padding:7px 13px;font:600 13px Inter,sans-serif;color:var(--mut);cursor:pointer}.seg button.on{background:var(--g);color:#fff}
.hero{background:linear-gradient(120deg,var(--g) 0%,#1d36a8 55%,var(--g2) 100%);color:#fff;padding:26px max(3vw,14px) 64px;position:relative;overflow:hidden}
.hero::after{content:'';position:absolute;right:-80px;top:-120px;width:360px;height:360px;border-radius:50%;background:radial-gradient(circle,rgba(247,134,26,.35),transparent 65%)}
.hin{position:relative;z-index:1;max-width:1320px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.6fr);gap:22px;align-items:end}
@media(max-width:1000px){.hin{grid-template-columns:1fr}}
.eyebrow{margin:0 0 6px;color:var(--ye);font-weight:600;font-size:13px;letter-spacing:.02em}
.hero h2{font:800 clamp(26px,3.2vw,38px)/1.05 Poppins,sans-serif;margin:0}.hsub{margin:8px 0 0;opacity:.85;font-size:14px}
.hk{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}@media(max-width:700px){.hk{grid-template-columns:repeat(2,minmax(0,1fr))}}
.hk>div{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);border-radius:14px;padding:12px 14px;backdrop-filter:blur(4px)}
.hk span{display:block;font-size:12px;opacity:.85}.hk b{display:block;font:800 26px/1.15 Poppins,sans-serif;white-space:nowrap;margin-top:2px}.hk b small{font-size:13px;font-weight:600;opacity:.8}
.hk em{display:block;font-style:normal;font-size:12px;color:var(--ye);margin-top:2px}.hk .warn{background:rgba(226,65,59,.28);border-color:rgba(255,160,150,.5)}
main.eq{max-width:1320px;margin:-44px auto 0;padding:0 max(3vw,14px) 40px;position:relative;z-index:2}
.blk{background:var(--card);border-radius:18px;padding:18px 20px;margin-bottom:16px;box-shadow:0 2px 0 rgba(22,34,110,.04),0 10px 30px rgba(22,34,110,.06)}
.bh{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:12px}.bh h3{margin:0;font:700 19px Poppins,sans-serif;color:var(--g)}.bh .sub{margin:2px 0 0;font-size:13px;color:var(--mut)}
.bh-r{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.bh-r select{border:1px solid var(--line);border-radius:10px;padding:7px 10px;background:#fff;font:500 13px Inter,sans-serif}
.strip{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin-bottom:14px}@media(max-width:900px){.strip{grid-template-columns:repeat(2,minmax(0,1fr))}}
.st{background:#f5f7fd;border-radius:12px;padding:10px 12px}.st b{display:block;font:800 22px/1.15 Poppins,sans-serif;color:var(--g)}.st span{font-size:12px;color:var(--mut)}.st.ok b{color:var(--ok)}.st.alert{background:#fdecea}.st.alert b{color:var(--coral)}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.pc{border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;transition:transform .15s,box-shadow .15s}.pc:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(22,34,110,.08)}
.pc.zero{background:#fff8f7;border-color:#f6cdc8}
.pc-h{display:flex;gap:10px;align-items:center}.pc-h b{display:block;font-size:14px;line-height:1.2}.pc-h small{color:var(--mut);font-size:12px}
.av{flex:none;width:36px;height:36px;border-radius:50%;background:var(--g);color:#fff;display:grid;place-items:center;font:700 13px Poppins,sans-serif}.av.ext{background:var(--or)}
.pc-n{display:grid;grid-template-columns:auto 1fr;align-items:baseline;gap:0 8px}.pc-n b{font:800 28px/1 Poppins,sans-serif;color:var(--g)}.pc-n span{font-size:12px;color:var(--mut)}
.spark{grid-column:1/-1;height:5px;background:#eef1f9;border-radius:3px;overflow:hidden;margin-top:6px}.spark i{display:block;height:100%;background:linear-gradient(90deg,var(--g2),var(--or))}
.res{display:flex;height:8px;border-radius:4px;overflow:hidden;background:#eef1f9}.res i{display:block}
.v{background:var(--ok)}.q{background:#7b8cf0}.l{background:var(--coral)}.o{background:#c8cee0}.e{background:#eef1f9}.f{background:var(--or)}
.pc-m{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--mut)}.pc-m b{color:var(--ink)}
.pc-f{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--mut);border-top:1px dashed var(--line);padding-top:7px}.pc-f .pend{color:var(--coral);font-weight:600}.pc-f .late{color:var(--coral);font-weight:600}
.legend .sq{display:inline-block;width:10px;height:10px;border-radius:3px}
.chips{display:flex;gap:6px;flex-wrap:wrap}.chips button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 12px;font:600 12.5px Inter,sans-serif;color:var(--mut);cursor:pointer}.chips button.on{background:var(--or);border-color:var(--or);color:#fff}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.cc{all:unset;box-sizing:border-box;cursor:pointer;border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:9px;background:#fff;transition:transform .15s,box-shadow .15s,border-color .15s}
.cc:hover,.cc:focus-visible{transform:translateY(-3px);box-shadow:0 12px 26px rgba(22,34,110,.1);border-color:var(--g2)}.cc:focus-visible{outline:3px solid var(--ye)}
.cc-top{display:flex;align-items:center;gap:8px}.code{font:800 18px Poppins,sans-serif;color:var(--g)}.pill{font-size:11px;background:var(--lime);color:var(--g);border-radius:999px;padding:2px 8px;font-weight:600}
.badge{margin-left:auto;background:var(--coral);color:#fff;font:700 12px Poppins,sans-serif;border-radius:999px;padding:3px 9px}
.who2{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:600}.who2 .av{width:28px;height:28px;font-size:11px}.who2 small{font-weight:500;color:var(--mut)}
.cc-num{display:grid;grid-template-columns:1fr 1fr;gap:8px}.cc-num b{display:block;font:800 22px/1.1 Poppins,sans-serif}.cc-num span{font-size:11.5px;color:var(--mut)}
.track{height:7px;background:#eef1f9;border-radius:4px;overflow:hidden}.track i{display:block;height:100%;background:linear-gradient(90deg,var(--g2),var(--or));border-radius:4px}
.cc-row{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--mut)}.cc-row b{color:var(--ink);margin-left:auto}
.ring{width:22px;height:22px;border-radius:50%;background:conic-gradient(var(--g2) calc(var(--p)*1%),#e6eaf5 0);-webkit-mask:radial-gradient(circle 7px,transparent 98%,#000 100%);mask:radial-gradient(circle 7px,transparent 98%,#000 100%)}
.semf{display:flex;height:6px;border-radius:3px;overflow:hidden;background:#eef1f9}.semf i{display:block;height:100%}
.cc-foot{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:2px 10px;font-size:11.5px;color:var(--mut)}.cc-foot b{color:var(--g)}
.dias{display:grid;grid-template-columns:repeat(14,minmax(0,1fr));gap:8px;align-items:end;height:220px}
.dcol{display:flex;flex-direction:column;align-items:center;height:100%;justify-content:flex-end;font-size:11px}
.dcol .n{font:700 12px Poppins,sans-serif;color:var(--g);min-height:15px}
.dcol .pil{width:72%;height:120px;display:flex;flex-direction:column-reverse;background:#f2f4fa;border-radius:8px 8px 3px 3px;overflow:hidden}.dcol .pil i{display:block;width:100%}
.dcol .vol{width:72%;height:30px;display:flex;align-items:flex-start;margin-top:3px}.dcol .vol i{display:block;width:100%;background:var(--or);border-radius:0 0 6px 6px;opacity:.85}
.dcol .vn{font-size:10.5px;color:var(--or);font-weight:600;min-height:13px}.dcol .dl{color:var(--mut);margin-top:2px;white-space:nowrap}.dcol.fds{opacity:.4}.dcol.hj .dl{color:var(--or);font-weight:700}.dcol.hj .pil{box-shadow:0 0 0 2px var(--or)}
@media(max-width:700px){.dias{gap:3px}.dcol .vn{display:none}}
table.atvt td,table.atvt th{white-space:nowrap}table.atvt tr.zero td{background:#fff8f7}
.mot{display:grid;grid-template-columns:180px 1fr 40px;gap:10px;align-items:center;margin:6px 0;font-size:13.5px;color:var(--ink)}
.login-wrap{min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,var(--g),#1d36a8 60%,var(--g2));padding:20px}
.login .brand{justify-content:center;margin-bottom:6px}.login .brand .lg{color:var(--g);font-size:30px}.login .brand .crm{font-size:14px}


.kpi.wide b{font-size:17px;white-space:normal;line-height:1.35}.bar.sm{display:inline-block;width:70px;margin:0 6px 0 0;vertical-align:middle}
.bar{height:6px;border-radius:3px;background:#e7ecea;margin-top:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--g)}
nav.tabs{display:flex;gap:4px;padding:10px max(3vw,14px) 0;flex-wrap:wrap}
nav.tabs button{border:0;background:none;padding:10px 14px;border-radius:8px 8px 0 0;cursor:pointer;color:var(--mut);font-weight:600}
.ctt{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;align-items:center;background:#f3f6ff;border-radius:8px;padding:8px 10px;margin:6px 0 10px;font-size:13px}.ctt .cbt{display:flex;gap:6px}.btn.wa{background:#1fa855;border-color:#1fa855;color:#fff}.btn.wa:hover{background:#178a45}.wa-mini{border:0;background:#e7f7ee;border-radius:50%;width:34px;height:34px;font-size:16px;cursor:pointer;flex:none;margin-left:6px}.wa-mini:hover{background:#c9efd9}.row:has(.wa-mini){grid-template-columns:14px minmax(0,1fr) auto auto}
.gnota{background:#fff6e6;border-left:3px solid var(--or);padding:6px 10px;border-radius:6px;font-size:13px;margin:4px 0 8px}.sug{font-size:13px;color:var(--g);background:#eef2ff;border-radius:6px;padding:6px 10px}.row.grp .nm{color:var(--g)}details.feitos{margin-top:10px;border-top:1px dashed #cfd5e6;padding-top:6px}details.feitos summary{cursor:pointer;font-weight:600;color:#2e7d32;padding:6px 4px}details.feitos .row{opacity:.75}tr.lk{cursor:pointer}tr.lk:hover td{background:#f5f7ff}
.leva{color:var(--g);font-size:12px}.leva b{color:var(--or)}table.sem tr.hj td{background:#fff6e6}table.sem td:nth-child(2){min-width:120px}
nav.tabs button.on{background:var(--card);color:var(--g);box-shadow:0 -2px 0 var(--g) inset}
nav.tabs .n{background:var(--coral);color:#fff;border-radius:10px;padding:0 7px;font-size:12px;margin-left:6px}
main{padding:0 max(3vw,14px) 30px}
.wrap{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:14px;background:var(--card);border-radius:0 10px 10px 10px;padding:14px;min-height:70vh}
@media(max-width:900px){.wrap{grid-template-columns:1fr}}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.tools input,.tools select{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:#fff;min-height:40px}
.tools input{flex:1;min-width:160px}
.list{max-height:72vh;overflow:auto;border:1px solid var(--line);border-radius:8px}
.row{display:grid;grid-template-columns:14px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line);cursor:pointer}
.row:hover{background:#f5f7fd}.row.sel{background:var(--lime)}
.dot{width:12px;height:12px;border-radius:50%}
.verde{background:var(--ok)}.amarelo{background:var(--amb)}.vermelho{background:var(--coral)}.sem_compra{background:#8e7cc3}
.row .nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .sub{font-size:12.5px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .num{text-align:right;font-size:13px;white-space:nowrap}.row .num b{display:block;font-size:14px}
.tag{display:inline-block;font-size:11.5px;border-radius:10px;padding:1px 8px;background:#eef2f1;color:var(--mut);margin-right:4px;white-space:nowrap}
.tag.p{background:#ffe4df;color:#b2402c}.tag.c{background:#e8e4f7;color:#4b3a8f}.dbar{display:grid;grid-template-columns:120px 1fr 70px;gap:8px;align-items:center;font-size:13px;margin:3px 0}.dbar .bar{margin:0;height:9px}.dbar.larco .bar i{background:var(--ok)}.dbar:not(.larco) .bar i{background:#8e7cc3}.tag.d{background:var(--lime);color:var(--g)}
.ficha{border:1px solid var(--line);border-radius:8px;padding:16px;max-height:80vh;overflow:auto}
.ficha h2{font-size:20px}.ficha .meta{color:var(--mut);font-size:13px;margin:4px 0 12px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:10px 0}
@media(max-width:600px){.grid4{grid-template-columns:repeat(2,minmax(0,1fr))}}
.mini{background:#f6f8f7;border-radius:8px;padding:8px 10px}.mini b{display:block;font:700 17px Poppins,Inter,system-ui,sans-serif;white-space:nowrap}.mini span{font-size:12px;color:var(--mut)}
h3{font-size:15px;margin:16px 0 8px}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left}th{color:var(--mut);font-weight:600}td.r,th.r{text-align:right;white-space:nowrap}

const S = { token:null, refresh:null, user:null, me:null, carteiras:[], cart:null, tab:'hoje', rows:[], sel:null, resumo:[], filtro:'', ordem:'prio', map:null, dist:{}, fDist:'' };

/* ---------- API ---------- */
async function auth(body, grant) {
  const r = await fetch(`${SB_URL}/auth/v1/token?grant_type=${grant}`, {method:'POST', headers:{apikey:SB_KEY,'Content-Type':'application/json'}, body:JSON.stringify(body)});
  const j = await r.json(); if (!r.ok) throw new Error(j.error_description || j.msg || 'Falha no login');
  S.token = j.access_token; S.refresh = j.refresh_token; S.user = j.user; S.exp = Date.now() + (j.expires_in - 60) * 1000;
  try { localStorage.setItem('larcocrm_rt', j.refresh_token); } catch(e) {}
}
async function api(path, opt = {}) {
  if (S.exp && Date.now() > S.exp && S.refresh) await auth({refresh_token:S.refresh}, 'refresh_token');
  const go = () => fetch(`${SB_URL}/rest/v1/${path}`, {...opt, headers:{apikey:SB_KEY, Authorization:`Bearer ${S.token}`, 'Content-Type':'application/json', ...(opt.headers||{})}});
  let r = await go();
  if (r.status >= 500 && (!opt.method || opt.method === 'GET')) { await new Promise(res => setTimeout(res, 1200)); r = await go(); }
  if (!r.ok) { const t = await r.text(); throw new Error(t.slice(0,300)); }
  const t = await r.text(); return t ? JSON.parse(t) : null;
}

/* ---------- LOGIN ---------- */
function telaLogin(err='') {
  $('#app').innerHTML = `<div class="login-wrap"><form class="login" id="fl"><div class="brand"><img class="lgimg" src="${LOGO_B}" alt="Larco"><span class="crm">CRM</span></div><p>Entre com seu e-mail e senha.</p>
    <input id="em" type="email" placeholder="E-mail" autocomplete="username" required>
    <input id="pw" type="password" placeholder="Senha" autocomplete="current-password" required>
    <div class="err">${esc(err)}</div><button class="btn" style="width:100%">Entrar</button></form></div>`;
  $('#fl').onsubmit = async e => { e.preventDefault(); const b = e.target.querySelector('button'); if (b) { b.disabled = true; b.textContent = 'Entrando…'; }
    try { await auth({email:$('#em').value.trim(), password:$('#pw').value}, 'password'); } catch(x) { return telaLogin('E-mail ou senha incorretos.'); }
    try { await iniciar(); } catch(x) { telaLogin('Login ok, mas o CRM demorou para carregar. Tente entrar de novo em alguns segundos.'); } };
}
function telaTrocaSenha(err='') {
  $('#app').innerHTML = `<div class="login-wrap"><form class="login" id="fs"><div class="brand"><img class="lgimg" src="${LOGO_B}" alt="Larco"><span class="crm">CRM</span></div><p>Primeiro acesso: crie sua senha pessoal (mínimo 8 caracteres).</p>
    <input id="p1" type="password" placeholder="Nova senha" autocomplete="new-password" minlength="8" required>
    <input id="p2" type="password" placeholder="Repita a nova senha" autocomplete="new-password" minlength="8" required>
    <div class="err">${esc(err)}</div><button class="btn" style="width:100%">Salvar senha</button></form></div>`;
  $('#fs').onsubmit = async e => { e.preventDefault(); const a = $('#p1').value, b = $('#p2').value;
    if (a.length < 8) return telaTrocaSenha('A senha precisa ter pelo menos 8 caracteres.');
    if (a !== b) return telaTrocaSenha('As senhas não conferem.');
    try { const r = await fetch(`${SB_URL}/auth/v1/user`, {method:'PUT', headers:{apikey:SB_KEY, Authorization:`Bearer ${S.token}`, 'Content-Type':'application/json'}, body:JSON.stringify({password:a, data:{trocar_senha:false}})});
      const j = await r.json(); if (!r.ok) throw new Error(j.msg || j.error_description || 'erro');
      S.user = j; toast('Senha criada'); await iniciar(); } catch(x) { telaTrocaSenha('Não foi possível salvar: ' + x.message); } };
}
async function iniciar() {
  if (S.user?.user_metadata?.trocar_senha) return telaTrocaSenha();
  const me = await api(`usuarios?id=eq.${S.user.id}&select=*,usuario_carteiras(carteira_codigo)`);
  if (!me.length) return telaLogin('Usuário sem cadastro no CRM. Fale com o supervisor.');
  S.me = me[0];
  if (S.me.perfil === 'faturamento') return telaFaturamento();
  S.resumo = await api('v_carteira_resumo?select=*&order=carteira_codigo');
  const todas = ['supervisor','gerente_corp'].includes(S.me.perfil); S.podeMeta = todas; S.gestao = todas || S.me.perfil === 'gerente';
  S.cobre = {};
  if (!todas) { try { const h = iso(hojeSP()); (await api(`coberturas?usuario_id=eq.${S.me.id}&inicio=lte.${h}&fim=gte.${h}&select=carteira,motivo,fim`)).forEach(c => S.cobre[c.carteira] = c); } catch(e) {} }
  S.carteiras = todas ? S.resumo.map(r => r.carteira_codigo) : [...new Set(S.me.usuario_carteiras.map(c => c.carteira_codigo).concat(Object.keys(S.cobre)))].sort();
  if (!todas) S.resumo = S.resumo.filter(r => S.carteiras.includes(r.carteira_codigo));
  S.cart = S.gestao ? null : S.carteiras[0];
  S.tab = S.gestao ? 'equipe' : 'hoje';
  try { S.pedLib = (await api('filiais?liberada_equipe=eq.true&select=codigo')).length > 0; } catch(e) { S.pedLib = true; }
  await abrir();
}
function sair() { try { localStorage.removeItem('larcocrm_rt'); } catch(e) {} Object.assign(S, {token:null, refresh:null, user:null, me:null}); telaLogin(); }

async function abrir() {
  if (S.cart) S.rows = await api(`v_cliente_resumo?carteira_codigo=eq.${encodeURIComponent(S.cart)}&select=id,cnpj,razao_social,municipio,uf,segmento,situacao,etapa_funil,telefone,ddd,email,contato_nome,bandeira,grupo_economico,endereco,bairro,lat,lon,ultima_compra,volume_12m,volume_90d,volume_mes,produtos,ciclo_dias,dias_sem_comprar,ultimo_contato,ultimo_resultado,proximo_contato,semaforo,no_dia_de_comprar,contato_pendente,em_recuperacao,vmm_mercado,potencial_m3_mes,situacao_cadastro,origem`);
  S.dist = {};
  S.mens = {};
  S.sem = {}; S.ctt = {};
  if (S.cart) { try { (await api(`clientes?carteira_codigo=eq.${encodeURIComponent(S.cart)}&contato_atualizado_em=not.is.null&select=id,contato_comprador,contato_whatsapp,contato_telefone,contato_atualizado_em,contato_atualizado_por`)).forEach(c => S.ctt[c.id] = c); } catch(e) {} }
  if (S.cart) { try { (await api(`v_cliente_semana?carteira_codigo=eq.${encodeURIComponent(S.cart)}&select=cliente_id,dias_total,dias,dias_habituais,dia_habitual_hoje,comprou_recente`)).forEach(d => S.sem[d.cliente_id] = d); } catch(e) {} }
  if (S.cart) { try { (await api(`v_cliente_mensal?carteira_codigo=eq.${encodeURIComponent(S.cart)}&select=cliente_id,meses`)).forEach(d => S.mens[d.cliente_id] = d.meses); } catch(e) {} }
  S.prod = {};
  if (S.cart) { try { (await api(`v_cliente_produtos?carteira_codigo=eq.${encodeURIComponent(S.cart)}&select=cliente_id,produtos`)).forEach(d => S.prod[d.cliente_id] = d.produtos); } catch(e) {} }
  if (S.cart) { try { (await api(`v_cliente_distribuidoras?carteira_codigo=eq.${encodeURIComponent(S.cart)}&select=cliente_id,distribuidoras,principal`)).forEach(d => S.dist[d.cliente_id] = d); } catch(e) {} }
  render();
}

const CART_AV={'PE 01':'vania','PE EMB01':'vania','PE 02':'tayna','PE 06':'gleidson','AL 01':'giovane','PB 01':'luana','RN 01':'leticia','CE 01':'bianka','JUA 01':'mariana','JUA 03':'mariana','JUA 02':'cinthya','JUA 04':'diego','MA 01':'katia','MA 02':'mardonio','MA 05':'simone','MA 06':'luciene','PI 01':'nathali','SNP 01':'jaderson'};
const avKey = nome => { const k = (nome||'').split(' ')[0].normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase(); return ({nathaly:'nathali'})[k] || k; };
const avImg = (key, cls='') => AV[key] ? `<img class="avi ${cls}" src="${AV[key]}" alt="">` : '';
function heroConsultor(r) {
  const meu = !S.gestao; const key = meu ? avKey(S.me.nome) : CART_AV[S.cart];
  const nome = meu ? (S.me.nome||'').split(' ')[0] : (r.consultor_nome||'');
  const h = hojeSP(), hr = h.getHours(); const saud = hr < 12 ? 'Bom dia' : hr < 18 ? 'Boa tarde' : 'Boa noite';
  const rows = S.rows || []; const nHoje = rows.filter(filaHoje).length;
  const pct = r.meta_m3 ? 100 * r.projecao_m3 / r.meta_m3 : null;
  const frase = !meu ? `Você está vendo a carteira ${esc(S.cart)} como ${S.me.perfil==='gerente'?'gerente':'gestão'}.`
    : nHoje ? `Hoje você tem <b>${nHoje}</b> cliente${nHoje>1?'s':''} para ligar. Bora pra cima!` : 'Nenhuma pendência na fila de hoje. Que tal abrir a aba de prospects?';
  return `<section class="hc"><div class="hc-in">${AV[key] ? `<div class="hc-ph">${avImg(key)}</div>` : `<div class="hc-ph ini">${iniciais(nome)}</div>`}
    <div class="hc-t"><p class="eyebrow">${esc(S.cart)}${S.me.perfil==='externo'?' · Externo':''}</p><h2>${meu?`${saud}, ${esc(nome)}!`:esc(nome)}</h2><p class="hsub">${frase}</p></div>
    ${pct!=null?`<div class="hc-meta"><span>Rumo à meta</span><b>${nf(pct,0)}%</b><div class="track"><i style="width:${Math.min(100,pct)}%"></i></div><em>${nf(r.projecao_m3)} de ${nf(r.meta_m3)} m³ projetados</em></div>`:''}
  </div></section>`;
}

const ehProsp = x => x.situacao === 'prospect' || (x.situacao === 'cliente' && !x.ultima_compra && ['BRANCA','LARCO'].includes(x.bandeira));
const DOW = {1:['seg','segundas','Segunda'],2:['ter','terças','Terça'],3:['qua','quartas','Quarta'],4:['qui','quintas','Quinta'],5:['sex','sextas','Sexta'],6:['sáb','sábados','Sábado'],7:['dom','domingos','Domingo']};
const PNOME = p => ({'DIESEL S10':'S10','DIESEL S500':'S500','GASOLINA':'Gasolina','ETANOL':'Etanol'})[p] || p;
const habHoje = x => !!(S.sem?.[x.id]?.dia_habitual_hoje && !S.sem[x.id].comprou_recente);
const diaHoje = () => { const d = hojeSP().getDay(); return d === 0 ? 7 : d; };
function prodsDia(id, d) { const r = (S.sem?.[id]?.dias || []).find(z => z.d === d); return (r?.prods || []).filter(p => +p.m3 > 0); }
function txtHab(id) { const h = S.sem?.[id]?.dias_habituais; return h && h.length ? h.map(d => DOW[d][1]).join(' e ') : ''; }
const hojeISO = () => { const h = hojeSP(); return `${h.getFullYear()}-${String(h.getMonth()+1).padStart(2,'0')}-${String(h.getDate()).padStart(2,'0')}`; };
const dataSP = ts => { if (!ts) return null; const d = new Date(new Date(ts).toLocaleString('en-US', {timeZone:'America/Sao_Paulo'})); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; };

const contatoHoje = x => dataSP(x.ultimo_contato) === hojeISO();

const feitoHoje = x => contatoHoje(x) && !retentar(x);
const adiado = x => !!(x.proximo_contato && x.proximo_contato > hojeISO());

  const ym = k => { const d = new Date(y, m - 1 - k, 1); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0'); };

  const linhas = Object.values(cel).filter(x => MT_FIL.includes(x.fil) && (MF[x.fil+'|'+x.col] > 0) && x.base > 0.05);

  // meta de novembro de cada carteira repartida pelas filiais conforme o volume que tira em cada uma

  const totC = {}; linhas.forEach(x => totC[x.cart] = (totC[x.cart]||0) + x.base);
  const CAR = {}; (D.carteiras||[]).forEach(c => CAR[c.codigo] = c);

  // Bahia / COF: cresce como a REG3 (meta / base), até 12% do produto na filial (quem já passa disso fica com o que vende)

  const alvo = {}; // o que sobra para a equipe em cada filial × produto

    const fora = linhas.filter(x => x.outra && x.fil === f && x.col === p); const bf = fora.reduce((s,x) => s + x.base, 0);
    let af = bf * g; const cap = meta * P.capFora / 100; if (af > cap) af = Math.max(bf, cap); af = Math.min(af, meta);
    fora.forEach(x => x.meta = bf ? af * x.base / bf : 0);

  const alvoT = Object.values(alvo).reduce((s,v) => s + v, 0), baseNos = Object.values(mixC).reduce((s,v) => s + v, 0);
  const k = baseNos ? alvoT / baseNos : 1; // mesmo % para todas

    x.aj = x.base >= 10 && x.base >= 0.05 * (mixC[x.cart]||0); });

  // o que foi cortado volta para a mesma carteira em outros produtos da mesma filial que ainda têm espaço

function mapaPV(V, cor) {
  const el = document.getElementById('pvMap'); if (!el) return;
  if (typeof L === 'undefined') { el.innerHTML = '<div class="empty">Mapa indisponível (sem conexão com o servidor de mapas).</div>'; return; }
  const m = L.map(el); L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', {maxZoom:18, attribution:'Tiles © Esri'}).addTo(m);
  const pts = [];
  V.forEach(v => { if (!v.lat || !v.lon) return; const p = [+v.lat, +v.lon]; pts.push(p);
    L.circleMarker(p, {radius:8, color:v.dist > 500 ? '#e2413b' : '#fff', weight:v.dist > 500 ? 3 : 1.5, fillColor:cor[v.usuario_id] || '#999', fillOpacity:.9}).addTo(m)
      .bindPopup(`<b>${esc(v.cliente)}</b><br>${esc(v.pessoa)} · ${new Date(v.inicio).toLocaleString('pt-BR', {timeZone:'America/Sao_Paulo', day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit'})}<br>${({vendeu:'Vendeu', cotou:'Cotou', sem_demanda:'Sem demanda', perdeu:'Perdeu'})[v.resultado] || ''}${v.dist > 500 ? `<br><b style="color:#c62828">a ${nf(v.dist / 1000, 1)} km do posto</b>` : ''}`); });
  if (pts.length) m.fitBounds(pts, {padding:[30,30], maxZoom:13}); else m.setView([-7.5, -39], 6);
}
async function fotosPV(box) {
  const imgs = [...box.querySelectorAll('img[data-foto]')]; if (!imgs.length) return;
  const falta = [...new Set(imgs.map(i => i.dataset.foto).filter(p => !PV.fotos[p]))];
  if (falta.length) { try {
    const r = await fetch(`${SB_URL}/storage/v1/object/sign/visitas`, {method:'POST', headers:{apikey:SB_KEY, Authorization:`Bearer ${S.token}`, 'Content-Type':'application/json'}, body:JSON.stringify({expiresIn:3600, paths:falta})});
    (await r.json()).forEach(x => { if (x.signedURL) PV.fotos[x.path] = `${SB_URL}/storage/v1${x.signedURL}`; }); } catch(e) {} }
  imgs.forEach(i => { const u = PV.fotos[i.dataset.foto]; if (u) { i.src = u; i.onclick = () => window.open(u, '_blank'); } else i.remove(); });
}

/* ---------- RETA FINAL DO MÊS ---------- */
function rfStatus(c) {
  if (c.falta <= 0.5) return {k:'ok', t:'Meta garantida'};
  const r = c.por_dia / Math.max(1, c.ritmo || 0);
  return r <= 1 ? {k:'ok', t:'No ritmo'} : r <= 1.3 ? {k:'at', t:'Atenção'} : r <= 2.5 ? {k:'fo', t:'Esforço forte'} : {k:'cr', t:'Muito difícil'};
}
const rfDias = d => nf(d, d % 1 ? 1 : 0) + ' dia' + (d > 1 ? 's' : '');
function rfPlano(c, D) {
  const st = rfStatus(c); const b = [];
  if (c.falta <= 0.5) b.push(`Com o que já está lançado para hoje, a meta está batida. Agora é passar da meta: os clientes abaixo costumam comprar mais.`);
  else {
    b.push(`Faltam <b>${nf(c.falta)} m³</b> em ${rfDias(D.dias_rest)} de venda: <b>${nf(c.por_dia)} m³ por dia</b> (seu ritmo no mês é ${nf(c.ritmo)} m³/dia).`);
    if (c.potencial >= c.falta) b.push(`Os ${nf(c.n_atrasados)} clientes que estão comprando abaixo do normal somam <b>${nf(c.potencial)} m³</b>: dá para fechar a meta só com eles. Comece pelos maiores da lista.`);
    else if (c.potencial > 0) b.push(`Os clientes que estão comprando abaixo do normal somam ${nf(c.potencial)} m³ (${nf(100*c.potencial/c.falta,0)}% do que falta). O resto precisa vir de pedidos maiores dos clientes ativos e de reativação.`);
    if (D.dias_rest <= 3) b.push(`Peça hoje os pedidos de sábado (meio dia) e de segunda: no último dia não dá tempo de recuperar.`);
    if (st.k === 'cr' || st.k === 'fo') b.push(`Foque nos 3 maiores clientes atrasados e fale com a supervisão se precisar de condição especial para fechar.`);
  }
  return b;
}
function rfCaixa(c, D, cons) {
  const st = rfStatus(c); const fimTxt = new Date(D.fim + 'T12:00:00').toLocaleDateString('pt-BR', {month:'long'});
  return `<section class="rf rf-${st.k}"><div class="rf-h"><div><p class="eyebrow">Reta final de ${esc(fimTxt)} · faltam ${rfDias(D.dias_rest)} de venda</p><h3>${c.falta <= 0.5 ? 'Meta garantida! 🎉' : `Faltam ${nf(c.falta)} m³ para bater a meta`}</h3></div><span class="rf-st">${st.t}</span></div>
    <div class="rf-k"><div><span>Meta</span><b>${nf(c.meta)}</b></div><div><span>Vendido${c.vendas_ate ? ' até ' + new Date(c.vendas_ate + 'T12:00:00').toLocaleDateString('pt-BR', {day:'2-digit', month:'2-digit'}) : ''}</span><b>${nf(c.vendido)}</b></div>
      <div><span>Lançado para hoje</span><b>${nf(c.hoje)}</b></div><div><span>Precisa por dia</span><b>${c.falta > 0.5 ? nf(c.por_dia) : '–'}</b><em>ritmo ${nf(c.ritmo)}/dia</em></div>
      <div class="rf-bar"><span>${nf(c.pct, 0)}% da meta</span><div class="track"><i style="width:${Math.min(100, c.pct)}%"></i></div></div></div>
    <ul class="rf-p">${rfPlano(c, D).map(x => `<li>${x}</li>`).join('')}</ul>
    ${(c.clientes||[]).length ? `<h4>Onde atacar · clientes comprando abaixo do normal</h4><div class="rf-cl">${c.clientes.map(x => `<button class="rf-c" ${cons ? `data-id="${x.id}"` : ''} title="Compra em média ${nf(x.media)} m³/mês; em ${esc(fimTxt)} comprou ${nf(x.mes)} m³; última compra ${x.ult ? new Date(x.ult + 'T12:00:00').toLocaleDateString('pt-BR') : '–'}"><b>${esc(x.nome)}</b><span>${esc(x.municipio||'')}${x.uf ? '/' + esc(x.uf) : ''}</span><em>costuma ${nf(x.media)} m³ · comprou ${nf(x.mes)} · <strong>~${nf(x.gap)} m³ a buscar</strong></em></button>`).join('')}</div>` : ''}
  </section>`;
}

  const dTot = (+D.dias_feitos||0) + (+D.dias_rest||0); const esp = dTot ? Math.min(100, 100 * D.dias_feitos / dTot) : 100;

/* ---------- MINHAS VENDAS + RANKING POR REGIÃO (topo dos Pedidos do dia) ---------- */
const REGIOES = ['Suape e Cabedelo','Maranhão','Juazeiro e Teresina','Sinop'];
function rankVendas() {

  const g = {};

    const x = g[k] = g[k] || {consultor:c.consultor || c.carteira, regiao:c.regiao || 'Outras', carts:[], conf:0, vir:0, res:0, fat:0, meta:0, temMeta:false, cp:{}, rp:{}};
    x.carts.push(c.carteira); x.conf += +c.conf_m3||0; x.vir += +c.vir_m3||0; x.res += +c.res_m3||0; x.fat += +c.fat_mes_m3||0;
    if (c.meta_mes_m3 != null) { x.meta += +c.meta_mes_m3; x.temMeta = true; }
    GORD.forEach(p => { x.cp[p] = (x.cp[p]||0) + (+(c.conf_prod||{})[p]||0); x.rp[p] = (x.rp[p]||0) + (+(c.res_prod||{})[p]||0); }); });
  const L = Object.values(g).map(x => { const real = x.fat + x.conf; return {...x, real, pct: x.temMeta && x.meta ? 100*real/x.meta : null, proj: x.fat/dd*dm}; });
  L.sort((a,b) => (b.pct != null) - (a.pct != null) || (b.pct||0) - (a.pct||0) || b.real - a.real);
  const pos = {}; L.forEach(x => { if (x.pct != null) { pos[x.regiao] = (pos[x.regiao]||0) + 1; x.pos = pos[x.regiao]; } else x.pos = null; });
  L.nReg = pos;

}

        if (v > 0 || (old && +old.peso > 0)) body.push({filial:P.fil, carteira:tr.dataset.c, grupo:i.dataset.g, valido_desde:desde, peso:Math.round(v * 100) / 10000}); }));
      try { await api('pesos?on_conflict=filial,carteira,grupo,valido_desde', {method:'POST', headers:{Prefer:'resolution=merge-duplicates,return=minimal'}, body:JSON.stringify(body)});
        d.remove(); toast('Pesos salvos'); await carregarPed(); } catch(x) { toast('Erro ao salvar: ' + errTxt(x)); }
    };

}


function abrirEdicao(p) {
  const R = relogio(); const ts = P.terms.filter(t => t.filial === p.filial);
  const s0 = statusEf(p, R);
  let st = s0 === 'A' ? (p.status_pedido || 'C') : (s0 === 'E' ? 'C' : p.status);
  if (st === 'R' && !R.resAberta) st = 'C';
  const d = document.createElement('div'); d.className = 'modal';
  const vol = t => PRODS.filter(([k,,g]) => t.grupos.includes(g) || +p[k]).map(([k,l,g]) => `<label>${l}<input class="mi" inputmode="numeric" data-k="${k}" value="${+p[k] ? nf(p[k]) : ''}" ${t.grupos.includes(g) ? '' : 'title="Este terminal não tem este produto"'}></label>`).join('');
  const desenha = tid => {
    const t = ts.find(x => x.id === tid) || ts[0];
    d.innerHTML = `<div class="mbox" style="width:min(640px,100%)"><h3>Editar pedido</h3>
      <p class="sub"><b>${esc(p.cliente_nome)}</b> · ${esc(p.carteira)}${p.bandeira ? ' · bandeira Larco' : ''}. Para trocar o cliente, cancele e lance de novo.</p>
      <form class="pform" id="fEd" autocomplete="off">
        <label>Terminal<select id="eTerm">${ts.map(x => `<option value="${x.id}" ${x.id === t.id ? 'selected' : ''}>${esc(x.nome)}</option>`).join('')}</select></label>
        ${p.status === 'V' ? '<label>Tipo<div class="sub">Virado</div></label>' : `<label>Tipo<div class="seg" id="eSt"><button type="button" data-s="C" class="${st==='C'?'on':''}">Confirmado</button><button type="button" data-s="R" class="${st==='R'?'on':''}" ${R.resAberta && p.data === R.hoje ? '' : 'disabled title="Reservas só até 10:30"'}>Reservado</button></div></label>`}
        <div class="full pvol">${vol(t)}</div>
        <label class="full">Observação<input id="eObs" maxlength="200" value="${esc(p.observacao || '')}"></label>
        <p class="full sub">Se o novo volume passar do saldo, o pedido vai para autorização de Hugo/Gabriel.</p>
        <div class="full pact"><span id="eMsg" class="sub"></span><button type="button" class="btn sec" id="eX">Cancelar</button><button class="btn" id="eOk">Salvar alterações</button></div>
      </form></div>`;
    d.querySelectorAll('.pvol input').forEach(i => i.oninput = () => { i.value = i.value.replace(/\D/g,'').replace(/\B(?=(\d{3})+(?!\d))/g, '.'); });
    d.querySelectorAll('#eSt button').forEach(b => b.onclick = () => { if (b.disabled) return; st = b.dataset.s; d.querySelectorAll('#eSt button').forEach(x => x.classList.toggle('on', x === b)); });
    d.querySelector('#eTerm').onchange = e => { d.querySelectorAll('.pvol input').forEach(i => p['_' + i.dataset.k] = i.value); desenha(+e.target.value); d.querySelectorAll('.pvol input').forEach(i => { if (p['_' + i.dataset.k] != null) i.value = p['_' + i.dataset.k]; }); };
    d.querySelector('#eX').onclick = () => d.remove();
    d.querySelector('#fEd').onsubmit = async e => {
      e.preventDefault();
      const term = ts.find(x => x.id === +d.querySelector('#eTerm').value);
      const body = {terminal_id: term.id, observacao: (d.querySelector('#eObs').value || '').trim() || null};
      PRODS.forEach(([k]) => body[k] = 0);
      let tot = 0, fora = [];
      d.querySelectorAll('.pvol input').forEach(i => { const v = +(i.value || '').replace(/\D/g, ''); body[i.dataset.k] = v; tot += v; const g = PRODS.find(x => x[0] === i.dataset.k)[2]; if (v && !term.grupos.includes(g)) fora.push(i.parentElement.firstChild.textContent); });
      const msg = d.querySelector('#eMsg');
      if (!tot) { msg.textContent = 'Informe o volume. Para zerar, use Cancelar pedido.'; return; }
      if (fora.length) { msg.textContent = `${term.nome} não tem: ${fora.join(', ')}.`; return; }
      if (p.status !== 'V') body.status = st;
      d.querySelector('#eOk').disabled = true; msg.textContent = 'Salvando…';
      try {
        const r = await api(`pedidos?id=eq.${p.id}&select=status,motivo_autorizacao`, {method:'PATCH', headers:{Prefer:'return=representation'}, body:JSON.stringify(body)});
        d.remove();
        if (r && r[0] && r[0].status === 'A') toast('Pedido alterado, mas passou do saldo: foi para autorização. ' + (r[0].motivo_autorizacao || ''));
        else toast('Pedido alterado');
        await carregarPed();
      } catch(x) { msg.textContent = errTxt(x); d.querySelector('#eOk').disabled = false; }
    };
  };
  desenha(p.terminal_id); document.body.appendChild(d);
}



function resCart(R, gs) {
  const L = (P.painel?.linhas || []).filter(l => l.tipo === 'reserva_cart' && (+l.cota || +l.usado));
  if (!L.length) return '';
  const cs = [...new Set(L.map(l => l.chave))].sort();
  const dot = (c, g) => { const l = L.find(x => x.chave === c && x.grupo === g); if (!l || !(+l.cota || +l.usado)) return `<i class="rd" title="${GR[g]}: sem reserva"></i>`;
    const sb = (+l.cota||0) - (+l.usado||0); const k = sb < 0 ? 'pas' : (+l.cota && sb <= 0.1 * +l.cota) ? 'lim' : 'ok';
    return `<i class="rd ${k}" title="${GR[g]}: usado ${nf(l.usado)} de ${nf(l.cota)} · ${sb >= 0 ? 'sobra ' + nf(sb) : 'passou ' + nf(-sb)}"></i>`; };
  if (R.bandAberta) return `<div class="pcard" style="margin-bottom:10px"><div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px;margin-bottom:8px"><b>Reserva das bandeiras · até 14:00</b><span class="rleg"><i class="rd ok"></i>sobra<i class="rd lim"></i>no limite<i class="rd pas"></i>passou</span></div>
    <div class="rdots">${cs.map(c => `<div><b>${esc(c)}</b>${gs.map(g => dot(c, g)).join('')}</div>`).join('')}</div>
    <div class="rleg" style="margin-top:8px">Pontos na ordem ${gs.map(g => GR[g]).join(' · ')}. Passe o mouse (ou toque) para ver os litros.</div></div>`;
  return `<div><h3>Reserva das bandeiras por carteira <small class="sub">${R.bandAberta ? 'até 14:00 · usado / reservado' : 'liberada às 14:00 · usado'}</small></h3><table class="ptab"><thead><tr><th>Carteira</th>${gs.map(g => `<th class="r">${GR[g]}</th>`).join('')}</tr></thead><tbody>
    ${cs.map(c => `<tr><td><b>${esc(c)}</b></td>${gs.map(g => { const l = L.find(x => x.chave === c && x.grupo === g); if (!l) return '<td class="r mut">—</td>'; const sb = (+l.cota||0) - (+l.usado||0);
      return `<td class="r">${nf(l.usado)}${R.bandAberta && +l.cota ? `<small>de ${nf(l.cota)} · ${sb >= 0 ? 'sobra ' + nf(sb) : 'passou ' + nf(-sb)}</small>` : ''}</td>`; }).join('')}</tr>`).join('')}</tbody></table></div>`;
}

/* ---------- PLANTÕES E SUBSTITUIÇÕES ---------- */

    <h3 style="margin-top:16px">Nova</h3>
    <div class="pform">
      <label>Quem vai cobrir<select id="cQuem">${pessoas.filter(p => p.perfil !== 'supervisor').map(p => `<option value="${p.id}">${esc(p.nome)}</option>`).join('')}</select></label>
      <label>Motivo<select id="cMot"><option value="plantao">Plantão</option><option value="ferias">Férias</option><option value="atestado">Atestado / doença</option><option value="outro">Outro</option></select></label>

      <label>Até<input type="date" id="cFim" value="${sab}"></label>
      <div class="full"><span class="sub">Carteiras que vai cobrir</span><div class="cobc">${carts.map(c => `<label class="chk"><input type="checkbox" value="${esc(c)}"> ${esc(c)} <small>${esc(cons(c))}</small></label>`).join('')}</div></div>
      <label class="full">Observação<input id="cObs" maxlength="150" placeholder="opcional"></label>
    </div>
    <div class="mact"><span id="cMsg" class="sub" style="color:var(--coral)"></span><button class="btn sec" id="cX">Fechar</button><button class="btn" id="cOk">Salvar</button></div></div>`;
  document.body.appendChild(d);

/* ---------- METAS DO MÊS → PRODUTO, PESOS E META DIA ---------- */
const diasVenda = (ini, fim) => { let n = 0; for (let d = new Date(ini + 'T12:00:00'); iso(d) <= fim; d.setDate(d.getDate() + 1)) { const w = d.getDay(); n += w === 0 ? 0 : w === 6 ? 0.5 : 1; } return n; };
async function abrirMetasMes(mesIni) {
  const h = hojeSP(); const prox = new Date(h.getFullYear(), h.getMonth() + (h.getDate() >= 20 ? 1 : 0), 1);
  const mes = mesIni || iso(prox).slice(0, 7) + '-01';
  const ant = (() => { const d = new Date(mes + 'T12:00:00'); d.setMonth(d.getMonth() - 1); return iso(d).slice(0, 7) + '-01'; })();
  const [mm, ma, mp] = await Promise.all([api(`metas?mes=eq.${mes}&select=*`), api(`metas?mes=eq.${ant}&select=*`), api(`meta_produto?mes=eq.${mes}&select=*`)]);
  const carts = S.resumo.map(r => r.carteira_codigo);
  const cons = c => (S.resumo.find(r => r.carteira_codigo === c) || {}).consultor_nome || '';
  const fixa = c => (S.resumo.find(r => r.carteira_codigo === c) || {}).aceita_prospect === false && /EMB/.test(c);
  const val = (L, c) => { const x = L.find(m => m.carteira_codigo === c); return x ? +x.meta_m3 : null; };
  const nomeF = f => f === 'FORA' ? 'Fora (ex.: Bahia)' : (NOME_PAINEL[f] || (P.filiais.find(x => x.codigo === f) || {}).nome || f);
  const fimMes = (() => { const d = new Date(mes + 'T12:00:00'); d.setMonth(d.getMonth() + 1); d.setDate(0); return iso(d); })();
  const dias = diasVenda(mes, fimMes);
  const COLM = [['GAS','Gasolina'],['ETA','Etanol'],['USINA','Usina'],['S10','S10'],['S500','S500']];
  const previa = () => {
    if (!mp.length) return '<div class="empty">Salve as metas e clique em <b>Calcular divisão</b> para ver como fica por produto.</div>';
    const cs = [...new Set(mp.map(x => x.carteira))].sort();
    const sum = (f) => mp.filter(f).reduce((s, x) => s + +x.m3, 0);
    const linhas = cs.map(c => { const tot = sum(x => x.carteira === c); const base = (mp.find(x => x.carteira === c) || {}).base;
      return `<tr><td><b>${esc(c)}</b><small>${esc(cons(c))}${base === 'media_filial' ? ' · sem histórico: usou a média da filial' : ''}${fixa(c) ? ' · bandeira: fora dos pesos' : ''}</small></td><td class="r"><b>${nf(tot)}</b></td>
        ${COLM.map(([k]) => { const v = sum(x => x.carteira === c && x.coluna === k); const fs = mp.filter(x => x.carteira === c && x.coluna === k).sort((a,b) => b.m3 - a.m3);
          return `<td class="r">${v ? `${nf(v)}<small>${nf(100 * v / tot, 0)}%${fs.length > 1 ? ' · ' + fs.map(x => `${esc(nomeF(x.filial))} ${nf(x.m3)}`).join(', ') : fs[0] && fs[0].filial !== '16' ? ' · ' + esc(nomeF(fs[0].filial)) : ''}</small>` : '<span class="mut">—</span>'}</td>`; }).join('')}</tr>`; }).join('');
    const fils = [...new Set(mp.map(x => x.filial))].filter(f => f !== 'FORA');
    const md = fils.map(f => `<tr><td><b>${esc(nomeF(f))}</b></td>${COLM.map(([k]) => { const v = sum(x => x.filial === f && x.coluna === k); return `<td class="r">${v ? nf(Math.round(v * 1000 / dias / 1000) * 1000) : '<span class="mut">—</span>'}</td>`; }).join('')}</tr>`).join('');
    return `<h3 style="margin-top:14px">Divisão por produto (m³ no mês)</h3><div class="scroll"><table class="ptab"><thead><tr><th>Carteira</th><th class="r">Total</th>${COLM.map(([,l]) => `<th class="r">${l}</th>`).join('')}</tr></thead><tbody>${linhas}</tbody></table></div>
      <h3 style="margin-top:14px">Meta Dia Plan que vai ficar (litros por dia útil · sábado = metade)</h3><div class="scroll"><table class="ptab"><thead><tr><th>Filial</th>${COLM.map(([,l]) => `<th class="r">${l}</th>`).join('')}</tr></thead><tbody>${md}</tbody></table></div>
      <p class="sub">Filiais com carteiras sem meta cadastrada ficam com a Meta Dia Plan menor. Preencha todas as carteiras que vendem pela filial.</p>`;
  };
  const d = document.createElement('div'); d.className = 'modal';
  d.innerHTML = `<div class="mbox" style="width:min(1000px,100%)"><h3>Metas do mês</h3>
    <p class="sub">Digite a meta de cada carteira em m³. O sistema divide por produto e filial conforme o que a carteira vendeu nos últimos 3 meses e, ao aplicar, atualiza os pesos das carteiras e a Meta Dia Plan das filiais.</p>
    <div class="bh-r"><label class="sub">Mês <input type="month" id="mMes" value="${mes.slice(0,7)}"></label><span class="sub">${nf(dias, 1)} dias de venda no mês</span></div>
    <div class="cobc metg">${carts.map(c => `<label>${esc(c)} <small>${esc(cons(c))}</small><input class="mi" inputmode="decimal" data-c="${esc(c)}" value="${val(mm, c) != null ? nf(val(mm, c)) : ''}" placeholder="${val(ma, c) != null ? 'mês ant. ' + nf(val(ma, c)) : 'm³'}"></label>`).join('')}</div>
    <div id="mPrev">${previa()}</div>
    <div class="mact"><span id="mMsg" class="sub"></span><button class="btn sec" id="mX">Fechar</button><button class="btn sec" id="mCalc">Salvar metas e calcular divisão</button><button class="btn" id="mAp" ${mp.length ? '' : 'disabled'}>Aplicar pesos e Meta Dia Plan</button></div></div>`;
  document.body.appendChild(d);
  d.querySelector('#mX').onclick = () => d.remove();
  d.querySelector('#mMes').onchange = e => { d.remove(); abrirMetasMes(e.target.value + '-01'); };
  d.querySelector('#mCalc').onclick = async () => {
    const msg = d.querySelector('#mMsg'); msg.textContent = 'Calculando…';
    const body = [...d.querySelectorAll('.metg input')].filter(i => i.value.trim()).map(i => ({carteira_codigo:i.dataset.c, mes, meta_m3:+i.value.replace(/\./g,'').replace(',', '.')}));
    try {
      if (body.length) await api('metas?on_conflict=carteira_codigo,mes', {method:'POST', headers:{Prefer:'resolution=merge-duplicates,return=minimal'}, body:JSON.stringify(body)});
      const r = await rpc('calcular_metas', {p_mes:mes});
      d.remove(); await abrirMetasMes(mes);
      toast(`Divisão calculada com o histórico de ${dt(r.historico_de)} a ${dt(r.historico_ate)}.` + (r.sem_base && r.sem_base.length ? ` Sem histórico nem filial base: ${r.sem_base.join(', ')}.` : ''));
    } catch(x) { msg.textContent = errTxt(x); }
  };
  d.querySelector('#mAp').onclick = async () => {
    const msg = d.querySelector('#mMsg'); msg.textContent = 'Aplicando…';
    try { const r = await rpc('aplicar_metas', {p_mes:mes}); d.remove(); toast(`Aplicado: pesos das carteiras e Meta Dia Plan valem a partir de ${dt(mes)}.`); await atualizarPed(); }
    catch(x) { msg.textContent = errTxt(x); }
  };
}

/* ---------- FATURAMENTO (usuários das bases) ---------- */
const F = { fils:[], terms:[], fil:null, data:null, peds:[], timer:null, em:null };
async function telaFaturamento() {
  S.view = 'fat';
  $('#app').innerHTML = hdrFat() + '<main class="eq ped"><div class="empty">Carregando…</div></main>'; ligarHdrFat();
  try {
    const cods = (await api(`usuario_filiais?usuario_id=eq.${S.me.id}&select=filial`)).map(x => x.filial);
    F.fils = cods.length ? await api(`filiais?codigo=in.(${cods.join(',')})&order=ordem`) : [];
    F.terms = await api('terminais?ativo=eq.true&order=filial,ordem');
  } catch(e) { F.fils = []; }
  if (!F.fils.length) { $('main.ped').innerHTML = '<div class="empty">Seu usuário ainda não tem base vinculada. Fale com o Hugo.</div>'; return; }
  if (!F.fils.some(f => f.codigo === F.fil)) F.fil = F.fils[0].codigo;
  F.data = F.data || iso(hojeSP());
  await carregarFat();
  clearInterval(F.timer);
  F.timer = setInterval(() => { if (S.view === 'fat') carregarFat(); }, 60000);
}
function hdrFat() {
  return `<header><button type="button" class="brand home" id="bHome" title="Voltar para hoje"><img class="lgimg" src="${LOGO_W}" alt="Larco"><span class="crm">CRM</span></button><h1>Faturamento</h1><span class="sp"></span>
    <span class="who">${esc(S.me.nome)}</span><button class="btn sec" id="bSair">Sair</button></header>`;
}
function ligarHdrFat() {
  $('#bSair').onclick = () => { clearInterval(F.timer); S.view = null; sair(); };
  $('#bHome').onclick = () => { F.data = iso(hojeSP()); carregarFat(); };
}
async function carregarFat() {
  try {
    const cols = 'id,data,terminal_id,carteira,cliente_nome,status,gas,gas_ad,eta,s10,s10_ad,s500,s500_ad,observacao,criado_em,origem,pedido_sicof,virado_base,carregado_em,origem_id';
    F.peds = await api(`pedidos?data=eq.${F.data}&filial=eq.${F.fil}&status=in.(C,V,R,A)&virado=eq.false&select=${cols}&order=criado_em`);
    F.ant = []; F.antData = null;
    if (F.data === iso(hojeSP())) {
      const d0 = new Date(F.data + 'T12:00:00'); d0.setDate(d0.getDate() - 4);
      const ant = await api(`pedidos?data=lt.${F.data}&data=gte.${iso(d0)}&filial=eq.${F.fil}&status=in.(C,V)&virado=eq.false&select=${cols}&order=data.desc,criado_em`);
      F.antData = ant.length ? ant[0].data : null; F.ant = ant.filter(p => p.data === F.antData);
    }
    F.em = new Date();
  } catch(e) { $('main.ped').innerHTML = `<div class="empty">Não foi possível carregar os pedidos: ${esc(errTxt(e))}</div>`; return; }
  desenharFat();
}
function desenharFat() {
  const hoje = iso(hojeSP());
  const agoraMin = (() => { const t = new Date().toLocaleTimeString('pt-BR', {timeZone:'America/Recife', hour:'2-digit', minute:'2-digit', hour12:false}).split(':'); return +t[0] * 60 + +t[1]; })();
  const resValida = F.data > hoje || (F.data === hoje && agoraMin < 630);
  const peds = F.peds.filter(p => p.status !== 'R' || resValida);
  const ts = F.terms.filter(t => t.filial === F.fil);
  const fil = F.fils.find(f => f.codigo === F.fil) || {};
  const cols = PRODS.filter(([k]) => peds.some(p => +p[k]));
  const soma = (lst, k) => lst.reduce((a, p) => a + (+p[k] || 0), 0);
  const tot = p => PRODS.reduce((a, [k]) => a + (+p[k] || 0), 0);
  const prox = (() => { const d = new Date(hoje + 'T12:00:00'); d.setDate(d.getDate() + (d.getDay() === 6 ? 2 : 1)); return iso(d); })();
  const STF = {C:['Confirmado','ok'], V:['Virado de ontem','vir'], R:['Reserva (até 10:30)','rsv'], A:['Aguardando autorização','aut']};
  const podeBase = F.data === hoje && agoraMin < 720;
  const linhaT = t => { const L = peds.filter(p => p.terminal_id === t.id); if (!L.length) return '';
    const ok = L.filter(p => p.status !== 'A'), aut = L.filter(p => p.status === 'A');
    return `<tr><td><b>${esc(t.nome)}</b>${aut.length ? `<small>+ ${nf(aut.reduce((a,p) => a + tot(p), 0))} L aguardando autorização</small>` : ''}</td>${cols.map(([k]) => `<td class="r">${soma(ok,k) ? `<b>${nf(soma(ok,k))}</b>` : '<span class="mut">—</span>'}</td>`).join('')}<td class="r"><b>${nf(ok.reduce((a,p) => a + tot(p), 0))}</b></td><td class="r">${ok.length}</td></tr>`; };
  const okAll = peds.filter(p => p.status !== 'A');
  const matriz = cols.length ? `<table class="ptab"><thead><tr><th>Terminal</th>${cols.map(([,n]) => `<th class="r">${n}</th>`).join('')}<th class="r">Total (L)</th><th class="r">Pedidos</th></tr></thead><tbody>
    ${ts.map(linhaT).join('')}
    <tr class="tot"><td><b>Total da base</b></td>${cols.map(([k]) => `<td class="r"><b>${nf(soma(okAll,k))}</b></td>`).join('')}<td class="r"><b>${nf(okAll.reduce((a,p) => a + tot(p), 0))}</b></td><td class="r"><b>${okAll.length}</b></td></tr></tbody></table>`
    : '<div class="empty">Nenhum pedido lançado para esta base neste dia.</div>';
  const prodTxt = p => PRODS.filter(([k]) => +p[k]).map(([k]) => `<span class="pq">${PCURTO[k]} <b>${nf(p[k])}</b></span>`).join(' ');
  const lista = ts.map(t => { const L = peds.filter(p => p.terminal_id === t.id); if (!L.length) return '';
    return `<h3 class="fat-t">${esc(t.nome)} <small>${L.length} pedido(s)</small></h3><div class="scroll"><table class="ptab plist"><thead><tr><th>Hora</th><th>Cliente</th><th>Carteira</th><th>Volumes (L)</th><th>Situação</th></tr></thead><tbody>
      ${L.map(p => `<tr class="st-${p.status}"><td><small>${new Date(p.criado_em).toLocaleTimeString('pt-BR', {timeZone:'America/Sao_Paulo', hour:'2-digit', minute:'2-digit'})}</small></td>
        <td><b>${esc(p.cliente_nome)}</b>${p.origem === 'gestao' ? ` <span class="tag gst">SICOF${p.pedido_sicof ? ' ' + esc(p.pedido_sicof) : ''}</span>` : ''}</td>
        <td>${esc(p.carteira)}</td><td>${prodTxt(p)}</td><td>${p.virado_base ? `<span class="stp vir">Carregado após a abertura</span>${podeBase ? ` <button class="btn sm sec" data-desf="${p.origem_id}">Desfazer</button>` : ''}` : `<span class="stp ${STF[p.status][1]}">${STF[p.status][0]}</span>`}</td></tr>`).join('')}</tbody></table></div>`; }).join('');
  const listaAnt = F.antData ? ts.map(t => { const L = F.ant.filter(p => p.terminal_id === t.id); if (!L.length) return '';
    return `<h3 class="fat-t">${esc(t.nome)} <small>${L.length} pedido(s)</small></h3><div class="scroll"><table class="ptab plist"><thead><tr><th>Cliente</th><th>Carteira</th><th>Volumes (L)</th><th></th></tr></thead><tbody>
      ${L.map(p => `<tr><td><b>${esc(p.cliente_nome)}</b>${p.origem === 'gestao' ? ` <span class="tag gst">SICOF${p.pedido_sicof ? ' ' + esc(p.pedido_sicof) : ''}</span>` : ''}</td><td>${esc(p.carteira)}</td><td>${prodTxt(p)}</td>
        <td class="acts">${p.carregado_em ? `<span class="stp vir">✓ Carregado hoje</span>${podeBase ? ` <button class="btn sm sec" data-desf="${p.id}">Desfazer</button>` : ''}` : podeBase ? `<button class="btn sm" data-carr="${p.id}">Carregou hoje, após a abertura</button>` : ''}</td></tr>`).join('')}</tbody></table></div>`; }).join('') : '';
  const chips = F.fils.length > 1 ? `<div class="chips" id="chFat">${F.fils.map(f => `<button data-f="${f.codigo}" class="${f.codigo === F.fil ? 'on' : ''}">${esc(f.nome)}</button>`).join('')}</div>` : '';
  $('#app').innerHTML = hdrFat() + `<main class="eq ped">
    <section class="blk"><div class="bh"><div><h3>${esc(fil.nome || '')} · ${dt(F.data)}</h3>
      <p class="sub">Pedidos lançados no CRM para sair desta base, por terminal e produto (litros). Conta confirmados, virados de ontem e reservas ainda válidas; os que aguardam autorização aparecem à parte. Atualizado às ${F.em ? F.em.toLocaleTimeString('pt-BR', {timeZone:'America/Sao_Paulo', hour:'2-digit', minute:'2-digit'}) : ''}, atualiza sozinho a cada minuto.</p></div>
      <div class="bh-r">${chips}<div class="seg" id="segDia"><button data-d="${hoje}" class="${F.data === hoje ? 'on' : ''}">Hoje</button><button data-d="${prox}" class="${F.data === prox ? 'on' : ''}">Próximo dia</button></div><input type="date" id="fData" value="${F.data}" aria-label="Data"></div></div>
      ${matriz}</section>
    <section class="blk"><div class="bh"><div><h3>Pedidos por terminal</h3></div></div>${lista || '<div class="empty">Nenhum pedido.</div>'}</section>
    ${F.antData ? `<section class="blk"><div class="bh"><div><h3>Faturados em ${dt(F.antData)} · carregaram hoje?</h3><p class="sub">Marque os pedidos que só carregaram hoje, depois da abertura. Eles passam a contar na movimentação de hoje como <b>carregados após a abertura</b>. ${podeBase ? 'Você pode marcar e desfazer até 12:00.' : 'Prazo encerrado às 12:00 — para alterar, fale com o Hugo ou o Gabriel.'}</p></div></div>${listaAnt}</section>` : ''}</main>`;
  ligarHdrFat();
  document.querySelectorAll('#chFat button').forEach(b => b.onclick = () => { F.fil = b.dataset.f; carregarFat(); });
  document.querySelectorAll('#segDia button').forEach(b => b.onclick = () => { F.data = b.dataset.d; carregarFat(); });
  $('#fData').onchange = e => { if (e.target.value) { F.data = e.target.value; carregarFat(); } };
  document.querySelectorAll('[data-carr]').forEach(b => b.onclick = async () => {
    const p = F.ant.find(x => x.id === +b.dataset.carr);
    if (!confirm(`Confirmar que ${p ? p.cliente_nome : 'o pedido'} carregou hoje, depois da abertura?`)) return;
    b.disabled = true;
    try { await rpc('carregar_apos_abertura', {p_id: +b.dataset.carr}); toast('Marcado como carregado após a abertura'); } catch(e) { toast(errTxt(e)); }
    carregarFat(); });
  document.querySelectorAll('[data-desf]').forEach(b => b.onclick = async () => {
    b.disabled = true;
    try { await rpc('desfazer_carregamento', {p_id: +b.dataset.desf}); toast('Desfeito'); } catch(e) { toast(errTxt(e)); }
    carregarFat(); });
}

/* ---------- VISÃO GERAL (monitoramento das filiais) ---------- */
const COLS = [['GAS','GAS C'],['ETA','EHC'],['S10','S10'],['S500','S500'],['USINA','USINA']];
const NOME_PAINEL = {'16':'Ipojuca', '17':'São Luís'};
const veGeral = () => verTodas() || S.me.perfil === 'gerente';
function segModo() {
  return veGeral() ? `<div class="seg" id="segModo"><button data-m="geral" class="${P.modo==='geral'?'on':''}">Visão geral</button><button data-m="filial" class="${P.modo!=='geral'?'on':''}">Por filial</button></div>` : '';
}
function ligarSegModo() {
  document.querySelectorAll('#segModo button').forEach(b => b.onclick = async () => { P.modo = b.dataset.m; await atualizarPed(); });
}
async function atualizarPed() { if (P.modo === 'geral') await carregarGeral(); else await carregarPed(); }
async function carregarGeral() {
  P.geral = await rpc('monitor_vendas', {p_data:P.data});
  await carregarAlerta();
  desenharGeral();
}
function desenharGeral() {
  const L = P.geral?.linhas || []; const a = String(P.geral?.agora || '');
  const fils = []; L.forEach(l => { if (!fils.find(f => f.filial === l.filial)) fils.push({filial:l.filial, nome:l.nome, ordem:l.ordem}); });
  fils.sort((x,y) => x.ordem - y.ordem);
  const n = v => +v || 0;
  const tot = {meta:0, cota:0, lanc:0, vir:0}; L.forEach(l => { tot.meta += n(l.meta); tot.cota += n(l.cota); tot.lanc += n(l.lancado); tot.vir += n(l.virados); });
  const pct = (x, y) => y ? nf(100 * x / y, 0) + '%' : '–';
  const card = f => {
    const cs = COLS.filter(([k]) => L.some(l => l.filial === f.filial && l.coluna === k));
    const g = k => L.find(l => l.filial === f.filial && l.coluna === k) || {};
    const T = k => cs.reduce((s,[c]) => s + n(g(c)[k]), 0);
    const sal = (c, l) => { const v = c - l; return `<td class="r ${v < 0 ? 'sneg' : 'spos'}">${nf(v)}</td>`; };
    const semCota = !cs.some(([c]) => g(c).cota != null);
    return `<button class="mcard" data-f="${f.filial}" title="Abrir ${esc(f.nome)}">
      <div class="mtit">${esc(NOME_PAINEL[f.filial] || f.nome)}${semCota ? ' <span class="mwarn">cota não lançada</span>' : ''}</div>
      <table class="mtab"><thead><tr><th></th>${cs.map(([,l]) => `<th class="r">${l}</th>`).join('')}<th class="r">Total</th></tr></thead><tbody>
      <tr class="mmeta"><td>Meta Dia Plan</td>${cs.map(([c]) => `<td class="r">${nf(g(c).meta)}</td>`).join('')}<td class="r">${nf(T('meta'))}</td></tr>
      <tr><td>Cota/dia dispon.</td>${cs.map(([c]) => `<td class="r">${g(c).cota == null ? '–' : nf(g(c).cota)}</td>`).join('')}<td class="r">${nf(T('cota'))}</td></tr>
      <tr><td>Lançado</td>${cs.map(([c]) => `<td class="r" title="${n(g(c).virados) ? `inclui ${nf(g(c).virados)} L virados` : ''}">${nf(n(g(c).lancado))}${n(g(c).virados) ? '<i class="vtag">V</i>' : ''}</td>`).join('')}<td class="r">${nf(T('lancado'))}</td></tr>
      <tr class="msal"><td>Saldo cota dia</td>${cs.map(([c]) => sal(n(g(c).cota), n(g(c).lancado))).join('')}${sal(T('cota'), T('lancado'))}</tr>
      <tr class="mpct"><td>% da meta</td>${cs.map(([c]) => `<td class="r">${pct(n(g(c).lancado), n(g(c).meta))}</td>`).join('')}<td class="r"><b>${pct(T('lancado'), T('meta'))}</b></td></tr>
      </tbody></table></button>`;
  };
  $('#app').innerHTML = hdrPed() + `<main class="eq ped">
    <section class="blk"><div class="bh"><div><h3>Monitoramento de Vendas · ${dt(P.data)}</h3>
      <p class="sub">Lançado = pedidos confirmados + reservas válidas (até 10:30) + virados (<i class="vtag">V</i>). Saldo = disponível − lançado. Atualizado às ${esc(a.slice(11,16))}, atualiza sozinho a cada 30 s.</p></div>
      <div class="bh-r">${segModo()}<input type="date" id="pData" value="${P.data}" aria-label="Data">${ehOp() ? '<button class="btn sm" id="bMetasMes">Metas do mês</button><button class="btn sm sec" id="bMeta">Meta Dia Plan</button>' : ''}</div></div>
      <div class="strip mstrip">
        <div class="st"><b>${nf(tot.meta)}</b><span>Meta dia (L)</span></div>
        <div class="st"><b>${nf(tot.cota)}</b><span>Cota disponível</span></div>
        <div class="st"><b>${nf(tot.lanc)}</b><span>Lançado${tot.vir ? ` · ${nf(tot.vir)} virados` : ''}</span></div>
        <div class="st ${tot.cota - tot.lanc < 0 ? 'ok' : ''}"><b>${nf(tot.cota - tot.lanc)}</b><span>Saldo cota dia</span></div>
        <div class="st"><b>${pct(tot.lanc, tot.meta)}</b><span>da meta do dia</span></div>
      </div>
      ${alertaGestao(null)}
      <div class="mgrid">${fils.map(card).join('') || '<div class="empty">Nenhuma filial com meta ou cota para este dia.</div>'}</div>
    </section></main>`;
  ligarHdrPed(); ligarSegModo();
  $('#pData').onchange = async e => { if (!e.target.value) return; P.data = e.target.value; await atualizarPed(); };
  if ($('#bMeta')) $('#bMeta').onclick = abrirMeta;
  if ($('#bMetasMes')) $('#bMetasMes').onclick = () => abrirMetasMes();
  document.querySelectorAll('.mcard').forEach(b => b.onclick = async () => { if (!P.filiais.some(f => f.codigo === b.dataset.f)) return; P.fil = b.dataset.f; P.modo = 'filial'; await carregarPed(); });
}
async function abrirMeta() {
  const fil = P.filiais;
  const met = await api(`meta_dia?valido_desde=lte.${P.data}&order=valido_desde.desc&select=*`);
  const ef = {}; met.forEach(m => { const k = m.filial + '|' + m.coluna; if (!(k in ef)) ef[k] = m; });
  const colsF = f => COLS.filter(([k]) => k === 'USINA' ? P.terms.some(t => t.filial === f && t.coluna_painel === 'USINA') : P.terms.some(t => t.filial === f && !t.coluna_painel && t.grupos.includes(k)));
  const d = document.createElement('div'); d.className = 'modal';
  d.innerHTML = `<div class="mbox" style="width:min(860px,100%)"><h3>Meta Dia Plan</h3><p class="sub">Litros planejados para vender por dia em cada filial.</p>
    <div class="scroll"><table class="ptab"><thead><tr><th>Filial</th>${COLS.map(([,l]) => `<th class="r">${l}</th>`).join('')}</tr></thead><tbody>
    ${fil.map(f => { const cs = colsF(f.codigo).map(c => c[0]); return `<tr><td><b>${esc(NOME_PAINEL[f.codigo] || f.nome)}</b></td>${COLS.map(([k]) => cs.includes(k) ? `<td class="r"><input class="mi" inputmode="numeric" data-f="${f.codigo}" data-c="${k}" value="${ef[f.codigo+'|'+k] ? nf(ef[f.codigo+'|'+k].litros) : ''}"></td>` : '<td class="r mut">—</td>').join('')}</tr>`; }).join('')}
    </tbody></table></div>
    <label class="sub">Vale a partir de <input type="date" id="mDesde" value="${P.data}"></label>
    <div class="mact"><button class="btn sec" id="mX">Cancelar</button><button class="btn" id="mOk">Salvar meta</button></div></div>`;
  document.body.appendChild(d);
  d.querySelectorAll('input.mi').forEach(i => i.oninput = () => { i.value = i.value.replace(/\D/g,'').replace(/\B(?=(\d{3})+(?!\d))/g, '.'); });
  d.querySelector('#mX').onclick = () => d.remove();
  d.querySelector('#mOk').onclick = async () => {
    const desde = d.querySelector('#mDesde').value || P.data;
    const body = [...d.querySelectorAll('input.mi')].map(i => ({filial:i.dataset.f, coluna:i.dataset.c, valido_desde:desde, litros:+(i.value || '').replace(/\D/g, '')}));
    try { await api('meta_dia?on_conflict=filial,coluna,valido_desde', {method:'POST', headers:{Prefer:'resolution=merge-duplicates,return=minimal'}, body:JSON.stringify(body)});
      d.remove(); toast('Meta salva'); await carregarGeral(); } catch(x) { toast('Erro ao salvar: ' + errTxt(x)); }
  };
}

/* ---------- LARCO NOEL (campanha dez/2026) ----------
   Liga sozinho de 01 a 31/12. Para testar antes: abra o CRM com ?natal=1 no endereço. */
const NOEL = { ini:'2026-12-01', fim:'2026-12-31', fimJanelas:'2026-12-24', jan:null, abertas:[], pres:[], vend:null, t:0, boot:false, reg:null, diaSel:null };
const noelTeste = (() => { const q = /[?&]natal=1/.test(location.search); try { if (q) sessionStorage.setItem('larconoel_teste','1'); return sessionStorage.getItem('larconoel_teste') === '1'; } catch(e) { return q; } })();
const noelHoje = () => iso(hojeSP());
const noelAtivo = () => { if (!S.me || S.me.perfil === 'faturamento') return false; const h = noelHoje(); return noelTeste || (h >= NOEL.ini && h <= NOEL.fim); };
const noelMinhas = () => new Set((S.me?.usuario_carteiras || []).map(c => c.carteira_codigo));
async function noelCarregar() {
  const h = noelHoje();
  try { let j = await api(`natal_janelas?dia=eq.${h}&select=*`);
    if (!j.length && noelTeste && h < NOEL.ini) j = await api('natal_janelas?select=*&order=dia&limit=1');
    NOEL.jan = j[0] || null; } catch(e) { NOEL.jan = null; }
  try { NOEL.abertas = await api('natal_janelas?select=dia,titulo,presentes,coletiva&order=dia'); } catch(e) { NOEL.abertas = []; }
  try { NOEL.pres = await api('natal_presentes?select=dia,carteira,qtd'); } catch(e) { NOEL.pres = []; }
  try { NOEL.vend = await rpc('painel_vendas_consultor', {p_data:h}); } catch(e) { NOEL.vend = null; }
  NOEL.t = Date.now();
}
function noelLista() {
  const V = NOEL.vend; if (!V || !V.carteiras) return [];
  const dm = +V.dias_mes || 1, da = +V.dias_ate_hoje || 1, pd = pesoDia(noelHoje()), g = {};
  V.carteiras.forEach(c => { const k = c.consultor || c.carteira;
    const x = g[k] = g[k] || {nome:k, regiao:c.regiao || 'Outras', carts:[], conf:0, fat:0, meta:0};
    x.carts.push(c.carteira); x.conf += +c.conf_m3 || 0; x.fat += +c.fat_mes_m3 || 0; if (c.meta_mes_m3 != null) x.meta += +c.meta_mes_m3; });
  const pc = {}; NOEL.pres.forEach(p => pc[p.carteira] = (pc[p.carteira] || 0) + (+p.qtd || 0));
  return Object.values(g).map(x => { const real = x.fat + x.conf, metaDia = x.meta ? x.meta / dm * pd : 0, metaAte = x.meta ? x.meta * da / dm : 0;
    return {...x, real, metaDia, pct: x.meta ? 100 * real / x.meta : null, presentes: x.carts.reduce((t, c) => t + (pc[c] || 0), 0),
      bola: metaAte && real >= metaAte ? 'ouro' : metaDia && x.conf >= metaDia ? 'on' : 'off'}; });
}
function noelDiasRest() { let t = 0; const d = hojeSP(); d.setHours(12,0,0,0); const fim = new Date(2026, 11, 31, 12);
  while (d <= fim) { const w = d.getDay(); if (iso(d) !== '2026-12-25') t += w === 0 ? 0 : w === 6 ? 0.5 : 1; d.setDate(d.getDate() + 1); } return t; }
function noelFaixa() {
  const rev = noelHoje() > NOEL.fimJanelas && !noelTeste, j = NOEL.jan;
  const txt = rev ? `🎆 <b>Contagem pro Réveillon</b> · faltam ${String(noelDiasRest()).replace('.', ',')} dias úteis para fechar a meta. Bora acender a estrela!`
    : j ? `🎁 <b>${esc(j.titulo)}</b> · ${esc(j.desafio)} <small>Vale até o fechamento de hoje.</small>`
    : '🎄 <b>Larco Noel</b> · hoje não tem janela. Bata a meta do dia e acenda a sua bola!';
  return `<div class="noel-faixa" id="noelFaixa"><span class="nf-t">${txt}</span><span class="nf-a">${j && !rev ? '<button type="button" class="nf-b sec" id="noelJan">Abrir janela</button>' : ''}<button type="button" class="nf-b" id="noelArv">🎄 Ver árvore</button></span></div>`;
}
function noelInjetar() {
  const hd = document.querySelector('#app header'); if (!hd || document.getElementById('noelFaixa')) return;
  document.body.classList.add('noel'); hd.insertAdjacentHTML('afterend', '<div class="noel-luzes" aria-hidden="true">' + '<i></i>'.repeat(40) + '</div>' + noelFaixa());
  if (!document.querySelector('.noel-neve')) { const nv = document.createElement('div'); nv.className = 'noel-neve'; nv.setAttribute('aria-hidden', 'true');
    nv.innerHTML = Array.from({length:22}, (_, i) => `<i style="left:${(i * 4.6 + (i % 3) * 1.7) % 100}%;font-size:${9 + (i % 4) * 3}px;animation-duration:${9 + (i % 5) * 2.5}s;animation-delay:-${(i * 1.9) % 12}s">❄</i>`).join('');
    document.body.appendChild(nv); }
  document.getElementById('noelArv').onclick = noelArvore;
  try { noelPersonagens(); } catch(e) {}
  const bj = document.getElementById('noelJan'); if (bj) bj.onclick = noelPopup;
}
