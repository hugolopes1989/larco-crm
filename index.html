ss=\"nariz\"/><circle cx=\"59\" cy=\"89\" r=\"2.5\" fill=\"#fff\" opacity=\".7\"/><path d=\"M54 106 Q62 112 70 106\" stroke=\"#7a4a26\" stroke-width=\"2.5\" fill=\"none\" stroke-linecap=\"round\"/><path d=\"M40 118 Q62 132 84 118 L84 128 Q62 140 40 128Z\" fill=\"#1fa65a\"/><circle cx=\"62\" cy=\"130\" r=\"5\" fill=\"#ffcc00\"/></svg>", treno:"<svg viewBox=\"0 0 260 70\" xmlns=\"http://www.w3.org/2000/svg\"><g fill=\"#a0673a\"><ellipse cx=\"200\" cy=\"38\" rx=\"20\" ry=\"9\"/><circle cx=\"220\" cy=\"28\" r=\"7\"/><path d=\"M188 44 L184 58 M210 44 L214 58\" stroke=\"#a0673a\" stroke-width=\"4\"/><ellipse cx=\"150\" cy=\"40\" rx=\"20\" ry=\"9\"/><circle cx=\"170\" cy=\"30\" r=\"7\"/><path d=\"M138 46 L134 60 M160 46 L164 60\" stroke=\"#a0673a\" stroke-width=\"4\"/></g><g stroke=\"#7a4a26\" stroke-width=\"2.5\" fill=\"none\"><path d=\"M220 22 L216 10 M222 22 L230 12 M170 24 L166 12 M172 24 L180 14\"/></g><circle cx=\"227\" cy=\"29\" r=\"3\" fill=\"#e2413b\"/><circle cx=\"177\" cy=\"31\" r=\"3\" fill=\"#e2413b\"/><path d=\"M60 40 L140 38 M60 46 L190 40\" stroke=\"#ffcc00\" stroke-width=\"1.5\"/><path d=\"M10 30 Q14 54 34 54 L80 54 Q92 54 92 40 L92 28 L60 28 L50 40 L20 40 Z\" fill=\"#e2413b\"/><path d=\"M4 60 Q40 66 96 58\" stroke=\"#ffcc00\" stroke-width=\"4\" fill=\"none\" stroke-linecap=\"round\"/><circle cx=\"62\" cy=\"18\" r=\"10\" fill=\"#f6c9a8\"/><path d=\"M52 14 Q60 -2 74 8 L72 14 Z\" fill=\"#e2413b\"/><rect x=\"50\" y=\"12\" width=\"26\" height=\"5\" rx=\"2.5\" fill=\"#fff\"/><path d=\"M54 20 Q62 34 70 20 Z\" fill=\"#fff\"/><rect x=\"18\" y=\"20\" width=\"22\" height=\"18\" rx=\"3\" fill=\"#1fa65a\"/><rect x=\"27\" y=\"20\" width=\"4\" height=\"18\" fill=\"#ffcc00\"/><rect x=\"36\" y=\"16\" width=\"16\" height=\"14\" rx=\"3\" fill=\"#f7861a\"/></svg>", boneco:"<svg viewBox=\"0 0 90 120\" xmlns=\"http://www.w3.org/2000/svg\"><circle cx=\"45\" cy=\"88\" r=\"28\" fill=\"#fff\" stroke=\"#dbe2f0\"/><circle cx=\"45\" cy=\"44\" r=\"20\" fill=\"#fff\" stroke=\"#dbe2f0\"/><rect x=\"28\" y=\"16\" width=\"34\" height=\"8\" fill=\"#141c46\"/><rect x=\"33\" y=\"0\" width=\"24\" height=\"18\" fill=\"#141c46\"/><rect x=\"33\" y=\"12\" width=\"24\" height=\"4\" fill=\"#e2413b\"/><circle cx=\"38\" cy=\"40\" r=\"2.5\" fill=\"#141c46\"/><circle cx=\"52\" cy=\"40\" r=\"2.5\" fill=\"#141c46\"/><path d=\"M45 46 L60 49 L45 51Z\" fill=\"#f7861a\"/><path d=\"M26 60 Q45 70 64 60 L66 66 Q45 76 24 66Z\" fill=\"#e2413b\"/><path d=\"M58 64 L64 82 L56 82Z\" fill=\"#e2413b\"/><circle cx=\"45\" cy=\"80\" r=\"2.5\" fill=\"#141c46\"/><circle cx=\"45\" cy=\"92\" r=\"2.5\" fill=\"#141c46\"/></svg>" };
const NOEL_FALAS = { noel:['Ho ho ho! Já bateu a meta de hoje?','Tô de olho em quem tá ligando pros clientes! 🎅','Presente bom é pedido fechado! 🎁','Quem bate a meta ganha bola dourada ✨'], rena:['Puxar trenó cansa… vender é mais fácil! 🦌','Meu nariz acende quando você fecha pedido! 🔴','Bora! O Noel tá contando os presentes 🎁','Pedido lançado é pedido entregue! 🚚'], boneco:['Brrr… só esquenta com venda! ⛄','Ligou pro cliente hoje? ☎️','Não deixa a meta derreter! ⛄'] };
function noelPersonagens() {
  if (window.innerWidth < 760) return;
  const ped = !!document.getElementById('bVolta');
  const quer = ped ? 'rena' : (S.cart ? 'noel' : 'boneco');
  let p = document.querySelector('.noel-pers');
  if (p && p.dataset.k !== quer) { p.remove(); p = null; }
  if (!p) { p = document.createElement('button'); p.type = 'button'; p.className = 'noel-pers ' + quer; p.dataset.k = quer; p.setAttribute('aria-label', 'Personagem de Natal');
    p.innerHTML = NOEL_ART[quer] + '<span class="noel-fala"></span>'; document.body.appendChild(p);
    let i = Math.floor(Math.random() * NOEL_FALAS[quer].length);
    p.onclick = () => { const f = p.querySelector('.noel-fala'); f.textContent = NOEL_FALAS[quer][i++ % NOEL_FALAS[quer].length]; p.classList.remove('falando'); void p.offsetWidth; p.classList.add('falando'); }; }
  if (!document.querySelector('.noel-treno')) { const t = document.createElement('div'); t.className = 'noel-treno'; t.setAttribute('aria-hidden', 'true'); t.innerHTML = NOEL_ART.treno; document.body.appendChild(t); }
}
async function noelBoot() {
  NOEL.boot = true; await noelCarregar();
  const f = document.getElementById('noelFaixa'); if (f) f.remove(); noelInjetar();
  const h = noelHoje(); if (!NOEL.jan || (h > NOEL.fimJanelas && !noelTeste)) return;
  const k = `larconoel_${h}_${S.me.id}`; try { if (localStorage.getItem(k) && !noelTeste) return; localStorage.setItem(k, '1'); } catch(e) {}
  noelPopup();
}
new MutationObserver(() => {
  if (!S.me) { NOEL.boot = false; document.body.classList.remove('noel'); document.querySelectorAll('.noel-neve,.noel-pers,.noel-treno').forEach(e => e.remove()); return; }
  if (!noelAtivo()) return;
  if (!NOEL.boot) noelBoot(); else noelInjetar();
}).observe(document.getElementById('app'), {childList:true});
function noelPopup() {
  const j = NOEL.jan; if (!j || document.querySelector('.noel-pop')) return;
  const mc = noelMinhas(), meu = noelLista().find(x => x.carts.some(c => mc.has(c)));
  const nome = (S.me.nome || '').split(' ')[0];
  const d = document.createElement('div'); d.className = 'modal noel-pop';
  d.innerHTML = `<div class="mbox noel-box"><img src="natal/larco-noel.jpg" alt="Arte da campanha Larco Noel" class="noel-img">
    <div class="noel-cx"><p class="noel-eb">${noelTeste && noelHoje() < NOEL.ini ? 'PRÉVIA · ' : ''}${esc(dt(j.dia))} · ${esc(j.titulo)}</p>
    <div class="noel-caixa" aria-hidden="true"><i></i></div>
    <h3>${j.coletiva ? 'Desafio coletivo de hoje' : `Seu desafio de hoje${nome ? ', ' + esc(nome) : ''}`}</h3>
    <p class="noel-des">${esc(j.desafio)}</p>
    <p class="noel-val">Vale ${j.presentes > 1 ? `${j.presentes} presentes 🎁🎁` : '1 presente 🎁'} · até o fechamento de hoje</p>
    ${meu ? `<p class="noel-meu">Você tem <b>${meu.presentes}</b> 🎁 na árvore${meu.metaDia ? ` · meta do dia: <b>${nf(meu.metaDia,1)} m³</b>` : ''}</p>` : ''}
    <p class="noel-reg">Quem juntar mais presentes até o fechamento vira o <b>Noel de Ouro</b> e leva o brinde!</p>
    <div class="mact"><button type="button" class="btn sec" id="nArv">Ver árvore</button><button type="button" class="btn" id="nOk">Bora! 🚀</button></div></div></div>`;
  document.body.appendChild(d);
  d.onclick = e => { if (e.target === d) d.remove(); };
  d.querySelector('#nOk').onclick = () => d.remove();
  d.querySelector('#nArv').onclick = () => { d.remove(); noelArvore(); };
}
async function noelArvore() {
  let d = document.querySelector('.noel-arv');
  if (!d) { d = document.createElement('div'); d.className = 'modal noel-arv'; d.innerHTML = '<div class="mbox noel-abox"><p class="sub">Carregando a árvore…</p></div>'; document.body.appendChild(d);
    d.onclick = e => { if (e.target === d) d.remove(); }; }
  await noelCarregar();
  const L = noelLista(), mc = noelMinhas(), adm = !!S.podeMeta, h = noelHoje();
  const regs = REGIOES.filter(r => L.some(x => x.regiao === r)).concat([...new Set(L.map(x => x.regiao))].filter(r => !REGIOES.includes(r)));
  const minha = (L.find(x => x.carts.some(c => mc.has(c))) || {}).regiao;
  if (!NOEL.reg || !regs.includes(NOEL.reg)) NOEL.reg = minha || regs[0];
  const abertas = NOEL.abertas.filter(j => j.dia <= h || noelTeste);
  if (!NOEL.diaSel || !abertas.some(j => j.dia === NOEL.diaSel)) NOEL.diaSel = (abertas.filter(j => j.dia <= h).pop() || abertas[0] || {}).dia;
  const jSel = abertas.find(j => j.dia === NOEL.diaSel);
  const ganhou = new Set(NOEL.pres.filter(p => p.dia === NOEL.diaSel).map(p => p.carteira));
  const LR = L.filter(x => x.regiao === NOEL.reg);
  const tMeta = LR.reduce((t, x) => t + x.meta, 0), tReal = LR.reduce((t, x) => t + x.real, 0);
  const estrela = tMeta && tReal >= tMeta;
  const rows = []; let i = 0, n = 1; while (i < LR.length) { rows.push(LR.slice(i, i + n)); i += n; n++; }
  const bola = x => { const key = avKey(x.nome), eu = x.carts.some(c => mc.has(c));
    return `<div class="nb ${x.bola}${eu ? ' eu' : ''}" title="${esc(x.nome)} · ${x.bola === 'ouro' ? 'acumulado acima da meta' : x.bola === 'on' ? 'bateu a meta do dia' : 'ainda apagada'}">
      <span class="nb-c">${AV[key] ? avImg(key) : `<b>${esc(iniciais(x.nome))}</b>`}</span><span class="nb-n">${esc((x.nome || '').split(' ')[0])}</span><span class="nb-p">${x.presentes ? '🎁×' + x.presentes : '—'}</span></div>`; };
  const rank = [...L].sort((a, b) => b.presentes - a.presentes || (b.pct || 0) - (a.pct || 0)).slice(0, 10);
  d.querySelector('.mbox').outerHTML = `<div class="mbox noel-abox"><div class="na-h"><div><h3>🎄 Árvore Larco Noel</h3><p class="sub">Bola acesa = bateu a meta do dia · dourada = acumulado acima da meta · a estrela acende quando a equipe bate a meta do mês.</p></div><button type="button" class="btn sec" id="naX">Fechar</button></div>
    <div class="chips mv-reg">${regs.map(r => `<button type="button" data-r="${esc(r)}" class="${r === NOEL.reg ? 'on' : ''}">${esc(r)}</button>`).join('')}</div>
    <div class="na-g"><div class="na-tree"><div class="na-star ${estrela ? 'on' : ''}">★</div><div class="na-rows">${rows.map(r => `<div class="na-row">${r.map(bola).join('')}</div>`).join('') || '<p class="sub">Sem dados de vendas para esta equipe.</p>'}</div><div class="na-tronco"></div>
      <p class="na-tot">${tMeta ? `Equipe: ${nf(tReal)} de ${nf(tMeta)} m³ (${nf(100 * tReal / tMeta, 0)}%)` : 'Equipe sem meta cadastrada'}</p></div>
      <div class="na-rank"><h4>Corrida pelo Noel de Ouro</h4><ol>${rank.map(x => `<li class="${x.carts.some(c => mc.has(c)) ? 'eu' : ''}"><span>${esc(x.nome)}</span><b>${x.presentes} 🎁</b></li>`).join('')}</ol><p class="sub">Empate: vence o maior % da meta do mês.</p></div></div>
    ${adm && jSel ? `<div class="na-adm"><h4>Marcar presentes</h4><label class="sub">Janela <select id="naDia">${abertas.map(j => `<option value="${j.dia}" ${j.dia === NOEL.diaSel ? 'selected' : ''}>${esc(dt(j.dia))} · ${esc(j.titulo)}</option>`).join('')}</select></label>
      <p class="sub">${esc(jSel.titulo)} vale ${jSel.presentes} 🎁 · clique em quem cumpriu (${esc(NOEL.reg)}).${jSel.coletiva ? ' <button type="button" class="btn sec" id="naTodos">Marcar a equipe toda</button>' : ''}</p>
      <div class="na-chk">${LR.map(x => `<label><input type="checkbox" data-c="${esc(x.carts[0])}" ${x.carts.some(c => ganhou.has(c)) ? 'checked' : ''}> ${esc(x.nome)}</label>`).join('')}</div></div>` : ''}</div>`;
  d.querySelector('#naX').onclick = () => d.remove();
  d.querySelectorAll('.mv-reg button').forEach(b => b.onclick = () => { NOEL.reg = b.dataset.r; noelArvore(); });
  if (!adm || !jSel) return;
  d.querySelector('#naDia').onchange = e => { NOEL.diaSel = e.target.value; noelArvore(); };
  const marcar = async (cart, on) => {
    if (on) await api('natal_presentes?on_conflict=dia,carteira', {method:'POST', headers:{Prefer:'resolution=merge-duplicates,return=minimal'}, body:JSON.stringify({dia:jSel.dia, carteira:cart, qtd:jSel.presentes})});
    else await api(`natal_presentes?dia=eq.${jSel.dia}&carteira=eq.${encodeURIComponent(cart)}`, {method:'DELETE'});
  };
  d.querySelectorAll('.na-chk input').forEach(c => c.onchange = async () => {
    try { await marcar(c.dataset.c, c.checked); toast(c.checked ? 'Presente entregue 🎁' : 'Presente removido'); noelArvore(); } catch(x) { c.checked = !c.checked; toast('Erro ao salvar o presente'); } });
  const bt = d.querySelector('#naTodos'); if (bt) bt.onclick = async () => {
    try { for (const x of LR) await marcar(x.carts[0], true); toast('Equipe toda ganhou 🎁'); noelArvore(); } catch(x) { toast('Erro ao salvar os presentes'); } };
}
