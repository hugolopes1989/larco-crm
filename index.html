<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Larco CRM</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* VOICE: ferramenta de trabalho diária, direta, sem enfeite
   IDEA: a prancheta do consultor — fila de ligações à esquerda, ficha do cliente à direita
   PICTURE: a própria fila com semáforo e o mapa da carteira
   COLOUR and TYPE: azul Larco #16226e/#2a5ae0, laranja #f7861a de destaque, amarelo #ffcc00 só em detalhe, vermelho #e2413b para alerta; Poppins nos títulos e números + Inter no texto
   LAYOUT: barra de indicadores no topo, abas, lista + ficha em duas colunas */
:root{--g:#16226e;--g2:#2a5ae0;--or:#f7861a;--ye:#ffcc00;--lime:#e7eeff;--coral:#e2413b;--amb:#f2a516;--ok:#1fa65a;--bg:#f2f4fa;--card:#fff;--ink:#141c46;--mut:#5b6386;--line:#e1e5f0}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Inter,system-ui,sans-serif}
h1,h2,h3{font-family:Poppins,Inter,sans-serif;margin:0;line-height:1.1}
button,input,select,textarea{font:inherit}
.btn{border:0;border-radius:8px;padding:9px 14px;background:var(--g);color:#fff;cursor:pointer;font-weight:600;min-height:40px}
.btn.sec{background:#fff;color:var(--g);border:1px solid var(--line)}
.btn:disabled{opacity:.5;cursor:default}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.row:focus-visible,button:focus-visible{outline:3px solid var(--ye);outline-offset:1px}
header{background:var(--g);color:#fff;padding:10px max(3vw,14px);display:flex;gap:14px;align-items:center;flex-wrap:wrap;border-bottom:3px solid var(--or)}
.brand{display:flex;align-items:center;gap:8px}.brand .lg{font:800 22px/1 Poppins,sans-serif;letter-spacing:.06em}.brand .crm{font:700 12px/1 Poppins,sans-serif;background:var(--or);color:#fff;border-radius:6px;padding:5px 7px;letter-spacing:.08em}
header h1{font-size:20px}header .sp{flex:1}
header select{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.35);border-radius:8px;padding:7px 10px}header select option{color:var(--ink)}
header .btn.sec{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.45)}
header .who{font-size:13px;opacity:.85}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--line);border-bottom:1px solid var(--line)}
.kpi{background:var(--card);padding:12px 16px}.kpi b{display:block;font:700 24px Poppins,Inter,system-ui,sans-serif;white-space:nowrap}.kpi span{font-size:12.5px;color:var(--mut)}
.kpi.alert b{color:var(--coral)}
.spk{display:inline-flex;gap:2px;align-items:flex-end;height:18px;width:50px;vertical-align:middle}.spk i{flex:1;background:#b9c4ee;border-radius:2px 2px 0 0}.spk i.cur{background:var(--g2)}
.ev{font:700 11.5px Inter,sans-serif;border-radius:6px;padding:1px 5px;margin-left:4px}.ev.up{background:#e3f6ea;color:#127a3e}.ev.dn{background:#fdecea;color:#b32a22}.ev.eq{background:#eef1f9;color:var(--mut)}
.evl{display:inline-flex;align-items:center;margin-top:3px;white-space:nowrap}

.agrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px}
.ab{all:unset;box-sizing:border-box;cursor:pointer;border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;background:#fff;transition:transform .12s,border-color .12s}.ab:hover,.ab:focus-visible{border-color:var(--or);transform:translateY(-2px)}.ab:focus-visible{outline:3px solid var(--ye)}
.ab b{font:700 15px Poppins,sans-serif;color:var(--g)}.ab span{font-size:12.5px;color:var(--mut)}.ab em{font-style:normal;font-weight:700;color:#c25e00}.ab small{font-size:11.5px;color:var(--mut)}
.lnk{border:0;background:none;color:var(--g2);font:600 12.5px Inter,sans-serif;cursor:pointer;text-decoration:underline;margin-left:6px}

.alvo{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;background:#fff4e8;border:1px solid #fbd3a8;border-radius:12px;padding:10px 12px;margin-bottom:10px;font-size:13.5px}.alvo select{border:1px solid #f3b77a;border-radius:8px;padding:5px 8px;font-weight:700;color:var(--g)}.alvo-n b{color:var(--or)}
.alvo-v{color:#c25e00}.tag.c.pb{background:#ffe9d2;color:#a24c00}

.avi{display:block;object-fit:cover}.avi.av{width:36px;height:36px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 2px var(--g2)}.who2 .avi.av{width:30px;height:30px}
.hc{background:linear-gradient(120deg,var(--g),#1d36a8 60%,var(--g2));color:#fff;padding:18px max(3vw,14px);position:relative;overflow:hidden}
.hc::after{content:'';position:absolute;right:-60px;top:-90px;width:300px;height:300px;border-radius:50%;background:radial-gradient(circle,rgba(247,134,26,.35),transparent 65%)}
.hc-in{position:relative;z-index:1;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.hc-ph{width:92px;height:92px;border-radius:22px;overflow:hidden;border:3px solid var(--ye);box-shadow:0 6px 18px rgba(0,0,0,.25);flex:none;background:var(--g2)}.hc-ph img{width:100%;height:100%;object-fit:cover}
.hc-ph.ini{display:grid;place-items:center;font:800 30px Poppins,sans-serif}
.hc-t{flex:1;min-width:220px}.hc-t h2{font:800 clamp(22px,2.6vw,30px)/1.1 Poppins,sans-serif;margin:0}.hc-t .hsub{margin:6px 0 0;opacity:.92;font-size:14px}.hc-t .hsub b{color:var(--ye)}
.hc-meta{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);border-radius:14px;padding:10px 14px;min-width:220px}.hc-meta span{font-size:12px;opacity:.85}.hc-meta b{display:block;font:800 26px Poppins,sans-serif}.hc-meta em{font-style:normal;font-size:12px;color:var(--ye)}.hc-meta .track{background:rgba(255,255,255,.2);margin:4px 0}

.btn.sm{min-height:34px;padding:6px 12px;font-size:13px;background:var(--or)}
.modal{position:fixed;inset:0;background:rgba(20,28,70,.45);display:grid;place-items:center;z-index:5000;padding:16px}
.mbox{background:#fff;border-radius:18px;padding:20px;width:min(720px,100%);box-shadow:0 20px 60px rgba(0,0,0,.25)}.mbox h3{margin:0;font:700 19px Poppins,sans-serif;color:var(--g)}.mbox .sub{margin:4px 0 12px}
.mi{width:110px;border:1px solid var(--line);border-radius:8px;padding:6px 8px;text-align:right;font:600 14px Inter,sans-serif}.mact{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}

.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}.seg button{border:0;background:none;padding:7px 13px;font:600 13px Inter,sans-serif;color:var(--mut);cursor:pointer}.seg button.on{background:var(--g);color:#fff}
.hero{background:linear-gradient(120deg,var(--g) 0%,#1d36a8 55%,var(--g2) 100%);color:#fff;padding:26px max(3vw,14px) 64px;position:relative;overflow:hidden}
.hero::after{content:'';position:absolute;right:-80px;top:-120px;width:360px;height:360px;border-radius:50%;background:radial-gradient(circle,rgba(247,134,26,.35),transparent 65%)}
.hin{position:relative;z-index:1;max-width:1320px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.6fr);gap:22px;align-items:end}
@media(max-width:1000px){.hin{grid-template-columns:1fr}}
.eyebrow{margin:0 0 6px;color:var(--ye);font-weight:600;font-size:13px;letter-spacing:.02em}
.hero h2{font:800 clamp(26px,3.2vw,38px)/1.05 Poppins,sans-serif;margin:0}.hsub{margin:8px 0 0;opacity:.85;font-size:14px}
.hk{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}@media(max-width:700px){.hk{grid-template-columns:repeat(2,minmax(0,1fr))}}
.hk>div{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);border-radius:14px;padding:12px 14px;backdrop-filter:blur(4px)}
.hk span{display:block;font-size:12px;opacity:.85}.hk b{display:block;font:800 26px/1.15 Poppins,sans-serif;white-space:nowrap;margin-top:2px}.hk b small{font-size:13px;font-weight:600;opacity:.8}
.hk em{display:block;font-style:normal;font-size:12px;color:var(--ye);margin-top:2px}.hk .warn{background:rgba(226,65,59,.28);border-color:rgba(255,160,150,.5)}
main.eq{max-width:1320px;margin:-44px auto 0;padding:0 max(3vw,14px) 40px;position:relative;z-index:2}
.blk{background:var(--card);border-radius:18px;padding:18px 20px;margin-bottom:16px;box-shadow:0 2px 0 rgba(22,34,110,.04),0 10px 30px rgba(22,34,110,.06)}
.bh{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:12px}.bh h3{margin:0;font:700 19px Poppins,sans-serif;color:var(--g)}.bh .sub{margin:2px 0 0;font-size:13px;color:var(--mut)}
.bh-r{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.bh-r select{border:1px solid var(--line);border-radius:10px;padding:7px 10px;background:#fff;font:500 13px Inter,sans-serif}
.strip{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin-bottom:14px}@media(max-width:900px){.strip{grid-template-columns:repeat(2,minmax(0,1fr))}}
.st{background:#f5f7fd;border-radius:12px;padding:10px 12px}.st b{display:block;font:800 22px/1.15 Poppins,sans-serif;color:var(--g)}.st span{font-size:12px;color:var(--mut)}.st.ok b{color:var(--ok)}.st.alert{background:#fdecea}.st.alert b{color:var(--coral)}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.pc{border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;transition:transform .15s,box-shadow .15s}.pc:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(22,34,110,.08)}
.pc.zero{background:#fff8f7;border-color:#f6cdc8}
.pc-h{display:flex;gap:10px;align-items:center}.pc-h b{display:block;font-size:14px;line-height:1.2}.pc-h small{color:var(--mut);font-size:12px}
.av{flex:none;width:36px;height:36px;border-radius:50%;background:var(--g);color:#fff;display:grid;place-items:center;font:700 13px Poppins,sans-serif}.av.ext{background:var(--or)}
.pc-n{display:grid;grid-template-columns:auto 1fr;align-items:baseline;gap:0 8px}.pc-n b{font:800 28px/1 Poppins,sans-serif;color:var(--g)}.pc-n span{font-size:12px;color:var(--mut)}
.spark{grid-column:1/-1;height:5px;background:#eef1f9;border-radius:3px;overflow:hidden;margin-top:6px}.spark i{display:block;height:100%;background:linear-gradient(90deg,var(--g2),var(--or))}
.res{display:flex;height:8px;border-radius:4px;overflow:hidden;background:#eef1f9}.res i{display:block}
.v{background:var(--ok)}.q{background:#7b8cf0}.l{background:var(--coral)}.o{background:#c8cee0}.e{background:#eef1f9}.f{background:var(--or)}
.pc-m{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--mut)}.pc-m b{color:var(--ink)}
.pc-f{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--mut);border-top:1px dashed var(--line);padding-top:7px}.pc-f .pend{color:var(--coral);font-weight:600}.pc-f .late{color:var(--coral);font-weight:600}
.legend .sq{display:inline-block;width:10px;height:10px;border-radius:3px}
.chips{display:flex;gap:6px;flex-wrap:wrap}.chips button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 12px;font:600 12.5px Inter,sans-serif;color:var(--mut);cursor:pointer}.chips button.on{background:var(--or);border-color:var(--or);color:#fff}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.cc{all:unset;box-sizing:border-box;cursor:pointer;border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:9px;background:#fff;transition:transform .15s,box-shadow .15s,border-color .15s}
.cc:hover,.cc:focus-visible{transform:translateY(-3px);box-shadow:0 12px 26px rgba(22,34,110,.1);border-color:var(--g2)}.cc:focus-visible{outline:3px solid var(--ye)}
.cc-top{display:flex;align-items:center;gap:8px}.code{font:800 18px Poppins,sans-serif;color:var(--g)}.pill{font-size:11px;background:var(--lime);color:var(--g);border-radius:999px;padding:2px 8px;font-weight:600}
.badge{margin-left:auto;background:var(--coral);color:#fff;font:700 12px Poppins,sans-serif;border-radius:999px;padding:3px 9px}
.who2{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:600}.who2 .av{width:28px;height:28px;font-size:11px}.who2 small{font-weight:500;color:var(--mut)}
.cc-num{display:grid;grid-template-columns:1fr 1fr;gap:8px}.cc-num b{display:block;font:800 22px/1.1 Poppins,sans-serif}.cc-num span{font-size:11.5px;color:var(--mut)}
.track{height:7px;background:#eef1f9;border-radius:4px;overflow:hidden}.track i{display:block;height:100%;background:linear-gradient(90deg,var(--g2),var(--or));border-radius:4px}
.cc-row{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--mut)}.cc-row b{color:var(--ink);margin-left:auto}
.ring{width:22px;height:22px;border-radius:50%;background:conic-gradient(var(--g2) calc(var(--p)*1%),#e6eaf5 0);-webkit-mask:radial-gradient(circle 7px,transparent 98%,#000 100%);mask:radial-gradient(circle 7px,transparent 98%,#000 100%)}
.semf{display:flex;height:6px;border-radius:3px;overflow:hidden;background:#eef1f9}.semf i{display:block;height:100%}
.cc-foot{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:2px 10px;font-size:11.5px;color:var(--mut)}.cc-foot b{color:var(--g)}
.dias{display:grid;grid-template-columns:repeat(14,minmax(0,1fr));gap:8px;align-items:end;height:220px}
.dcol{display:flex;flex-direction:column;align-items:center;height:100%;justify-content:flex-end;font-size:11px}
.dcol .n{font:700 12px Poppins,sans-serif;color:var(--g);min-height:15px}
.dcol .pil{width:72%;height:120px;display:flex;flex-direction:column-reverse;background:#f2f4fa;border-radius:8px 8px 3px 3px;overflow:hidden}.dcol .pil i{display:block;width:100%}
.dcol .vol{width:72%;height:30px;display:flex;align-items:flex-start;margin-top:3px}.dcol .vol i{display:block;width:100%;background:var(--or);border-radius:0 0 6px 6px;opacity:.85}
.dcol .vn{font-size:10.5px;color:var(--or);font-weight:600;min-height:13px}.dcol .dl{color:var(--mut);margin-top:2px;white-space:nowrap}.dcol.fds{opacity:.4}.dcol.hj .dl{color:var(--or);font-weight:700}.dcol.hj .pil{box-shadow:0 0 0 2px var(--or)}
@media(max-width:700px){.dias{gap:3px}.dcol .vn{display:none}}
table.atvt td,table.atvt th{white-space:nowrap}table.atvt tr.zero td{background:#fff8f7}
.mot{display:grid;grid-template-columns:180px 1fr 40px;gap:10px;align-items:center;margin:6px 0;font-size:13.5px;color:var(--ink)}
.login-wrap{min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,var(--g),#1d36a8 60%,var(--g2));padding:20px}
.login .brand{justify-content:center;margin-bottom:6px}.login .brand .lg{color:var(--g);font-size:30px}.login .brand .crm{font-size:14px}


.kpi.wide b{font-size:17px;white-space:normal;line-height:1.35}.bar.sm{display:inline-block;width:70px;margin:0 6px 0 0;vertical-align:middle}
.bar{height:6px;border-radius:3px;background:#e7ecea;margin-top:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--g)}
nav.tabs{display:flex;gap:4px;padding:10px max(3vw,14px) 0;flex-wrap:wrap}
nav.tabs button{border:0;background:none;padding:10px 14px;border-radius:8px 8px 0 0;cursor:pointer;color:var(--mut);font-weight:600}
.leva{color:var(--g);font-size:12px}.leva b{color:var(--or)}table.sem tr.hj td{background:#fff6e6}table.sem td:nth-child(2){min-width:120px}
nav.tabs button.on{background:var(--card);color:var(--g);box-shadow:0 -2px 0 var(--g) inset}
nav.tabs .n{background:var(--coral);color:#fff;border-radius:10px;padding:0 7px;font-size:12px;margin-left:6px}
main{padding:0 max(3vw,14px) 30px}
.wrap{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:14px;background:var(--card);border-radius:0 10px 10px 10px;padding:14px;min-height:70vh}
@media(max-width:900px){.wrap{grid-template-columns:1fr}}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.tools input,.tools select{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:#fff;min-height:40px}
.tools input{flex:1;min-width:160px}
.list{max-height:72vh;overflow:auto;border:1px solid var(--line);border-radius:8px}
.row{display:grid;grid-template-columns:14px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line);cursor:pointer}
.row:hover{background:#f5f7fd}.row.sel{background:var(--lime)}
.dot{width:12px;height:12px;border-radius:50%}
.verde{background:var(--ok)}.amarelo{background:var(--amb)}.vermelho{background:var(--coral)}.sem_compra{background:#8e7cc3}
.row .nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .sub{font-size:12.5px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .num{text-align:right;font-size:13px;white-space:nowrap}.row .num b{display:block;font-size:14px}
.tag{display:inline-block;font-size:11.5px;border-radius:10px;padding:1px 8px;background:#eef2f1;color:var(--mut);margin-right:4px;white-space:nowrap}
.tag.p{background:#ffe4df;color:#b2402c}.tag.c{background:#e8e4f7;color:#4b3a8f}.dbar{display:grid;grid-template-columns:120px 1fr 70px;gap:8px;align-items:center;font-size:13px;margin:3px 0}.dbar .bar{margin:0;height:9px}.dbar.larco .bar i{background:var(--ok)}.dbar:not(.larco) .bar i{background:#8e7cc3}.tag.d{background:var(--lime);color:var(--g)}
.ficha{border:1px solid var(--line);border-radius:8px;padding:16px;max-height:80vh;overflow:auto}
.ficha h2{font-size:20px}.ficha .meta{color:var(--mut);font-size:13px;margin:4px 0 12px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:10px 0}
@media(max-width:600px){.grid4{grid-template-columns:repeat(2,minmax(0,1fr))}}
.mini{background:#f6f8f7;border-radius:8px;padding:8px 10px}.mini b{display:block;font:700 17px Poppins,Inter,system-ui,sans-serif;white-space:nowrap}.mini span{font-size:12px;color:var(--mut)}
h3{font-size:15px;margin:16px 0 8px}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left}th{color:var(--mut);font-weight:600}td.r,th.r{text-align:right;white-space:nowrap}
form.ct{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;background:#f6f8f7;padding:12px;border-radius:8px}
form.ct label{font-size:12.5px;color:var(--mut);display:flex;flex-direction:column;gap:3px}
form.ct .full{grid-column:1/-1}
form.ct input,form.ct select,form.ct textarea{border:1px solid var(--line);border-radius:6px;padding:8px;background:#fff;font-size:15px}
.hist{border-left:3px solid var(--line);padding:4px 0 4px 10px;margin:6px 0;font-size:13px}
.hist b{font-weight:600}
.empty{color:var(--mut);padding:30px;text-align:center}
.msg{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:8px;display:none;z-index:9999}
#map{height:72vh;border-radius:8px}.uflbl{font:700 12px Inter,sans-serif;color:#16226e;opacity:.6;width:auto!important;height:auto!important;background:none;border:0}
.login{width:100%;max-width:380px;margin:0;background:#fff;padding:28px;border-radius:12px;box-shadow:0 6px 30px rgba(0,0,0,.08)}
.login p{color:var(--mut);margin:0 0 18px;text-align:center}
.login input{width:100%;border:1px solid var(--line);border-radius:8px;padding:11px;margin-bottom:10px;font-size:16px}
.err{color:#b2402c;font-size:13px;min-height:18px}
.sup table td{white-space:nowrap}.sup tr.click{cursor:pointer}.sup tr.click:hover{background:#f6faf9}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12.5px;color:var(--mut);margin:6px 0}.legend span{display:flex;align-items:center;gap:5px}
.scroll{overflow-x:auto}
</style>
</head>

async function auth(body, grant) {

  try { localStorage.setItem('larcocrm_rt', j.refresh_token); } catch(e) {}
}
async function api(path, opt = {}) {

  const r = await fetch(`${SB_URL}/rest/v1/${path}`, {...opt, headers:{apikey:SB_KEY, Authorization:`Bearer ${S.token}`, 'Content-Type':'application/json', ...(opt.headers||{})}});

}

  $('#fl').onsubmit = async e => { e.preventDefault(); try { await auth({email:$('#em').value.trim(), password:$('#pw').value}, 'password'); await iniciar(); } catch(x) { telaLogin('E-mail ou senha incorretos.'); } };
}
function telaTrocaSenha(err='') {

  const nav = `<nav class="tabs">${tabs.map(([k,l,n]) => `<button data-t="${k}" class="${S.tab===k?'on':''}">${l}${n?`<span class="n">${n}</span>`:''}${k==='recup'?` (${nRec})`:''}${k==='prosp'?` (${nPros})`:''}</button>`).join('')}</nav>`;
  const corpo = S.tab === 'mapa' ? `<div class="wrap" style="grid-template-columns:1fr"><div>${legenda()}<div id="map"></div></div></div>` :
    `<div class="wrap"><div>${ferramentas()}<div class="list" id="lista"></div></div><div class="ficha" id="ficha"><div class="empty">Selecione um cliente na lista.</div></div></div>`;
  $('#app').innerHTML = hdr + heroConsultor(r) + kp + nav + `<main>${corpo}</main>`;
  ligarHeader();
  document.querySelectorAll('nav.tabs button').forEach(b => b.onclick = () => { S.tab = b.dataset.t; S.sel = null; render(); });
  if (S.tab === 'mapa') desenharMapa(); else { ligarFerramentas(); desenharLista(); }
}
function ligarHeader() {
  $('#bSair').onclick = sair;
  $('#selCart').onchange = async e => { S.cart = e.target.value || null; S.sel = null; S.tab = S.cart ? 'hoje' : 'equipe'; await abrir(); };
}

function listaDist() { const c = {}; Object.values(S.dist).forEach(d => (d.distribuidoras||[]).forEach(x => { if (x.d !== 'LARCO') c[x.d] = (c[x.d]||0) + 1; })); return Object.keys(c).sort((a,b) => c[b]-c[a]); }

const PROD_NOME = {DIESEL:'Diesel', GASOLINA:'Gasolina', ETANOL:'Etanol'};
function totProd() {
  const t = {}; Object.values(S.prod || {}).forEach(ps => (ps||[]).forEach(p => { if (p.mercado == null) return; const k = p.p; t[k] = t[k] || {mercado:0, larco:0, potencial:0}; t[k].mercado += +p.mercado||0; t[k].larco += +p.larco||0; t[k].potencial += +p.potencial||0; }));
  return Object.entries(t).filter(([k,v]) => v.mercado >= 1).sort((a,b) => b[1].potencial - a[1].potencial);
}
function kpiProd() {
  const t = totProd(); if (!t.length) return '';
  return `<div class="kpi wide"><b>${t.map(([k,v]) => `${esc(PROD_NOME[k]||k)} ${nf(v.potencial)}`).join(' · ')}</b><span>Potencial a conquistar por produto (m³/mês, clientes + prospects)</span></div>`;
}
function secaoProd(id) {
  const ps = (S.prod?.[id] || []).filter(p => p.mercado != null && +p.mercado > 0); if (!ps.length) return '';
  return `<h3>Potencial por produto (Espião × Larco, m³/mês)</h3><div class="scroll"><table><tr><th>Produto</th><th class="r">Mercado</th><th class="r">Larco</th><th class="r">Espaço</th><th>Share Larco</th></tr>${ps.map(p => { const sh = Math.min(100, 100*(+p.larco||0)/(+p.mercado||1)); return `<tr><td>${esc(PROD_NOME[p.p]||p.p)}</td><td class="r">${nf(p.mercado)}</td><td class="r">${nf(p.larco,1)}</td><td class="r"><b>${nf(p.potencial)}</b></td><td><div class="bar sm"><i style="width:${Math.max(2,sh)}%"></i></div><span class="sub">${nf(sh,0)}%</span></td></tr>`; }).join('')}</table></div>`;
}
function secaoSemana(id) {
  const s = S.sem?.[id]; if (!s || !s.dias_total) return '';
  const hab = s.dias_habituais || [], hj = diaHoje();
  const linhas = [1,2,3,4,5,6,7].map(d => { const r = (s.dias||[]).find(z => z.d === d); if (!r) return '';
    const pct = Math.round(100 * (+r.pct||0)), h = hab.includes(d);
    return `<tr class="${d===hj?'hj':''}"><td>${DOW[d][2]}${h?' <span class="tag d">habitual</span>':''}</td><td><div class="bar sm"><i style="width:${Math.max(3,pct)}%"></i></div><span class="sub">${pct}% · ${r.n}x</span></td><td>${(r.prods||[]).map(p => `${esc(PNOME(p.p))} <b>${nf(p.m3, (+p.m3<10 && +p.m3%1)?1:0)}</b>`).join(' · ')}</td></tr>`; }).join('');
  return `<h3>Dia da semana em que compra (últimos 120 dias · ${s.dias_total} compras)</h3>${hab.length?`<div class="sub" style="font-size:13px;margin-bottom:6px">Costuma comprar às <b>${esc(txtHab(id))}</b>. Volumes = média por compra naquele dia.</div>`:'<div class="sub" style="font-size:13px;margin-bottom:6px">Sem dia fixo. Volumes = média por compra naquele dia.</div>'}<div class="scroll"><table class="sem"><tr><th>Dia</th><th>Frequência</th><th>Produtos (m³ por compra)</th></tr>${linhas}</table></div>`;
}
function secaoDist(id) {
  const ds = S.dist[id]?.distribuidoras || []; if (!ds.length) return '';
  const tot = ds.reduce((s,x) => s + (+x.m3||0), 0) || 1;
  return `<h3>Compra hoje de (Espião, média mensal)</h3>` + ds.map(x => `<div class="dbar ${x.d==='LARCO'?'larco':''}"><span>${esc(x.d)}</span><div class="bar"><i style="width:${Math.max(3,100*(+x.m3||0)/tot)}%"></i></div><span class="r">${nf(x.m3)} m³</span></div>`).join('');

/* ---------- MAPA ---------- */
function legenda() { return `<div class="legend"><span><i class="dot verde"></i>Comprando</span><span><i class="dot amarelo"></i>Esfriando</span><span><i class="dot vermelho"></i>Parado</span><span><i class="dot sem_compra"></i>Prospect (bandeira branca)</span></div>`; }
function desenharMapa() {
  if (typeof L === 'undefined') { $('#map').innerHTML = '<div class="empty">Mapa indisponível (sem conexão com o servidor de mapas).</div>'; return; }
  const m = L.map('map').setView([-7.5, -39], 6); const tiles = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', {maxZoom:18, attribution:'Tiles © Esri'}).addTo(m);
  let falhas = 0; tiles.on('tileerror', () => { if (++falhas === 4) { m.removeLayer(tiles); $('#map').style.background = '#eef3f1'; } });
  L.geoJSON(UFS_GEO, {style:{color:'#00463c', weight:1.2, fillColor:'#dfe9e5', fillOpacity:.25}, interactive:false}).addTo(m);
  UFS_GEO.features.forEach(f => { const b = L.geoJSON(f).getBounds(); L.marker(b.getCenter(), {icon:L.divIcon({className:'uflbl', html:f.properties.uf}), interactive:false}).addTo(m); });
  const cor = {verde:'#2f9e5b', amarelo:'#f2b233', vermelho:'#ff6f59', sem_compra:'#8e7cc3'};
  const pts = S.rows.filter(x => x.lat && x.lon && (ehProsp(x) || x.ultima_compra));
  pts.forEach(x => {
    const r = !x.ultima_compra ? 5 + Math.min(12, Math.sqrt(x.vmm_mercado||0)/3) : 5 + Math.min(12, Math.sqrt((x.volume_12m||0)/12)/3);
    L.circleMarker([x.lat, x.lon], {radius:r, color:'#fff', weight:1, fillColor:cor[x.semaforo], fillOpacity:.85}).addTo(m)
      .bindPopup(`<b>${esc(x.razao_social)}</b><br>${esc(x.municipio||'')}<br>${!x.ultima_compra ? (x.vmm_mercado?nf(x.vmm_mercado)+' m³/mês no mercado':'Prospect') : nf((x.volume_12m||0)/12)+' m³/mês com a Larco'}`);
  });
  if (pts.length) m.fitBounds(pts.map(x => [x.lat, x.lon]), {padding:[20,20]}); else m.setView([-8, -37], 6);
  const sem = S.rows.filter(x => !x.lat && (ehProsp(x) || x.ultima_compra)).length;
  if (sem) $('.legend').insertAdjacentHTML('beforeend', `<span>${sem} sem coordenada no cadastro ANP</span>`);
}

/* ---------- EQUIPE (supervisor) ---------- */
function telaEquipe() {
  S.perAtv = S.perAtv || 'hoje'; S.fReg = S.fReg || ''; S.ordC = S.ordC || 'proj'; S.vAtv = S.vAtv || 'cards';
  const R = S.resumo; const tot = k => R.reduce((s,r) => s + (+r[k]||0), 0);
  const h = hojeSP(); const hora = h.getHours(); const saud = hora < 12 ? 'Bom dia' : hora < 18 ? 'Boa tarde' : 'Boa noite';
  const dataTxt = (t => t[0].toUpperCase() + t.slice(1))(h.toLocaleDateString('pt-BR', {weekday:'long', day:'numeric', month:'long'}));

    </div></div></section>
  <main class="eq">

     <select id="ordC" aria-label="Ordenar carteiras">${[['proj','Maior projeção'],['pend','Mais pendências'],['posit','Menor positivação'],['nome','Código']].map(([k,l])=>`<option value="${k}" ${S.ordC===k?'selected':''}>${l}</option>`).join('')}</select></div></div>

const regiao = c => { const m = c.match(/^(PE|AL|PB|RN|CE|JUA|MA|PI|SNP)/); return m ? m[1] : c.split(' ')[0]; };
const iniciais = n => (n||'?').split(' ').filter(Boolean).slice(0,2).map(x=>x[0]).join('').toUpperCase();
function desenharCarteiras() {
  const ext = {}; (S.pessoas||[]).filter(p => p.perfil === 'externo').forEach(p => (p.carteiras||'').split(', ').forEach(c => ext[c] = p.nome.split(' ')[0]));
  const hoje = {}; (S.pessoas||[]).filter(p => p.perfil !== 'externo').forEach(p => (p.carteiras||'').split(', ').forEach(c => hoje[c] = +p.contatos||0));
  let R = S.resumo.filter(r => !S.fReg || regiao(r.carteira_codigo) === S.fReg);
  const o = {proj:(a,b)=>(+b.projecao_m3||0)-(+a.projecao_m3||0), pend:(a,b)=>(+b.pendencias||0)-(+a.pendencias||0), posit:(a,b)=>(+a.positivacao_pct||0)-(+b.positivacao_pct||0), nome:(a,b)=>a.carteira_codigo.localeCompare(b.carteira_codigo)};
  R = [...R].sort(o[S.ordC]);
  const mxP = Math.max(1, ...S.resumo.map(r => +r.projecao_m3||0));
  $('#carts').innerHTML = R.map(r => { const v=+r.verdes||0, a=+r.amarelos||0, m=+r.vermelhos||0, t=Math.max(1,v+a+m); const pos=+r.positivacao_pct||0;
    const pctMeta = r.meta_m3 ? Math.min(100, 100*r.projecao_m3/r.meta_m3) : 100*(+r.projecao_m3||0)/mxP;
    return `<button class="cc" data-c="${esc(r.carteira_codigo)}">
      <div class="cc-top"><span class="code">${esc(r.carteira_codigo)}</span>${r.aceita_prospect===false?'<span class="pill">fixa</span>':''}${+r.pendencias?`<span class="badge" title="clientes aguardando contato">${r.pendencias}</span>`:''}</div>
      <div class="who2">${AV[CART_AV[r.carteira_codigo]] ? avImg(CART_AV[r.carteira_codigo], "av") : `<span class="av">${iniciais(r.consultor_nome)}</span>`}<span>${esc(r.consultor_nome||'')}${ext[r.carteira_codigo]?`<small> + ${esc(ext[r.carteira_codigo])} (externo)</small>`:''}</span></div>
      <div class="cc-num"><div><b>${nf(r.volume_mes)}</b><span>m³ no mês</span></div><div><b>${nf(r.projecao_m3)}</b><span>projeção${r.meta_m3?` · meta ${nf(r.meta_m3)}`:''}</span></div></div>
      <div class="track" title="${r.meta_m3?'projeção ÷ meta':'projeção comparada à maior carteira'}"><i style="width:${Math.max(2,pctMeta)}%"></i></div>
      <div class="cc-row"><span>Positivação</span><b>${nf(pos,0)}%</b><span class="ring" style="--p:${pos}"></span></div>
      <div class="semf" title="${v} comprando · ${a} esfriando · ${m} parados"><i class="verde" style="width:${100*v/t}%"></i><i class="amarelo" style="width:${100*a/t}%"></i><i class="vermelho" style="width:${100*m/t}%"></i></div>
      <div class="cc-foot"><span>${v} comprando · ${a} esfriando · ${m} parados</span><span style="white-space:nowrap">${hoje[r.carteira_codigo]!=null?`<b>${hoje[r.carteira_codigo]}</b> contatos hoje`:''}</span></div>
    </button>`; }).join('') || '<div class="empty">Nenhuma carteira nesta região.</div>';
  document.querySelectorAll('.cc').forEach(el => el.onclick = async () => { S.cart = el.dataset.c; S.tab = 'hoje'; await abrir(); });
}
const hojeSP = () => new Date(new Date().toLocaleString('en-US', {timeZone:'America/Sao_Paulo'}));
const iso = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
function periodo(k) { const h = hojeSP(), a = new Date(h);
  if (k === 'ontem') { a.setDate(a.getDate()-1); if (a.getDay() === 0) a.setDate(a.getDate()-1); return [iso(a), iso(a)]; }
  if (k === '7d') { a.setDate(a.getDate()-6); return [iso(a), iso(h)]; }
  if (k === 'mes') { a.setDate(1); return [iso(a), iso(h)]; }
  return [iso(h), iso(h)]; }
const rpc = (fn, args) => api(`rpc/${fn}`, {method:'POST', body:JSON.stringify(args)});
function ultTxt(r) { if (!r.ultimo_registro) return {t:'nunca registrou', late:true};
  const d = new Date(r.ultimo_registro); const dias = Math.floor((hojeSP() - new Date(d.toLocaleString('en-US',{timeZone:'America/Sao_Paulo'})))/864e5);
  return {t: d.toLocaleString('pt-BR', {timeZone:'America/Sao_Paulo', day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit'}), late: dias >= 2}; }
async function carregarAtividade() {
  const [ini, fim] = periodo(S.perAtv); let L;

  const sum = k => L.reduce((s,r) => s + (+r[k]||0), 0);
  const ct = sum('contatos'), at = ct - sum('nao_atendeu'), conv = at ? 100*sum('vendeu')/at : null;
  const du = Math.max(1, +(L[0]?.dias_uteis || 1)); const semReg = L.filter(r => !+r.contatos).length;
  const disc = L.length ? 100 * L.reduce((s,r) => s + Math.min(1, (+r.dias_com_registro||0)/du), 0) / L.length : null;
  const lbl = {hoje:'hoje', ontem:'ontem', '7d':'nos 7 dias', mes:'no mês'}[S.perAtv];
  $('#atvKpi').innerHTML = [
    [nf(ct), `Contatos ${lbl}`], [nf(sum('clientes')), 'Clientes trabalhados'], [nf(sum('vendeu')), 'Vendas registradas', 'ok'],
    [conv==null?'–':nf(conv,0)+'%', 'Conversão'], [nf(sum('cotou')), 'Cotações'], [nf(sum('perdeu')), 'Perdas'],
    [nf(sum('volume_cotado')), 'm³ cotados/vendidos'], [nf(sum('prospects')), 'Prospects abordados'],
    [`${semReg}/${L.length}`, `Sem registro ${lbl}`, semReg ? 'alert' : ''],
    [disc==null?'–':nf(disc,0)+'%', 'Disciplina de registro']

  if (!L.length) { $('#atvTab').innerHTML = '<div class="empty">Nenhum consultor nas suas carteiras.</div>'; return; }
  const ord = [...L].sort((a,b) => (+b.contatos||0)-(+a.contatos||0) || a.nome.localeCompare(b.nome));
  const mxC = Math.max(1, ...L.map(r => +r.contatos||0));
  if (S.vAtv === 'cards') {
    $('#atvTab').innerHTML = `<div class="pgrid">${ord.map(r => { const c=+r.contatos||0, a=c-(+r.nao_atendeu||0); const u=ultTxt(r);
      const seg=(n,cl)=> n?`<i class="${cl}" style="flex:${n}"></i>`:'';
      return `<div class="pc ${c?'':'zero'}"><div class="pc-h">${r.perfil!=='externo' && AV[avKey(r.nome)] ? avImg(avKey(r.nome), "av") : `<span class="av ${r.perfil==='externo'?'ext':''}">${iniciais(r.nome)}</span>`}<div><b>${esc(r.nome)}</b><small>${r.perfil==='externo'?'Externo':'Interno'} · ${esc(r.carteiras)}</small></div></div>
        <div class="pc-n"><b>${nf(c)}</b><span>contatos${S.perAtv!=='hoje'&&S.perAtv!=='ontem'?` · ${nf(c/du,1)}/dia`:''}</span><div class="spark"><i style="width:${100*c/mxC}%"></i></div></div>
        <div class="res">${seg(+r.vendeu,'v')}${seg(+r.cotou,'q')}${seg(+r.perdeu,'l')}${seg((+r.sem_demanda||0)+(+r.nao_atendeu||0),'o')}${c?'':'<i class="e" style="flex:1"></i>'}</div>
        <div class="pc-m"><span><b>${nf(r.vendeu)}</b> vendas</span><span><b>${nf(r.cotou)}</b> cotações</span><span><b>${a?nf(100*r.vendeu/a,0)+'%':'–'}</b> conversão</span></div>
        <div class="pc-m"><span>📞 ${nf(r.ligacoes)}</span><span>💬 ${nf(r.whatsapp)}</span><span>🚗 ${nf(r.visitas)}</span><span title="dias úteis com registro">📅 ${nf(r.dias_com_registro)}/${nf(du)}</span></div>
        <div class="pc-f"><span class="${+r.pendencias_hoje?'pend':''}">${nf(r.pendencias_hoje)} aguardando contato</span><span class="${u.late?'late':''}">${u.t}</span></div></div>`; }).join('')}</div>
      <div class="legend"><span><i class="sq v"></i>Vendeu</span><span><i class="sq q"></i>Cotou</span><span><i class="sq l"></i>Perdeu</span><span><i class="sq o"></i>Sem demanda / não atendeu</span></div>`;
  } else {
    $('#atvTab').innerHTML = `<div class="scroll"><table class="atvt"><tr><th>Pessoa</th><th>Carteiras</th><th class="r">Contatos</th><th class="r">Média/dia</th><th class="r">Clientes</th><th class="r">📞</th><th class="r">💬</th><th class="r">🚗</th><th class="r">Vendeu</th><th class="r">Cotou</th><th class="r">Perdeu</th><th class="r">Conversão</th><th class="r">Prospects</th><th class="r">Dias c/ registro</th><th class="r">Aguardando</th><th>Último registro</th></tr>
    ${ord.map(r => { const a = (+r.contatos) - (+r.nao_atendeu); const u = ultTxt(r);
      return `<tr class="${+r.contatos?'':'zero'}"><td><b>${esc(r.nome)}</b> <span class="tag ${r.perfil==='externo'?'c':''}">${r.perfil==='externo'?'Externo':'Interno'}</span></td><td class="sub">${esc(r.carteiras)}</td>
      <td class="r"><b>${nf(r.contatos)}</b></td><td class="r">${nf((+r.contatos)/du,1)}</td><td class="r">${nf(r.clientes)}</td><td class="r">${nf(r.ligacoes)}</td><td class="r">${nf(r.whatsapp)}</td><td class="r">${nf(r.visitas)}</td>
      <td class="r">${nf(r.vendeu)}</td><td class="r">${nf(r.cotou)}</td><td class="r">${nf(r.perdeu)}</td><td class="r">${a?nf(100*r.vendeu/a,0)+'%':'–'}</td><td class="r">${nf(r.prospects)}</td>
      <td class="r">${nf(r.dias_com_registro)}/${nf(du)}</td><td class="r" style="${+r.pendencias_hoje?'color:#c2311f;font-weight:600':''}">${nf(r.pendencias_hoje)}</td><td>${u.late?`<span class="tag p">${u.t}</span>`:u.t}</td></tr>`; }).join('')}</table></div>`;
  }

async function carregarDias() {
  try {
    const h = hojeSP(), a = new Date(h); a.setDate(a.getDate()-13);
    const D = await rpc('atividade_diaria', {p_ini:iso(a), p_fim:iso(h)});
    const mx = Math.max(1, ...D.map(d => +d.contatos)), mv = Math.max(1, ...D.map(d => +d.volume_vendido||0));
    $('#atvDia').innerHTML = `<div class="dias">${D.map(d => { const dt_ = new Date(d.dia+'T12:00:00'); const fds = dt_.getDay()===0, hj = d.dia === iso(h);
      const seg = (n,c) => n ? `<i class="${c}" style="height:${100*n/mx}%"></i>` : '';
      return `<div class="dcol ${fds?'fds':''} ${hj?'hj':''}" title="${dt(d.dia)}: ${d.contatos} contatos (${d.vendeu} vendas, ${d.cotou} cotações, ${d.perdeu} perdas) · ${d.pessoas} pessoas registrando · ${nf(d.volume_vendido||0)} m³ faturados para ${d.clientes_compraram||0} clientes">
        <span class="n">${+d.contatos||''}</span><div class="pil">${seg(+d.vendeu,'v')}${seg(+d.cotou,'q')}${seg(+d.perdeu,'l')}${seg(+d.outros,'o')}</div>
        <div class="vol"><i style="height:${100*(+d.volume_vendido||0)/mv}%"></i></div><span class="vn">${+d.volume_vendido?nf(d.volume_vendido):''}</span>
        <span class="dl">${hj?'hoje':dt_.toLocaleDateString('pt-BR',{weekday:'short'}).slice(0,3)} ${String(dt_.getDate()).padStart(2,'0')}</span></div>`; }).join('')}</div>
      <div class="legend"><span><i class="sq v"></i>Vendeu</span><span><i class="sq q"></i>Cotou</span><span><i class="sq l"></i>Perdeu</span><span><i class="sq o"></i>Sem demanda / não atendeu</span><span><i class="sq f"></i>m³ faturados no dia (Qlik)</span></div>`;
  } catch(e) { $('#atvDia').textContent = 'Não foi possível carregar.'; }
}
function abrirMetas() {
  const h = hojeSP(); const mes = iso(new Date(h.getFullYear(), h.getMonth(), 1)); const nomeMes = h.toLocaleDateString('pt-BR',{month:'long', year:'numeric'});
  const R = [...S.resumo].sort((a,b) => a.carteira_codigo.localeCompare(b.carteira_codigo));
  const d = document.createElement('div'); d.className = 'modal';
  d.innerHTML = `<form class="mbox" id="fMetas"><h3>Metas de ${esc(nomeMes)} (m³)</h3><p class="sub">A projeção dos cartões passa a mostrar o % da meta. Deixe em branco para não cadastrar.</p>
    <div class="scroll" style="max-height:60vh"><table><tr><th>Carteira</th><th>Consultor</th><th class="r">Vendido no mês</th><th class="r">Projeção</th><th class="r">Meta</th></tr>
    ${R.map(r => `<tr><td><b>${esc(r.carteira_codigo)}</b></td><td>${esc(r.consultor_nome||'')}</td><td class="r">${nf(r.volume_mes)}</td><td class="r">${nf(r.projecao_m3)}</td><td class="r"><input class="mi" data-c="${esc(r.carteira_codigo)}" inputmode="decimal" value="${r.meta_m3!=null?String(r.meta_m3).replace('.',','):''}"></td></tr>`).join('')}
    </table></div><div class="mact"><button type="button" class="btn sec" id="mCanc">Cancelar</button><button class="btn">Salvar metas</button></div></form>`;
  document.body.appendChild(d);
  $('#mCanc').onclick = () => d.remove(); d.onclick = e => { if (e.target === d) d.remove(); };
  $('#fMetas').onsubmit = async e => { e.preventDefault();
    const body = [...d.querySelectorAll('.mi')].filter(i => i.value.trim()).map(i => ({carteira_codigo:i.dataset.c, mes, meta_m3:Number(i.value.replace(/\./g,'').replace(',','.'))}));
    if (body.some(b => !(b.meta_m3 > 0))) return toast('Confira os valores: use só números.');
    try { await api('metas?on_conflict=carteira_codigo,mes', {method:'POST', headers:{Prefer:'resolution=merge-duplicates,return=minimal'}, body:JSON.stringify(body)});
      d.remove(); toast('Metas salvas'); S.resumo = await api('v_carteira_resumo?select=*&order=carteira_codigo'); if (!['supervisor','gerente_corp'].includes(S.me.perfil)) S.resumo = S.resumo.filter(r => S.carteiras.includes(r.carteira_codigo)); render();
    } catch(er) { toast('Erro ao salvar: ' + er.message); } };
}
async function ligarEquipe() {
  desenharCarteiras();
  document.querySelectorAll('#perAtv button').forEach(b => b.onclick = () => { S.perAtv = b.dataset.p; document.querySelectorAll('#perAtv button').forEach(x => x.classList.toggle('on', x === b)); carregarAtividade(); });
  document.querySelectorAll('#vAtv button').forEach(b => b.onclick = () => { S.vAtv = b.dataset.v; document.querySelectorAll('#vAtv button').forEach(x => x.classList.toggle('on', x === b)); carregarAtividade(); });
  document.querySelectorAll('#fReg button').forEach(b => b.onclick = () => { S.fReg = b.dataset.r; document.querySelectorAll('#fReg button').forEach(x => x.classList.toggle('on', x === b)); desenharCarteiras(); });
  $('#ordC').onchange = e => { S.ordC = e.target.value; desenharCarteiras(); };
  if ($('#bMetas')) $('#bMetas').onclick = abrirMetas;
  if (S.perAtv !== 'hoje') { try { S.pessoas = await rpc('atividade_equipe', {p_ini:iso(hojeSP()), p_fim:iso(hojeSP())}); desenharCarteiras(); const c = S.pessoas.reduce((s,r)=>s+(+r.contatos||0),0); $('#hkHoje').textContent = nf(c); $('#hkHojeS').textContent = `${S.pessoas.filter(r=>+r.contatos).length} de ${S.pessoas.length} pessoas registraram`; } catch(e) {} }
  carregarAtividade(); carregarDias();
  try {
    const ini = new Date(); ini.setDate(1); const mot = await api(`v_motivos_perda?mes=eq.${ini.toISOString().slice(0,10)}&select=*`);
    const ag = {}; mot.forEach(m => ag[m.motivo_perda] = (ag[m.motivo_perda]||0) + m.qtd); const tot = Object.values(ag).reduce((a,b)=>a+b,0);
    $('#motivos').innerHTML = tot ? Object.entries(ag).sort((a,b)=>b[1]-a[1]).map(([k,v]) => `<div class="mot"><span>${MOT[k]||k}</span><div class="track"><i style="width:${100*v/tot}%;background:var(--coral)"></i></div><span class="r">${v}</span></div>`).join('') : 'Nenhuma perda registrada no mês.';
  } catch(e) { $('#motivos').textContent = 'Não foi possível carregar.'; }
}
